<title>Sunset Clause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#ECEEF0; --surface:#FFFFFF; --surface-2:#F4F6F7; --surface-3:#E4E8EB;
  --ink:#14181C; --ink-2:#4A545C; --ink-3:#79848D;
  --rule:#D2D9DE; --rule-strong:#B6C0C7;
  --accent:#8A2F32; --accent-ink:#FFFFFF; --accent-wash:#F3E6E6;
  --teal:#1F5F66; --teal-wash:#E2EDEE;
  --amber:#9C6510; --amber-wash:#F5EADA;
  --blue:#2C4E8A; --blue-wash:#E3E9F3;
  --green:#2C6B50; --green-wash:#E2EEE8;
  --red:#A33131; --red-wash:#F5E3E3;
  --grey-wash:#E8ECEE;
  --shadow:0 1px 2px rgba(20,24,28,.06), 0 6px 20px rgba(20,24,28,.05);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1317; --surface:#171C21; --surface-2:#1D242A; --surface-3:#252D34;
    --ink:#E4E9ED; --ink-2:#A4AFB7; --ink-3:#78838C;
    --rule:#2A323A; --rule-strong:#3B444D;
    --accent:#D97F84; --accent-ink:#1A0F10; --accent-wash:#341F21;
    --teal:#63AEB4; --teal-wash:#17302F;
    --amber:#D9A445; --amber-wash:#332816;
    --blue:#89A6DC; --blue-wash:#1B2436;
    --green:#6BB795; --green-wash:#162C23;
    --red:#E38C8C; --red-wash:#38201F;
    --grey-wash:#232A30;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1317; --surface:#171C21; --surface-2:#1D242A; --surface-3:#252D34;
  --ink:#E4E9ED; --ink-2:#A4AFB7; --ink-3:#78838C;
  --rule:#2A323A; --rule-strong:#3B444D;
  --accent:#D97F84; --accent-ink:#1A0F10; --accent-wash:#341F21;
  --teal:#63AEB4; --teal-wash:#17302F;
  --amber:#D9A445; --amber-wash:#332816;
  --blue:#89A6DC; --blue-wash:#1B2436;
  --green:#6BB795; --green-wash:#162C23;
  --red:#E38C8C; --red-wash:#38201F;
  --grey-wash:#232A30;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.005em}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.rail{flex:0 0 228px;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--rule)}
.brand .crest{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.brand h1{font-size:19px;line-height:1.15;margin-top:6px}
.brand .sub{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.35}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:baseline;gap:8px;padding:8px 9px;border-radius:3px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:500}
.nav a .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:15px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-wash);color:var(--accent)}
.nav a[aria-current="page"] .n{color:var(--accent)}
.railfoot{border-top:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.who{display:flex;align-items:center;gap:7px}
.who label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.who input{width:52px;background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:3px 6px;font-family:var(--mono);font-size:11px;color:var(--ink);text-transform:uppercase}
.dbstat{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3);line-height:1.3}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.dot.live{background:var(--green)} .dot.local{background:var(--amber)}
.themebtn{background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 8px;font-size:11px;color:var(--ink-2);cursor:pointer;align-self:flex-start}
.themebtn:hover{border-color:var(--rule-strong);color:var(--ink)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:9px 28px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.tb{display:flex;align-items:baseline;gap:8px;min-width:0}
.tb .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.tb .v{font-size:13px;font-weight:500}
.tb .v.count{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tb.alert .v{color:var(--accent)}
main{padding:30px 28px 72px;max-width:1220px;width:100%}

/* ---------- headings ---------- */
.vh{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.vh .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.vh h2{font-size:27px}
.vh p{margin:8px 0 0;color:var(--ink-2);max-width:66ch;font-size:13.5px}
h3.sec{font-size:16px;margin:32px 0 12px;display:flex;align-items:baseline;gap:10px}
h3.sec:first-child{margin-top:0}
h3.sec .tally{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
.note{font-size:12px;color:var(--ink-3);max-width:72ch;margin:8px 0 0}

/* ---------- seal / countdown ---------- */
.seal{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:8px}
.seal>div{background:var(--surface);padding:15px 16px 14px}
.seal .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.seal .big{font-family:var(--serif);font-size:38px;line-height:1;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.seal .big.hot{color:var(--accent)}
.seal .cap{font-size:11.5px;color:var(--ink-2);margin-top:7px;line-height:1.35}

/* ---------- gantt ---------- */
.gantt{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:0 0 6px;overflow-x:auto}
.gantt-in{min-width:760px;padding:14px 18px 8px}
.axis{position:relative;height:19px;border-bottom:1px solid var(--rule);margin-bottom:11px}
.axis span{position:absolute;top:0;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.gantt-row{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;margin-bottom:5px}
.gantt-row .lab{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.25}
.gantt-row .lab b{display:block;color:var(--ink);font-weight:500;font-size:12.5px}
.track{position:relative;height:20px;background:linear-gradient(var(--surface-2),var(--surface-2));border-radius:2px}
.bar{position:absolute;top:3px;height:14px;border-radius:2px;background:var(--teal);opacity:.82}
.bar.now{background:var(--accent)}
.vline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--accent)}
.vline.now{border-left:1px solid var(--accent);opacity:.5}
.hardrow{background:transparent;border-top:1px solid var(--rule)}
.hardlab{position:absolute;left:0;top:3px;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.gantt-marks{position:relative;height:56px;margin-top:6px;border-top:1px solid var(--rule);padding-top:4px}
.mark{position:absolute;top:4px;transform:translateX(-50%);text-align:center;width:24px}
.mark i{display:block;width:7px;height:7px;margin:0 auto;background:var(--surface);border:1.5px solid var(--ink-2);transform:rotate(45deg)}
.mark.done i{background:var(--green);border-color:var(--green)}
.mark.active i{background:var(--accent);border-color:var(--accent)}
.mark b{display:block;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);padding:8px 18px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- ledger ---------- */
.ledger{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.ledger th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400;padding:9px 11px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;background:var(--surface-2)}
.ledger td{padding:8px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
.ledger tr:last-child td{border-bottom:0}
.ledger tr:hover td{background:var(--surface-2)}
.ledger .num{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger .ti{font-weight:500;line-height:1.35}
.ledger .meta{color:var(--ink-3);font-size:11.5px;margin-top:3px;line-height:1.4}
.tablewrap{overflow-x:auto;border-radius:3px}
.gaprow td{background:var(--grey-wash)!important;color:var(--ink-3);font-size:11.5px;font-style:italic;padding:7px 11px}

/* ---------- chips, pills ---------- */
.chip{display:inline-block;padding:1px 6px;border-radius:2px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;background:var(--grey-wash);color:var(--ink-2);white-space:nowrap}
.chip+.chip{margin-left:3px}
.chip.p{background:var(--blue-wash);color:var(--blue)}
.chip.n{background:var(--amber-wash);color:var(--amber)}
.chip.i{background:var(--accent-wash);color:var(--accent)}
.chip.x{background:var(--red-wash);color:var(--red)}
.chip.link{background:var(--teal-wash);color:var(--teal);cursor:pointer;border:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;background:var(--grey-wash);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}
.pill.green{background:var(--green-wash);color:var(--green)}
.pill.amber{background:var(--amber-wash);color:var(--amber)}
.pill.red{background:var(--red-wash);color:var(--red)}
.pill.blue{background:var(--blue-wash);color:var(--blue)}
.pill.teal{background:var(--teal-wash);color:var(--teal)}
.pill.grey{background:var(--grey-wash);color:var(--ink-3)}

/* ---------- controls ---------- */
select,input[type=text],input[type=search],textarea{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:4px 7px;max-width:100%}
select:hover,input:hover{border-color:var(--rule-strong)}
textarea{width:100%;resize:vertical;line-height:1.45;font-size:12.5px;min-height:34px}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:11px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.filters label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:-4px}
.filters input[type=search]{flex:1;min-width:150px}
.clearbtn{background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font-size:11.5px;color:var(--ink-2);cursor:pointer}
.clearbtn:hover{border-color:var(--accent);color:var(--accent)}
.sel-dis{width:112px} .sel-own{width:150px}

/* ---------- tally bar ---------- */
.tallybar{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--surface-3);margin:0 0 9px}
.tallybar i{display:block;height:100%}
.tallykey{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-bottom:20px}
.tallykey b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.tallykey span i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* ---------- panels ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 17px}
.panel h4{font-size:14.5px;margin-bottom:3px}
.panel .lede{font-size:12px;color:var(--ink-3);margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:0}
.item{padding:10px 0;border-top:1px solid var(--rule)}
.item:first-child{border-top:0;padding-top:2px}
.item .top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.item .ti{font-weight:500;font-size:13px;line-height:1.35}
.item .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.date{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- cards (gates, pilots) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:3px;padding:14px 15px;display:flex;flex-direction:column;gap:8px}
.card.is-next{border-left-color:var(--accent)}
.card.is-done{border-left-color:var(--green)}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .id{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.card h4{font-size:14px;line-height:1.3}
.card p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.card .test{font-size:12px;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:10px;line-height:1.5}
.card .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.kv{display:flex;gap:6px;font-size:11.5px;color:var(--ink-3)}
.kv b{font-weight:500;color:var(--ink-2)}

/* ---------- matrices ---------- */
.matrix{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 18px}
.mx{display:grid;grid-template-columns:auto repeat(5,1fr);gap:3px}
.mx .ylab,.mx .xlab{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;text-align:center}
.mx .ylab{writing-mode:vertical-rl;transform:rotate(180deg);grid-row:span 5;padding-right:4px}
.cell{min-height:54px;border-radius:2px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;background:var(--surface-2);border:1px solid var(--rule)}
.cell.l1{background:var(--green-wash)} .cell.l2{background:var(--grey-wash)}
.cell.l3{background:var(--amber-wash)} .cell.l4{background:var(--red-wash)}
.tok{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:2px;background:var(--surface);border:1px solid var(--rule-strong);color:var(--ink);cursor:pointer;height:fit-content}
.tok:hover{border-color:var(--accent);color:var(--accent)}
.mxfoot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:7px;padding-left:22px}

/* ---------- detail drawer ---------- */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer[open]{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(10,14,18,.42)}
.drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--shadow);overflow-y:auto;padding:22px 24px 40px}
.drawer h3{font-size:19px;margin:6px 0 4px}
.drawer .close{position:absolute;top:14px;right:18px;background:none;border:0;font-size:19px;color:var(--ink-3);cursor:pointer;line-height:1}
.drawer .close:hover{color:var(--accent)}
.drow{padding:11px 0;border-top:1px solid var(--rule);font-size:13px;line-height:1.55;color:var(--ink-2)}
.drow .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

.draftbox{background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.drafthead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:16px 18px}
.drafthead h4{font-family:var(--serif);font-size:14.5px;font-weight:500;margin:0 0 3px}
.drafthead .lede{font-size:12px;color:var(--ink-3);margin:0;max-width:54ch}
.dobtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.dobtn:hover{filter:brightness(1.08)}
.dobtn[disabled]{opacity:.55;cursor:default;filter:none}
.dobtn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule);font-weight:400}
.dobtn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.draftbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:9px 18px;border-top:1px solid var(--rule);background:var(--amber-wash);font-size:12px;color:var(--ink-2)}
.draftbar b{color:var(--ink);font-weight:600}
.draftbody{padding:4px 18px 18px;border-top:1px solid var(--rule);max-width:74ch}
.draftbody h5{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:18px 0 7px;font-weight:400}
.draftbody h5:first-child{margin-top:14px}
.draftbody p{margin:0 0 9px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.draftbody ul{margin:0 0 9px;padding-left:18px}
.draftbody li{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-bottom:5px}
.draftbody .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.draftfoot{display:flex;gap:9px;padding:0 18px 16px;flex-wrap:wrap;align-items:center}
.ask{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
.ask input{flex:1;min-width:250px;font-size:15px;padding:11px 13px;font-family:var(--sans)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;border-left:1px solid var(--rule);padding:7px 13px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[disabled]{color:var(--ink-3);cursor:not-allowed;background:var(--surface-2)}
.basisnote{font-size:12px;color:var(--ink-3);margin:0 0 16px;max-width:74ch;line-height:1.5}
.egs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.eg{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;text-align:left}
.eg:hover{border-color:var(--accent);color:var(--accent)}
.answer{background:var(--surface);border:1px solid var(--rule);border-radius:3px;margin-bottom:18px}
.answer .q{padding:14px 18px 12px;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:18px;line-height:1.35}
.answer .bod{padding:2px 18px 16px;max-width:76ch}

<script>
const D = /*__DATA__*/;
const TODAY = new Date();

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = (s) => new Date(s + "T00:00:00");
const days = (a, b) => Math.round((day(b) - a) / 86400000);
const fmt = (s) => day(s).toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
const fmtShort = (s) => day(s).toLocaleDateString("en-AU", { day: "numeric", month: "short" });
const monthYear = (d) => d.toLocaleDateString("en-AU", { month: "short", year: "2-digit" });

const DISPOSITIONS = ["Not started", "Under review", "Retain", "Amend", "Rewrite", "Revoke", "Move to policy"];
const DISP_COLOUR = { "Not started": "var(--rule-strong)", "Under review": "var(--blue)", Retain: "var(--green)", Amend: "var(--amber)", Rewrite: "var(--teal)", Revoke: "var(--accent)", "Move to policy": "var(--ink-3)" };
const DISP_PILL = { "Not started": "grey", "Under review": "blue", Retain: "green", Amend: "amber", Rewrite: "teal", Revoke: "red", "Move to policy": "grey" };
const PROPOSAL_STATUS = ["Parked", "Triage", "In scope", "Out of scope", "Deferred to next review"];
const PS_PILL = { Parked: "grey", Triage: "blue", "In scope": "green", "Out of scope": "red", "Deferred to next review": "amber" };
const GATE_STATUS = ["Not started", "In progress", "At risk", "Complete"];
const GS_PILL = { "Not started": "grey", "In progress": "blue", "At risk": "red", Complete: "green" };
const RUN_STATUS = ["Planned", "Running", "Reporting", "Complete", "Dropped"];
const RS_PILL = { Planned: "grey", Running: "blue", Reporting: "amber", Complete: "green", Dropped: "red" };
const UNITS = [...new Set(D.clauses.map((c) => c.owner))].sort();
const TAG_LABEL = { P: ["p", "Permit"], N: ["n", "Notice"], I: ["i", "Offence"], D: ["", "Machinery"], X: ["x", "Superseded"] };

/* ---------- state ---------- */
const overlay = { clauses: {}, proposals: {}, gates: {}, pilots: {}, risks: {}, engagement: {} };
let dbDoc = null, dbExists = false;
let sampleFn = null;
const draft = { text: "", busy: false, at: null, err: "" };
const check = { q: "", basis: "current", busy: false, asked: "", answer: "", cites: [], deps: [], err: "" };
const filters = { q: "", part: "", disp: "", owner: "", tag: "", pstatus: "", punit: "" };
let initials = "";
try { initials = localStorage.getItem("llr-initials") || ""; } catch (e) {}

const ov = (kind, id, field, fallback) => {
  const o = overlay[kind] && overlay[kind][id];
  return o && o[field] !== undefined && o[field] !== null ? o[field] : fallback;
};
const stamp = (kind, id, patch) => {
  const body = Object.assign({}, patch, { at: new Date().toISOString().slice(0, 10) });
  if (initials) body.by = initials.toUpperCase();
  overlay[kind][id] = Object.assign({}, overlay[kind][id], body);
  write(kind, id, body);
  return body;
};
const editedNote = (kind, id) => {
  const o = overlay[kind][id];
  if (!o || !o.at) return "";
  return `<span class="meta">Changed ${esc(fmtShort(o.at))}${o.by ? " · " + esc(o.by) : ""}</span>`;
};

/* ---------- persistence ---------- */
async function write(kind, id, body) {
  if (!dbDoc) return;
  const patch = { [kind]: { [id]: body } };
  try {
    if (dbExists) await dbDoc.update(patch);
    else { await dbDoc.set(patch); dbExists = true; }
  } catch (e) {
    if (e && e.code === "invalid_argument" && !dbExists) {
      try { await dbDoc.set(patch); dbExists = true; return; } catch (e2) {}
    }
    setDbStatus("local", "Change not saved — working locally");
  }
}
function setDbStatus(kind, text) {
  const dot = $("#dbdot"), t = $("#dbtext");
  if (!dot) return;
  dot.className = "dot" + (kind ? " " + kind : "");
  t.textContent = text;
}
(async function connect() {
  const db = window.claude && (await window.claude.use("db"));
  if (!db) { setDbStatus("local", "Working copy — changes stay in this browser"); return; }
  dbDoc = db.doc("program/state");
  dbDoc.onSnapshot(
    (snap) => {
      dbExists = snap.exists;
      const data = snap.data() || {};
      for (const k of Object.keys(overlay)) overlay[k] = data[k] || {};
      setDbStatus("live", "Shared with the project team");
      render();
    },
    () => setDbStatus("local", "Shared copy unavailable — working locally"),
  );
})();

(async function connectSample() {
  const s = window.claude && (await window.claude.use("sample"));
  if (!s) return;
  sampleFn = s;
  render();
})();

/* ---------- the fortnightly update ---------- */
// Everything the drafter is allowed to know: the register as it stands right
// now, plus what the team changed in the last fortnight.
function stateBrief() {
  const L = [];
  const today = new Date().toISOString().slice(0, 10);
  L.push("TODAY: " + today);
  L.push(`LAW: ${LAW.title}, ${LAW.council}. Commenced ${LAW.commenced}. Sunsets ${LAW.sunset} — ${daysToSunset} days away, and cannot be extended.`);
  L.push(`Planned commencement of the new law ${gateDate(commence)}, leaving ${floatWeeks} weeks of float before the sunset.`);

  const t = clauseTally();
  L.push("", `CLAUSE REGISTER — ${D.clauses.length} operative clauses`);
  for (const d of DISPOSITIONS) if (t[d]) L.push(`- ${d}: ${t[d]}`);
  const out = {};
  for (const c of D.clauses) if (dispOf(c) === "Not started") out[ownerOf(c)] = (out[ownerOf(c)] || 0) + 1;
  const byUnit = Object.entries(out).sort((a, b) => b[1] - a[1]);
  if (byUnit.length) L.push("- Still without a disposition, by unit: " + byUnit.map(([u, k]) => `${u} ${k}`).join("; "));

  L.push("", "GATES");
  for (const g of GATES) {
    const d = days(TODAY, gateDate(g));
    const note = ov("gates", g.id, "note", "");
    L.push(`- ${g.id} ${gateDate(g)} (${d < 0 ? Math.abs(d) + " days overdue" : "in " + d + " days"}) — ${g.title}. ${g.forum}, owner ${ov("gates", g.id, "owner", g.owner)}. Status: ${gateStatus(g)}.${note ? " Note: " + note : ""}`);
  }

  const ps = {};
  for (const p of D.proposals) ps[pstatusOf(p)] = (ps[pstatusOf(p)] || 0) + 1;
  L.push("", "PROPOSALS — " + D.proposals.length + " in the backlog");
  L.push("- " + Object.entries(ps).map(([k, v]) => `${k}: ${v}`).join("; "));
  const parked = D.proposals.filter((p) => pstatusOf(p) === "Parked" || pstatusOf(p) === "Triage");
  for (const p of parked) L.push(`- Undecided: ${p.id} ${p.title} (raised ${p.raised}, ${p.unit}, sensitivity ${p.sensitivity})`);

  L.push("", "PILOTS");
  for (const p of D.pilots) L.push(`- ${p.id} ${p.title} — ${ov("pilots", p.id, "status", p.status)}, ${p.start} to ${p.end}, ${p.owner}`);
  L.push(`- All pilots must report by G4 on ${gateDate(GATES.find((g) => g.id === "G4"))}.`);

  L.push("", "RISKS scoring 9 or above");
  for (const r of D.risks) {
    const sc = ov("risks", r.id, "likelihood", r.likelihood) * ov("risks", r.id, "consequence", r.consequence);
    if (sc >= 9) L.push(`- ${r.id} (${sc}) ${r.title} — owner ${ov("risks", r.id, "owner", r.owner)}, ${ov("risks", r.id, "status", r.status)}`);
  }

  const cut = new Date(TODAY.getTime() - 14 * 86400000).toISOString().slice(0, 10);
  const moves = [];
  const NAME = { clauses: "clause", proposals: "proposal", gates: "gate", pilots: "pilot", risks: "risk", engagement: "engagement activity" };
  for (const kind of Object.keys(overlay))
    for (const [id, o] of Object.entries(overlay[kind] || {}))
      if (o && o.at && o.at >= cut) {
        const what = Object.keys(o).filter((k) => k !== "at" && k !== "by").map((k) => `${k} set to "${o[k]}"`).join(", ");
        moves.push(`- ${o.at}: ${NAME[kind]} ${id} — ${what}${o.by ? " (" + o.by + ")" : ""}`);
      }
  L.push("", "CHANGED IN THE LAST 14 DAYS");
  L.push(moves.length ? moves.sort().reverse().join("\n") : "- Nothing was changed in the register in the last fortnight.");

  return L.join("\n");
}

const DRAFT_PROMPT = `You are drafting the fortnightly Executive update for the project manager of the City of Stonnington Local Law review.

Write in plain Australian local-government English. Be specific: name dates, owners, and clause or reference numbers. No filler and no adjectives like "significant", "robust" or "exciting". Do not congratulate anyone. Where something needs a decision, say who has to make it and by when. Where the register shows nothing happened, say that plainly rather than padding it.

Use exactly these four headings, each on its own line in capitals:
WHERE WE ARE
WHAT MOVED THIS FORTNIGHT
WHAT NEEDS A DECISION
WATCH LIST

Plain text only. Start bullets with "- ". No markdown, no bold markers, no tables. Under 300 words in total.

Everything you know about the project is below. Do not invent activity that is not in it.

`;

async function draftUpdate() {
  if (!sampleFn || draft.busy) return;
  draft.busy = true; draft.err = ""; draft.text = "";
  render();
  try {
    const res = await sampleFn(DRAFT_PROMPT + stateBrief(), {
      modelTier: "complex",
      onText: ({ text }) => {
        draft.text = text;
        const el = document.getElementById("draftbody");
        if (el) el.innerHTML = renderDraft(text, true);
      },
    });
    draft.text = res.text;
    draft.at = new Date();
  } catch (e) {
    draft.err = e && e.code === "rate_limited"
      ? "Too many requests just now. Try again in a minute."
      : e && e.code === "not_granted"
        ? "Drafting needs your permission — reload and allow it when asked."
        : "The draft did not come back. Nothing in the register has changed.";
    if (e && e.text) draft.text = e.text;
  }
  draft.busy = false;
  render();
}

function renderDraft(text, streaming) {
  const parts = [];
  let inList = false;
  for (const raw of String(text).split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    const isHead = /^[A-Z][A-Z ,&'’-]{3,44}$/.test(line);
    if (isHead) {
      if (inList) { parts.push("</ul>"); inList = false; }
      parts.push(`<h5>${esc(line)}</h5>`);
    } else if (/^[-•]\s+/.test(line)) {
      if (!inList) { parts.push("<ul>"); inList = true; }
      parts.push(`<li>${esc(line.replace(/^[-•]\s+/, ""))}</li>`);
    } else {
      if (inList) { parts.push("</ul>"); inList = false; }
      parts.push(`<p>${esc(line)}</p>`);
    }
  }
  if (inList) parts.push("</ul>");
  if (streaming) parts.push('<span class="cursor"></span>');
  return parts.join("");
}

function draftPanel() {
  if (!sampleFn) return "";
  const has = draft.text || draft.busy || draft.err;
  return `
  <h3 class="sec">Fortnightly update <span class="tally">drafted from the register as it stands</span></h3>
  <div class="draftbox">
    <div class="drafthead">
      <div><h4>Executive update</h4>
        <p class="lede">Reads the clause register, the gates, the backlog, the pilots, the risk scores and every change made in the last fortnight — then drafts the note you would otherwise write by hand.</p></div>
      <button class="dobtn" id="draftbtn" type="button"${draft.busy ? " disabled" : ""}>${draft.busy ? "Drafting…" : has ? "Draft again" : "Draft the update"}</button>

    ${has ? `<div class="draftbar"><b>Draft only.</b> Nothing here is saved to the register, and no decision in this tool is recorded by it. Read it before it goes anywhere.</div>

    ${draft.text && !draft.busy ? `<div class="draftfoot">
      <button class="dobtn ghost" id="draftcopy" type="button">Copy to clipboard</button>

  </div>`;
}

/* ---------- the rule checker ---------- */
// Everyday words officers and traders use, mapped onto the words the law
// actually uses. Without this, "speakers" never finds cl.144 and "alfresco"
// never finds cl.126.
const SYNONYMS = {
  speaker: "amplified music noise audible sound", speakers: "amplified music noise audible sound",
  music: "amplified noise audible speaker", sound: "noise amplified audible", stereo: "amplified music",
  pa: "amplified public address", amplifier: "amplified", busk: "promotions spruik public address",
  busking: "promotions spruik public address", busker: "promotions spruik public address",
  loud: "noise amplified", noisy: "noise", decibel: "noise amplified", db: "noise amplified",

  dining: "footpath trading occupy goods commercial", parklet: "footpath trading occupy structure",
  streatery: "footpath trading occupy structure", table: "footpath trading occupy place item",
  tables: "footpath trading occupy place item", chair: "footpath trading occupy place item",
  chairs: "footpath trading occupy place item", umbrella: "footpath trading occupy structure",
  heater: "footpath trading occupy item thing", screen: "footpath trading occupy structure hoarding",
  cafe: "footpath trading goods sell", restaurant: "footpath trading goods sell commercial",
  pub: "liquor commercial amplified", bar: "liquor commercial amplified", venue: "commercial amplified liquor",
  business: "commercial goods sell trading", trader: "trading goods sell footpath",
  sign: "advertisement sign poster display", signage: "advertisement sign poster display",
  aframe: "advertisement footpath trading", advertising: "advertisement billboard poster",
  tree: "tree significant prune lop damage works protection", trees: "tree significant prune lop",
  prune: "tree prune lop significant", lop: "tree lop prune significant", canopy: "tree significant",
  branch: "tree prune overhanging", roots: "tree protection zone works",
  dog: "animal dog fencing excrement assistance", dogs: "animal dog fencing excrement",
  cat: "animal keeping policy", cats: "animal keeping policy", pet: "animal keeping",
  chicken: "animal keeping bird", chickens: "animal keeping bird", bees: "bee swarm wasp",
  bin: "waste receptacle rubbish hopper trade", bins: "waste receptacle rubbish hopper",
  skip: "bulk rubbish container road", rubbish: "waste receptacle bulk hard",
  hardwaste: "hard waste receptacle", recycling: "waste recycling receptacle collection",
  scooter: "wheeled recreational vehicle toy segway motorised",
  escooter: "wheeled recreational vehicle toy segway motorised",
  skateboard: "wheeled skateboard scooter prohibited articles reserve",
  bike: "bicycle wheeled reserve", bicycle: "bicycle wheeled reserve",
  drone: "drone model aeroplane helicopter reserve",
  alcohol: "liquor consume sealed container", drink: "liquor consume", drinking: "liquor consume",
  bbq: "barbecue fire reserve", barbecue: "barbecue fire reserve", fire: "fire barbecue incinerator alight",
  camp: "camp caravan tent council land", camping: "camp caravan tent", tent: "camp tent marquee",
  build: "building activity works permit hours", builder: "building activity hours asset protection",
  building: "building activity hours dust spoil material", construction: "building activity hours",
  crane: "crane mobile road boom", scaffold: "scaffolding hoarding protective", scaffolding: "scaffolding hoarding",
  renovation: "building activity permit hours", demolition: "building activity demolition",
  film: "filming commercial road council land", filming: "filming commercial", photography: "filming commercial",
  wedding: "reserve wedding permit", party: "street party festival procession occasional event",
  festival: "street festival procession party", market: "itinerant trading sell stall goods",
  stall: "itinerant trading stall sell goods", charity: "street appeal collection solicit clothing bin",
  fence: "fence fencing vacant dilapidated", fencing: "fence fencing vacant dogs",
  parking: "parking permit vehicle road residential", permit: "permit application conditions duration",
  crossing: "vehicle crossing road access", driveway: "vehicle crossing",
  ev: "obstruction road council land", charging: "obstruction road council land",
  trolley: "shopping trolley", trolleys: "shopping trolley",
  graffiti: "graffiti advertisement deface", weeds: "vermin noxious weeds unsightly",
  grass: "unsightly undergrowth fire land", unsightly: "unsightly land amenity",
  fine: "penalty infringement offence unit", fined: "penalty infringement offence",
  penalty: "penalty infringement units offence", appeal: "appeal aggrieved notice comply",
  train: "personal training reserve charge", training: "personal training reserve charge",
  sport: "reserve sport game competitive playing", golf: "reserve golf archery",
};
const STOP = new Set("a an and are as at be by can could do does for from have how i if in is it its may must my not of on or our shall should so that the their there they this to under was we what when where which who will with without you your".split(" "));

function expand(q) {
  const words = q.toLowerCase().replace(/[^a-z0-9\s-]/g, " ").split(/[\s-]+/).filter(Boolean);
  const terms = [];
  for (let w of words) {
    if (STOP.has(w)) continue;
    terms.push(w);
    const sing = w.replace(/ies$/, "y").replace(/([^s])s$/, "$1");
    if (sing !== w) terms.push(sing);
    const syn = SYNONYMS[w] || SYNONYMS[sing];
    if (syn) terms.push(...syn.split(" "));
  }
  return [...new Set(terms)].filter((t) => t.length > 2);
}

// Clause 5 is the definitions clause: it contains nearly every word in the law,
// so it wins every search and eats the context window. Definitions are pulled in
// separately, by term, below.
const CORPUS = D.clauses.filter((c) => c.id !== "5");
const LOWER = new Map(CORPUS.map((c) => [c.id, { t: c.title.toLowerCase(), b: c.text.toLowerCase() }]));

// "Area", "person" and "council" appear in most clauses and mean nothing as a
// search signal; "amplified" appears in two and decides the answer. Weight each
// term by how rare it is rather than hand-maintaining a stop list.
const dfCache = new Map();
function idf(term) {
  if (!dfCache.has(term)) {
    let df = 0;
    for (const v of LOWER.values()) if (v.b.includes(term) || v.t.includes(term)) df++;
    dfCache.set(term, Math.log(CORPUS.length / (1 + df)));
  }
  return Math.max(dfCache.get(term), 0.05);
}

function retrieve(q, limit) {
  const terms = expand(q);
  if (!terms.length) return [];
  const scored = CORPUS.map((c) => {
    const { t, b } = LOWER.get(c.id);
    let sc = 0;
    for (const term of terms) {
      const w = idf(term);
      if (t.includes(term)) sc += 6 * w;
      sc += Math.min(b.split(term).length - 1, 5) * 1.2 * w;
    }
    return { c, sc };
  }).sort((a, b) => b.sc - a.sc);
  const top = scored[0] ? scored[0].sc : 0;
  if (top < 2) return [];
  const floor = Math.max(2, top * 0.14);
  return scored.filter((x) => x.sc >= floor).slice(0, limit || 8).map((x) => x.c);
}

// The defined terms out of cl.5, so the answer can use them precisely.
const DEFS = (() => {
  const src = (D.clauses.find((c) => c.id === "5") || {}).text || "";
  const re = /[“"]([^”"\n]{2,48})[”"]\s*(?=means|includes|has the same meaning)/g;
  const hits = [];
  let m;
  while ((m = re.exec(src))) hits.push({ term: m[1].trim(), at: m.index });
  return hits.map((h, i) => ({
    term: h.term,
    def: src.slice(h.at, i + 1 < hits.length ? hits[i + 1].at : src.length).replace(/\s*\n\s*/g, " ").trim(),
  }));
})();

function defsFor(cl, q) {
  const hay = (q + " " + cl.map((c) => c.text).join(" ")).toLowerCase();
  return DEFS.filter((d) => new RegExp("\\b" + d.term.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(hay))
    .sort((a, b) => a.def.length - b.def.length)
    .slice(0, 14);
}

const INCORPORATED = ["Footpath Trading Policy", "Keeping of Animals Policy", "Procedure and Protocol Manual", "Procedure and Protocols Manual", "Nature Strip Planting Policy", "Planning Scheme"];
const dependsOn = (cl) => {
  const found = new Set();
  for (const c of cl) for (const d of INCORPORATED) if (c.text.includes(d)) found.add(d.replace("Protocols", "Protocol"));
  return [...found];
};

const BASES = {
  current: { label: "As it stands", note: "Answers from General Local Law 2018 (No. 1) as amended in 2023 — the law in force today, until 19 July 2028." },
  proposed: { label: "With what we're proposing", note: "Answers from the law in force, then flags where the register says that clause is set to change and whether the answer would move with it. Where drafting has produced wording, that wording is used and labelled as not yet law." },
  final: { label: "Under the new law", note: "Available once the new law is made and gazetted — currently planned for May 2028. Until then there is nothing to answer from." },
};

// What the register knows about a clause under the proposed basis.
function proposedNote(c) {
  const d = dispOf(c);
  const drafted = ov("clauses", c.id, "proposedText", "");
  const props = c.proposals
    .map((id) => D.proposals.find((p) => p.id === id))
    .filter((p) => p && pstatusOf(p) !== "Out of scope");
  if (d === "Retain" && !props.length && !drafted) return "";
  const bits = [`Register status: ${d}${d === "Not started" ? " — no decision has been taken on this clause yet" : ""}.`];
  for (const p of props) bits.push(`${p.id} (${pstatusOf(p)}): ${p.title}. ${p.note}`);
  if (drafted) bits.push(`DRAFT WORDING, NOT YET LAW:\n${drafted}`);
  return bits.join("\n");
}

const PERMIT_CONTEXT = `Part 17 governs permits generally: a permit may be issued with or without conditions (cl.180), runs one year from issue unless the permit says otherwise (cl.184), is personal to the named person and not transferable without Council's consent (cl.187), and Council may exempt a person or class of persons from needing one (cl.189). A permit is always a decision on application, never automatic.`;

function checkPrompt(q, cl, basis) {
  const law = cl.map((c) => {
    let block = `--- CLAUSE ${c.id} (Part ${c.part}, ${c.partTitle}) ---\n${c.text}`;
    if (basis === "proposed") {
      const pn = proposedNote(c);
      if (pn) block += `\n--- REGISTER: WHAT IS PROPOSED FOR CLAUSE ${c.id} ---\n${pn}`;
    }
    return block;
  }).join("\n\n");

  const sections = basis === "proposed"
    ? "SHORT ANSWER\nWHAT THE LAW SAYS TODAY\nWHAT WE ARE PROPOSING TO CHANGE\nWHAT THIS DOES NOT SETTLE"
    : "SHORT ANSWER\nWHAT THE LAW SAYS\nWHAT THIS DOES NOT SETTLE";

  const defs = defsFor(cl, q);
  const defBlock = defs.length
    ? `\n\n--- DEFINED TERMS (clause 5) ---\n` + defs.map((d) => d.def).join("\n")
    : "";

  return `You answer questions about the City of Stonnington General Local Law 2018 (No. 1) for Council officers. You are given the full text of the clauses most likely to be relevant. Answer ONLY from that text.

Hard rules:
- Never cite a clause number that does not appear below. If the clauses below do not answer the question, say so plainly and say what would answer it.
- Cite as "cl.144(6)(a)" — clause number then sub-clause. Cite for every statement about what the law requires.
- Quote the operative words where the wording decides the answer.
- Words with a capital letter in the law are defined terms. Use them precisely.
- This is not legal advice and not a determination. Anything needing a permit is decided on application, so never tell someone they will get one.
- ${PERMIT_CONTEXT}
- Where a clause points at an incorporated document, a state Act or the Planning Scheme, say that the answer is incomplete without it. Do not guess what those documents say.

Use exactly these headings, each on its own line in capitals:
${sections}

Start bullets with "- ". Plain text only: no markdown, no bold markers. Under 280 words. Be direct — an officer needs to give someone an answer at a counter.

QUESTION: ${q}

${law}${defBlock}`;
}

async function runCheck(q) {
  if (!sampleFn || check.busy || !q.trim()) return;
  const cl = retrieve(q, 8);
  check.busy = true; check.err = ""; check.answer = ""; check.asked = q.trim();
  check.cites = cl; check.deps = dependsOn(cl);
  render();
  if (!cl.length) {
    check.busy = false;
    check.err = "Nothing in the local law matched that. Try the words the law uses — a permit, a reserve, a road, an animal, building activity.";
    return render();
  }
  try {
    const res = await sampleFn(checkPrompt(q.trim(), cl, check.basis), {
      modelTier: "complex",
      onText: ({ text }) => {
        check.answer = text;
        const el = document.getElementById("ansbody");
        if (el) el.innerHTML = linkClauses(renderDraft(text, true));
      },
    });
    check.answer = res.text;
  } catch (e) {
    check.err = e && e.code === "rate_limited"
      ? "Too many questions at once. Try again in a minute."
      : "The answer did not come back. The clause text below is still the law — read it directly.";
    if (e && e.text) check.answer = e.text;
  }
  check.busy = false;
  render();
}

// Turns "cl.144(6)" in the answer into something you can open and verify.
function linkClauses(html) {
  return html.replace(/\bcl\.?\s?(\d{1,3})((?:\([0-9a-z]+\))*)/g, (m, id, sub) =>
    D.clauses.some((c) => c.id === id)
      ? `<button class="clref" data-clause-open="${id}">cl.${id}${sub}</button>`
      : m);
}

function gantt() {
  const t0 = day("2026-09-01"), t1 = day("2028-10-01");
  const span = t1 - t0;
  const pos = (d) => ((day(d) - t0) / span) * 100;
  const nowPos = ((TODAY - t0) / span) * 100;

  let ticks = "";
  for (let y = 2026; y <= 2028; y++)
    for (let m = 0; m < 12; m += 3) {
      const d = new Date(y, m, 1);
      if (d < t0 || d > t1) continue;
      ticks += `<span style="left:${((d - t0) / span) * 100}%">${monthYear(d)}</span>`;
    }

  const bounds = D.program.boundaries
    .map((b) => `<div class="vline hard" style="left:${pos(b.date)}%;opacity:${b.kind === "immovable" ? .9 : .45}" title="${esc(b.label)}"></div>`)
    .join("");

  const rows = D.program.phases.map((p) => {
    const live = day(p.start) <= TODAY && TODAY <= day(p.end);
    return `<div class="gantt-row"><div class="lab"><b>${esc(p.name)}</b>${esc(p.lead)}</div>
      <div class="track">
        <div class="bar${live ? " now" : ""}" style="left:${pos(p.start)}%;width:${pos(p.end) - pos(p.start)}%" title="${esc(p.name)}: ${esc(fmt(p.start))} – ${esc(fmt(p.end))}"></div>
        ${bounds}
        <div class="vline now" style="left:${nowPos}%"></div>
      </div></div>`;
  }).join("");

  const marks = GATES.map((g) => {
    const s = gateStatus(g);
    const cls = s === "Complete" ? "done" : s === "In progress" || s === "At risk" ? "active" : "";
    return `<button class="mark ${cls}" style="left:${pos(gateDate(g))}%" data-gate="${esc(g.id)}" title="${esc(g.title)} — ${esc(fmt(gateDate(g)))}" aria-label="${esc(g.id)}: ${esc(g.title)}"><i></i><b>${esc(g.id)}</b></button>`;
  }).join("");

  return `<div class="gantt"><div class="gantt-in">
    <div class="axis">${ticks}</div>
    ${rows}
    <div class="gantt-row"><div class="lab"><b>Hard dates</b>no float past these</div>
      <div class="track hardrow">${bounds}
      ${D.program.boundaries.map((b) => `<span class="hardlab" style="left:${pos(b.date)}%">${b.kind === "immovable" ? "SUNSET" : "CARETAKER"}</span>`).join("")}</div></div>
    <div class="gantt-marks">${marks}</div>
  </div>
  <div class="legend">
    <span><i style="background:var(--accent)"></i>Running now</span>
    <span><i style="background:var(--teal);opacity:.82"></i>Phase</span>
    <span><i style="background:var(--green);transform:rotate(45deg);width:8px;height:8px"></i>Gate closed</span>
    <span><i style="background:transparent;border-left:1px dashed var(--accent);border-radius:0;width:1px"></i>Dates that cannot move</span>
    <span style="color:var(--ink-2)">Select a gate marker for what has to be true before it closes.</span>
  </div></div>`;
}

/* ---------- view: pilots ---------- */
function viewPilots() {
  const t0 = day("2026-09-01"), t1 = day("2027-09-01"), span = t1 - t0;
  const pos = (d) => Math.max(0, Math.min(100, ((day(d) - t0) / span) * 100));
  const cards = D.pilots.map((p) => {
    const s = ov("pilots", p.id, "status", p.status);
    return `<div class="card">
      <div class="hd"><span class="id">${esc(p.id)}</span><span class="pill ${RS_PILL[s]}">${esc(s)}</span></div>
      <h4>${esc(p.title)}</h4>
      <div class="track" style="height:8px"><div class="bar" style="left:${pos(p.start)}%;width:${pos(p.end) - pos(p.start)}%;top:0;height:8px"></div></div>
      <div class="kv"><b>${esc(fmtShort(p.start))} – ${esc(fmt(p.end))}</b></div>
      <p class="test">${esc(p.hypothesis)}</p>
      <div class="kv"><b>Measured by</b></div><p style="font-size:12px;margin-top:-4px">${esc(p.measure)}</p>
      <div class="kv"><b>Runs under</b></div><p style="font-size:12px;margin-top:-4px">${esc(p.powers)}</p>
      <div class="foot">
        <span class="kv"><b>${esc(p.owner)}</b></span>
        ${p.proposals.map((x) => `<button class="chip link" data-proposal="${esc(x)}">${esc(x)}</button>`).join("")}
        <select data-pilot="${esc(p.id)}" style="margin-left:auto" aria-label="Status for ${esc(p.id)}">${RUN_STATUS.map((x) => `<option${x === s ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
      </div>${editedNote("pilots", p.id)}
    </div>`;
  }).join("");

  return `
  <div class="vh">
    <div class="eyebrow">05 — Pilots</div>
    <h2>Test it while you can still change the drafting</h2>
    <p>Each pilot runs under powers Council already has — permit conditions, operator agreements, policy — so none of them waits on the new law. All seven must report by G4 on 28 June 2027, because drafting instructions are approved in September 2027 and evidence after that date changes nothing.</p>
  </div>
  <div class="cards">${cards}</div>
  <p class="note">A pilot without a stated measure is a trial balloon. Every card above names what will be counted and against what, so the evaluation at G4 is an assessment rather than an argument.</p>`;
}

/* ---------- view: risks ---------- */
function viewRisks() {
  const cells = {};
  for (const r of D.risks) {
    const l = ov("risks", r.id, "likelihood", r.likelihood), c = ov("risks", r.id, "consequence", r.consequence);
    (cells[l + ":" + c] = cells[l + ":" + c] || []).push(r);
  }
  let grid = "";
  for (let c = 5; c >= 1; c--) {
    grid += c === 5 ? `<div class="ylab">Consequence →</div>` : "";
    for (let l = 1; l <= 5; l++) {
      const s = l * c;
      const lvl = s >= 15 ? "l4" : s >= 9 ? "l3" : s >= 4 ? "l2" : "l1";
      grid += `<div class="cell ${lvl}">${(cells[l + ":" + c] || []).map((r) => `<button class="tok" data-risk="${esc(r.id)}" title="${esc(r.title)}">${esc(r.id)}</button>`).join("")}</div>`;
    }
  }
  grid += `<div></div>` + [1, 2, 3, 4, 5].map((l) => `<div class="xlab">${l}</div>`).join("");

  const rrows = D.risks.map((r) => {
    const l = ov("risks", r.id, "likelihood", r.likelihood), c = ov("risks", r.id, "consequence", r.consequence), s = l * c;
    const st = ov("risks", r.id, "status", r.status);
    return `<tr>
      <td class="num">${esc(r.id)}</td>
      <td><div class="ti"><button class="tok" style="border:0;background:none;padding:0;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer" data-risk="${esc(r.id)}">${esc(r.title)}</button></div><div class="meta">${esc(r.note)}</div></td>
      <td class="num">${l} &times; ${c} = <b>${s}</b></td>
      <td><span class="pill ${s >= 15 ? "red" : s >= 9 ? "amber" : "grey"}">${s >= 15 ? "Severe" : s >= 9 ? "High" : "Moderate"}</span></td>
      <td>${esc(ov("risks", r.id, "owner", r.owner))}</td>
      <td><select data-riskstatus="${esc(r.id)}" aria-label="Status for ${esc(r.id)}">${["Open", "Monitoring", "Treated", "Closed"].map((x) => `<option${x === st ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>${editedNote("risks", r.id)}</td>
    </tr>`;
  }).join("");

  const drows = D.decisions.map((d) => `<tr>
      <td class="num">${esc(d.id)}</td>
      <td class="num">${esc(fmtShort(d.date))}</td>
      <td><div class="ti">${esc(d.title)}</div><div class="meta">${esc(d.decision)}</div></td>
      <td style="max-width:290px"><div class="meta" style="margin:0">${esc(d.rationale)}</div></td>
      <td>${esc(d.forum)}</td>
      <td><span class="pill ${d.status === "Agreed" ? "green" : d.status === "Proposed" ? "blue" : "amber"}">${esc(d.status)}</span></td>
    </tr>`).join("");

  return `
  <div class="vh">
    <div class="eyebrow">06 — Risks &amp; decisions</div>
    <h2>What could take the date away, and what has already been settled</h2>
    <p>Two risks carry a consequence of 5: missing the sunset, and slipping into the 2028 election caretaker period. Everything else is recoverable. The decision log below is what stops settled questions being reopened at the last briefing.</p>
  </div>
  <div class="grid2" style="align-items:start">
    <div class="matrix">
      <h4 style="font-family:var(--serif);font-size:14.5px;margin-bottom:3px">Risk position</h4>
      <p class="lede" style="font-size:12px;color:var(--ink-3);margin:0 0 14px">Likelihood across, consequence up. Select a marker for the treatment.</p>
      <div class="mx">${grid}</div>
      <div class="mxfoot"><span>Likelihood, 1 (rare) to 5 (near certain)</span></div>
    </div>
    <div class="panel">
      <h4>Decision log</h4>
      <p class="lede">Five decisions recorded. D05 is still open.</p>
      <div class="stack">${D.decisions.map((d) => `<div class="item"><div class="top"><span class="ti">${esc(d.title)}</span><span class="date">${esc(fmtShort(d.date))}</span></div><div class="sub">${esc(d.decision)}</div></div>`).join("")}</div>
    </div>
  </div>
  <h3 class="sec">Risk register <span class="tally">${D.risks.length} open</span></h3>
  <div class="tablewrap"><table class="ledger">
    <thead><tr><th>Ref</th><th>Risk</th><th>Score</th><th>Rating</th><th>Owner</th><th>Status</th></tr></thead>
    <tbody>${rrows}</tbody></table></div>
  <h3 class="sec">Decisions</h3>
  <div class="tablewrap"><table class="ledger">
    <thead><tr><th>Ref</th><th>Date</th><th>Decision</th><th>Why</th><th>Forum</th><th>Status</th></tr></thead>
    <tbody>${drows}</tbody></table></div>`;
}

/* ---------- view: rule check ---------- */
const EXAMPLES = [
  "Can a business have outdoor speakers with their outdoor dining area?",
  "Can a resident remove a large tree in their back yard?",
  "Do I need a permit to leave a skip bin on the street?",
  "Can a builder pour concrete at 7am on a Saturday?",
  "Can someone busk on Chapel Street?",
  "Can a café put a heater and a screen on the footpath?",
];

function viewCheck() {
  const b = BASES[check.basis];
  const unavailable = !sampleFn;

  const seg = Object.entries(BASES).map(([k, v]) =>
    `<button type="button" data-basis="${k}" aria-pressed="${check.basis === k}"${k === "final" ? " disabled title=\"Available once the new law is gazetted\"" : ""}>${esc(v.label)}</button>`).join("");

  const sources = check.cites.map((c) => {
    const pn = check.basis === "proposed" ? proposedNote(c) : "";
    return `<details class="src"${check.cites.length <= 2 ? " open" : ""}>
      <summary><span class="cn">cl.&nbsp;${esc(c.id)}</span><span class="ct">${esc(c.title)}</span><span class="pill ${DISP_PILL[dispOf(c)]}">${esc(dispOf(c))}</span></summary>
      <div class="lawtext">${esc(c.text)}</div>
      ${pn ? `<div class="propbox"><div class="k">Proposed — not law</div>${esc(pn)}</div>` : ""}
    </details>`;
  }).join("");

  const answered = check.asked && (check.answer || check.busy || check.err);

  return `
  <div class="vh">
    <div class="eyebrow">07 — Rule check</div>
    <h2>What does the local law actually say about this?</h2>
    <p>Ask in the words a resident or a trader would use. The answer comes back from the text of the clauses themselves, cited, with the clauses underneath so you can read them yourself before you tell anyone anything.</p>
  </div>

  ${unavailable ? `<div class="caveat"><b>Not available in this view.</b> The rule check needs the drafting capability, which this copy of the page cannot reach. The clause register still holds the full text of every clause.</div>` : ""}

  <div class="ask">
    <input type="search" id="c-q" placeholder="Can a business have outdoor speakers with their outdoor dining area?" value="${esc(check.q)}" aria-label="Your question"${unavailable ? " disabled" : ""}>
    <button class="dobtn" id="c-go" type="button"${check.busy || unavailable ? " disabled" : ""}>${check.busy ? "Checking…" : "Check"}</button>
  </div>
  <div class="ask" style="margin-bottom:8px"><div class="seg">${seg}</div></div>
  <p class="basisnote">${esc(b.note)}</p>

  ${!answered ? `<div class="egs">${EXAMPLES.map((e) => `<button class="eg" type="button" data-eg="${esc(e)}">${esc(e)}</button>`).join("")}</div>` : ""}

  ${answered ? `<div class="answer">
    <div class="q">${esc(check.asked)}</div>
    <div class="bod" id="ansbody">${check.answer ? linkClauses(renderDraft(check.answer, check.busy)) : `<p style="color:var(--ink-3)">Reading ${check.cites.length} clauses…</p>`}</div>
    ${check.answer && !check.busy ? `<div class="deps" style="background:var(--surface-2);color:var(--ink-3)"><div>A lookup from the text of the local law — not advice, and not a determination. Read the cited clauses below before you act on it.</div></div>` : ""}
    ${check.err ? `<div class="deps"><div><b>${esc(check.err)}</b></div></div>` : ""}
    ${check.deps.length ? `<div class="deps"><div><b>This answer is incomplete on its own.</b> The clauses above hand part of the question to ${esc(check.deps.join(", "))} — ${check.deps.length > 1 ? "documents" : "a document"} this tool does not hold. Check ${check.deps.length > 1 ? "them" : "it"} before giving a final answer.</div></div>` : ""}
    <div class="sources"><div class="k">The clauses this was answered from — ${check.cites.length} of ${D.clauses.length}</div>${sources}
      ${(() => { const defs = defsFor(check.cites, check.asked); return defs.length ? `<details class="src"><summary><span class="cn">cl.&nbsp;5</span><span class="ct">Defined terms used above — ${defs.length}</span></summary><div class="lawtext">${esc(defs.map((d) => d.def).join("\n\n"))}</div></details>` : ""; })()}
    </div>
  </div>
  <div class="egs">${EXAMPLES.map((e) => `<button class="eg" type="button" data-eg="${esc(e)}">${esc(e)}</button>`).join("")}</div>` : ""}

  <div class="caveat"><b>This is a lookup, not advice and not a determination.</b> It answers from the text of the local law only. It does not know the Planning Scheme, the incorporated policies, any state Act, or the history of a particular property — and anything requiring a permit is decided on application. Read the cited clauses before you rely on it, and send anything contested to Governance and Legal. Putting this in front of residents or traders is a separate decision that needs sign-off.</div>`;
}

/* ---------- drawer ---------- */
function openDrawer(html) {
  $("#drawer-body").innerHTML = html;
  $("#drawer").setAttribute("open", "");

}
function closeDrawer() { $("#drawer").removeAttribute("open"); }

function drawerClause(id) {
  const c = D.clauses.find((x) => x.id === id);
  if (!c) return;
  const props = c.proposals.map((p) => D.proposals.find((x) => x.id === p)).filter(Boolean);
  openDrawer(`
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)">Clause ${esc(c.id)} · Part ${c.part}</div>

    <h3 id="drawer-title">${esc(r.title)}</h3>
    <div style="margin:10px 0"><span class="pill ${l * c >= 15 ? "red" : l * c >= 9 ? "amber" : "grey"}">Score ${l * c}</span>
      <span class="pill grey">${esc(ov("risks", r.id, "status", r.status))}</span></div>
    <div class="drow"><div class="k">Why it matters</div>${esc(r.note)}</div>
    <div class="drow"><div class="k">Treatment</div>${esc(r.treatment)}</div>
    <div class="drow"><div class="k">Owner</div>${esc(ov("risks", r.id, "owner", r.owner))}</div>
    <div class="drow"><div class="k">Likelihood</div>
      <select data-risk-l="${esc(r.id)}" aria-label="Likelihood">${[1, 2, 3, 4, 5].map((x) => `<option${x === l ? " selected" : ""}>${x}</option>`).join("")}</select>
      <span style="margin-left:12px" class="k">Consequence</span>
      <select data-risk-c="${esc(r.id)}" aria-label="Consequence">${[1, 2, 3, 4, 5].map((x) => `<option${x === c ? " selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="drow"><div class="k">Note</div>
      <textarea data-risk-note="${esc(r.id)}" rows="4" placeholder="Update…">${esc(ov("risks", r.id, "note", ""))}</textarea>${editedNote("risks", r.id)}</div>`);
}

/* ---------- routing & events ---------- */
const VIEWS = { program: viewProgram, clauses: viewClauses, proposals: viewProposals, engagement: viewEngagement, pilots: viewPilots, risks: viewRisks, check: viewCheck };
const route = () => (location.hash.replace("#", "") in VIEWS ? location.hash.replace("#", "") : "program");

function render() {
  const r = route();
  $("#view").innerHTML = VIEWS[r]();
  renderTop();
  for (const a of document.querySelectorAll("#nav a")) {
    if (a.getAttribute("href") === "#" + r) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  for (const t of document.querySelectorAll("#view textarea")) autosize(t);
}
const autosize = (t) => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, 180) + "px"; };

addEventListener("hashchange", () => { closeDrawer(); scrollTo(0, 0); render(); });

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-proposal],[data-gate],[data-risk],[data-clause-open],[data-eg],[data-basis],[data-close],#f-clear,#f-pclear,#themebtn,#draftbtn,#draftcopy,#c-go");
  if (!b) return;
  if (b.hasAttribute("data-clause-open")) return drawerClause(b.getAttribute("data-clause-open"));
  if (b.hasAttribute("data-basis")) { check.basis = b.getAttribute("data-basis"); return render(); }
  if (b.hasAttribute("data-eg")) { check.q = b.getAttribute("data-eg"); render(); return runCheck(check.q); }
  if (b.id === "c-go") { const i = $("#c-q"); if (i) check.q = i.value; return runCheck(check.q); }
  if (b.id === "draftbtn") return draftUpdate();
  if (b.id === "draftcopy") {
    navigator.clipboard.writeText(draft.text).then(
      () => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy to clipboard"; }, 1600); },
      () => { b.textContent = "Select the text and copy it"; },
    );
    return;
  }
  if (b.hasAttribute("data-close")) return closeDrawer();
  if (b.id === "themebtn") {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    return;
  }
  if (b.id === "f-clear") { filters.q = filters.part = filters.disp = filters.owner = filters.tag = ""; return render(); }
  if (b.id === "f-pclear") { filters.pstatus = filters.punit = ""; return render(); }
  if (b.hasAttribute("data-proposal")) return drawerProposal(b.getAttribute("data-proposal"));
  if (b.hasAttribute("data-gate")) return drawerGate(b.getAttribute("data-gate"));
  if (b.hasAttribute("data-risk")) return drawerRisk(b.getAttribute("data-risk"));
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if (e.key === "Enter" && e.target.id === "c-q") { check.q = e.target.value; runCheck(check.q); }
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "initials") { initials = t.value.trim(); try { localStorage.setItem("llr-initials", initials); } catch (err) {} return; }
  if (t.id === "f-part") { filters.part = t.value; return render(); }
  if (t.id === "f-disp") { filters.disp = t.value; return render(); }
  if (t.id === "f-owner") { filters.owner = t.value; return render(); }
  if (t.id === "f-tag") { filters.tag = t.value; return render(); }
  if (t.id === "f-ps") { filters.pstatus = t.value; return render(); }
  if (t.id === "f-pu") { filters.punit = t.value; return render(); }

  if (t.dataset.clause) { stamp("clauses", t.dataset.clause, { [t.dataset.field]: t.value }); return render(); }
  if (t.dataset.proposalField) { stamp("proposals", t.dataset.proposalField, { status: t.value }); return render(); }
  if (t.dataset.proposalNote !== undefined && t.dataset.proposalNote) { stamp("proposals", t.dataset.proposalNote, { note: t.value }); return; }
  if (t.dataset.gateStatus) { stamp("gates", t.dataset.gateStatus, { status: t.value }); render(); return drawerGate(t.dataset.gateStatus); }
  if (t.dataset.gateNote) { stamp("gates", t.dataset.gateNote, { note: t.value }); return; }
  if (t.dataset.pilot) { stamp("pilots", t.dataset.pilot, { status: t.value }); return render(); }
  if (t.dataset.eng) { stamp("engagement", t.dataset.eng, { status: t.value }); return render(); }
  if (t.dataset.riskstatus) { stamp("risks", t.dataset.riskstatus, { status: t.value }); return render(); }
  if (t.dataset.riskL) { stamp("risks", t.dataset.riskL, { likelihood: Number(t.value) }); render(); return drawerRisk(t.dataset.riskL); }
  if (t.dataset.riskC) { stamp("risks", t.dataset.riskC, { consequence: Number(t.value) }); render(); return drawerRisk(t.dataset.riskC); }
  if (t.dataset.riskNote) { stamp("risks", t.dataset.riskNote, { note: t.value }); return; }
});

let qtimer;
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.tagName === "TEXTAREA") autosize(t);
  if (t.id === "c-q") { check.q = t.value; return; }
  if (t.id === "f-q") {
    filters.q = t.value;
    clearTimeout(qtimer);
    qtimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = $("#f-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220);
  }
});

$("#initials").value = initials;
render();
</script>
