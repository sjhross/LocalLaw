opment","raised":"2021-10","source":"Film Vic liaison + internal","impact":2,"effort":2,"status":"Triage","sensitivity":"Low","pilot":null,"note":"Cl.136 captures any commercial filming on Council land. A single-operator shoot and a feature unit are treated identically."},{"id":"P13","title":"Drone operation over Council reserves","clauses":["123"],"unit":"Recreation & Leisure","raised":"2020-02","source":"Reserve bookings team","impact":3,"effort":3,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"Cl.123(1)(a) bans drones unless the reserve is exempted in the Procedure and Protocol Manual. CASA holds airspace control — confirm the limits of Council's power over take-off and landing only."},{"id":"P14","title":"EV charging cables across footpaths and kerbside charging","clauses":["127","135","107"],"unit":"Transport & Parking","raised":"2023-05","source":"Climate & Energy team","impact":4,"effort":4,"status":"In scope","sensitivity":"Medium","pilot":"PL07","note":"Residents without off-street parking are running cables across footpaths. Currently an obstruction under cl.127 with no permit pathway. Interacts with the residential parking permit scheme."},{"id":"P15","title":"Clothing bins — separate charitable from commercial collection","clauses":["133"],"unit":"Waste & Recycling","raised":"2019-05","source":"Compliance","impact":2,"effort":2,"status":"Parked","sensitivity":"Low","pilot":null,"note":"Sitting since 2019. Dumping around commercial bins drives most of the cost; a permit condition set may be enough without a drafting change."},{"id":"P16","title":"Real estate signage over footpaths and on facades","clauses":["145"],"unit":"Urban Planning","raised":"2018-12","source":"Officer report (not progressed)","impact":2,"effort":2,"status":"Parked","sensitivity":"Medium","pilot":null,"note":"Cl.145(3) requires a permit for signage over a verandah or footpath. Enforcement is effectively complaint-driven; industry expects a standing arrangement."},{"id":"P17","title":"Bin presentation times and bin storage on nature strips","clauses":["173","174"],"unit":"Waste & Recycling","raised":"2022-02","source":"Waste services + amenity officers","impact":3,"effort":2,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"No presentation window in the current law. Four-stream rollout has increased bins left out; interacts with the state's FOGO requirements."},{"id":"P18","title":"Commercial use of open space — personal training and boot camps","clauses":["122"],"unit":"Recreation & Leisure","raised":"2021-09","source":"Open space team","impact":3,"effort":2,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"Cl.122(o) requires a permit for paid personal training. Group size, turf wear and fee structure are unresolved."},{"id":"P19","title":"Accessible footpath clear width as a hard standard","clauses":["126","127"],"unit":"Community & Wellbeing","raised":"2022-06","source":"Disability Advisory Committee","impact":4,"effort":3,"status":"In scope","sensitivity":"Medium","pilot":"PL01","note":"The Disability Advisory Committee has asked for a minimum continuous accessible path set in the law rather than the policy, so it survives policy amendment."},{"id":"P20","title":"Repeal spent Common Seal and machinery clauses","clauses":["20","21","22","23","24","2","5"],"unit":"Governance & Legal","raised":"2023-09","source":"Governance — post-2023 amendment tidy-up","impact":2,"effort":1,"status":"In scope","sensitivity":"Low","pilot":null,"note":"Part 4 was repealed in 2023 and moved to the Governance Rules. Part 3 largely duplicates the Governance Rules. Definitions still reference the Local Government Act 1989 throughout."},{"id":"P21","title":"Infringement schedule and penalty level review","clauses":["195","198"],"unit":"Local Laws & Compliance","raised":"2023-07","source":"Compliance — deterrence analysis","impact":4,"effort":3,"status":"In scope","sensitivity":"Medium","pilot":null,"note":"Cl.198 caps at 20 penalty units, with 2 units per day for continuing offences. Test whether current infringement levels deter tree removal and illegal works, where the commercial gain exceeds the penalty."},{"id":"P22","title":"Short-stay accommodation amenity and party-house noise","clauses":["144","117"],"unit":"City Amenity","raised":"2022-12","source":"Resident complaints + Councillor request","impact":4,"effort":4,"status":"Triage","sensitivity":"High","pilot":null,"note":"State short-stay levy and the Owners Corporations regime cover part of this. Need legal advice on what is left for a local law to do before scoping drafting."},{"id":"P23","title":"Consolidate directive powers and add a review right","clauses":["120","149","177","16"],"unit":"Governance & Legal","raised":"2024-02","source":"Internal audit — administrative fairness","impact":3,"effort":3,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"Directive powers appear in at least four places with different wording. Cl.16 gives 28 days to be heard but does not stay the notice. Audit recommended one consistent procedural code."},{"id":"P24","title":"Designated alcohol-free areas — evidence review","clauses":["129","123"],"unit":"Local Laws & Compliance","raised":"2020-11","source":"Victoria Police liaison","impact":3,"effort":3,"status":"Parked","sensitivity":"High","pilot":null,"note":"Blanket prohibition under cl.129 with exemptions by permit. Police support retention; equity concerns raised about enforcement patterns."}],"program":{"law":{"title":"General Local Law 2018 (No. 1)","council":"City of Stonnington","commenced":"2018-07-20","sunset":"2028-07-19","amended":"2023 (Part 4 repealed — moved to Governance Rules)","madeUnder":"s.111 Local Government Act 1989 and s.42 Domestic Animals Act 1994","incorporated":["Procedure and Protocol Manual","Keeping of Animals Policy","Footpath Trading Policy"]},"phases":[{"id":"F1","name":"Initiate & diagnose","start":"2026-09-01","end":"2027-02-26","lead":"Governance & Legal","detail":"Project plan, governance, clause-by-clause internal review, triage of the held-over backlog."},{"id":"F2","name":"Evidence & benchmarking","start":"2026-10-01","end":"2027-03-31","lead":"Local Laws & Compliance","detail":"Enforcement and request data, permit volumes, VCAT and complaint history, comparison against neighbouring councils' current laws."},{"id":"F3","name":"Community & stakeholder engagement","start":"2027-02-15","end":"2027-05-28","lead":"Community & Wellbeing","detail":"Issues-stage engagement under the Community Engagement Policy — before positions are fixed."},{"id":"F4","name":"Pilots & operational testing","start":"2026-11-02","end":"2027-06-30","lead":"Local Laws & Compliance","detail":"Test proposed changes operationally under existing powers, permit conditions or policy, so the drafting rests on evidence."},{"id":"F5","name":"Policy settlement","start":"2027-05-03","end":"2027-08-31","lead":"Governance & Legal","detail":"Councillor briefings, position papers, resolution of contested items."},{"id":"F6","name":"Drafting & statutory assessments","start":"2027-07-01","end":"2027-10-29","lead":"Governance & Legal","detail":"Drafting instructions, legal drafting, Community Impact Statement, Human Rights Charter assessment, competition assessment."},{"id":"F7","name":"Statutory exhibition & submissions","start":"2027-11-01","end":"2028-02-29","lead":"Governance & Legal","detail":"Public notice, exhibition of the proposed local law, receipt and hearing of submissions."},{"id":"F8","name":"Making, gazettal & commencement","start":"2028-03-01","end":"2028-06-30","lead":"Governance & Legal","detail":"Council resolution to make the law, publication in the Government Gazette, public notice, commencement."},{"id":"F9","name":"Transition & implementation","start":"2028-04-03","end":"2028-09-29","lead":"Local Laws & Compliance","detail":"Delegations and authorisations, officer training, permit migration, signage, incorporated document updates, communications."}],"gates":[{"id":"G1","date":"2026-10-26","forum":"Executive Leadership Team","title":"Project plan, governance and resourcing endorsed","phase":"F1","owner":"Project Manager","status":"In progress","test":"Sponsor, steering group, budget and a named drafting resource are all confirmed in writing.","authority":"Internal project governance","confirm":false},{"id":"G2","date":"2026-12-14","forum":"Council","title":"Review commenced — scope and engagement plan endorsed","phase":"F1","owner":"Director Corporate","status":"Not started","test":"Council resolves to commence the review and endorses the engagement approach under the Community Engagement Policy.","authority":"Local Government Act 2020 s.55 (community engagement policy)","confirm":true},{"id":"G3","date":"2027-03-01","forum":"Executive Leadership Team","title":"Clause triage complete, backlog dispositioned","phase":"F1","owner":"Project Manager","status":"Not started","test":"Every clause in the register carries a disposition and an owner; every backlog item is in scope, out of scope or deferred with a reason.","authority":"Internal project governance","confirm":false},{"id":"G4","date":"2027-06-28","forum":"Executive Leadership Team","title":"Consultation findings and pilot evidence accepted","phase":"F3","owner":"Project Manager","status":"Not started","test":"Engagement report published back to participants; each pilot has a written evaluation against its stated measure.","authority":"Internal project governance","confirm":false},{"id":"G5","date":"2027-08-16","forum":"Councillor briefing","title":"Policy positions confirmed","phase":"F5","owner":"Director Corporate","status":"Not started","test":"Councillors have seen an options paper on every contested item and indicated a preferred position.","authority":"Internal project governance","confirm":false},{"id":"G6","date":"2027-09-13","forum":"Council","title":"Drafting instructions and Community Impact Statement approved","phase":"F6","owner":"Manager Governance","status":"Not started","test":"Instructions signed off; Community Impact Statement covers restriction of competition and administrative burden.","authority":"Victorian local law guidelines — community impact statement","confirm":true},{"id":"G7","date":"2027-10-25","forum":"Executive Leadership Team","title":"Draft law and statutory assessments complete","phase":"F6","owner":"Manager Governance","status":"Not started","test":"Draft law, Charter of Human Rights compatibility assessment and competition assessment are complete and legally reviewed.","authority":"Charter of Human Rights and Responsibilities Act 2006","confirm":true},{"id":"G8","date":"2027-11-22","forum":"Council","title":"Resolve to give notice of the proposed local law","phase":"F7","owner":"Director Corporate","status":"Not started","test":"Council resolves to give public notice; notice states purpose and general purport and where a copy may be obtained.","authority":"Local Government Act 2020 Part 3 Div. 2 — process for making a local law","confirm":true},{"id":"G9","date":"2028-02-21","forum":"Council","title":"Submissions considered and submitters heard","phase":"F7","owner":"Manager Governance","status":"Not started","test":"All submissions tabled, submitters who asked to be heard have been heard, and a response to each theme is documented.","authority":"Council's Community Engagement Policy and Governance Rules","confirm":true},{"id":"G10","date":"2028-04-17","forum":"Council","title":"Resolve to make the local law","phase":"F8","owner":"Director Corporate","status":"Not started","test":"Council resolves to make the local law in its final form. This is the immovable decision — everything downstream is administrative.","authority":"Local Government Act 2020 Part 3 Div. 2","confirm":true},{"id":"G11","date":"2028-05-15","forum":"Administrative","title":"Published in the Government Gazette, public notice given, copy to the Minister","phase":"F8","owner":"Manager Governance","status":"Not started","test":"Gazette notice published, public notice given, and a copy provided to the Minister within the statutory period.","authority":"Local Government Act 2020 Part 3 Div. 2 — publication requirements","confirm":true},{"id":"G12","date":"2028-06-19","forum":"Administrative","title":"New law commences — 30 days clear of the sunset","phase":"F8","owner":"Project Manager","status":"Not started","test":"New law in operation, delegations and authorisations remade, officers trained, permits migrated, website and signage updated.","authority":"Local Government Act 2020 Part 3 Div. 2","confirm":true}],"boundaries":[{"date":"2028-07-19","label":"Sunset — General Local Law 2018 (No. 1) ceases to operate","kind":"immovable","note":"Clause 4 of the current law. A ten-year life from commencement on 20 July 2018. There is no power to extend it: if nothing replaces it, every permit trigger, notice power and infringeable offence in the register stops on this date."},{"date":"2028-09-19","label":"Indicative start of the election caretaker period","kind":"hard","note":"Victorian council general elections fall in October 2028. Major decisions are constrained once the election period starts, so there is no usable float past August 2028. Confirm the exact date with Governance when the Victorian Electoral Commission publishes it."}]},"pilots":[{"id":"PL01","title":"Parklet and accessible clear-width pilot — Chapel St north","proposals":["P02","P19"],"owner":"Economic Development","start":"2026-11-02","end":"2027-05-28","status":"Planned","powers":"Permit conditions under cl.126 and the Footpath Trading Policy — no change to the law needed to run it.","hypothesis":"A permanent parklet class with a 1.8m continuous accessible path can be delivered without reducing trader participation.","measure":"Accessible-path compliance audited monthly; trader participation; complaint volume; Disability Advisory Committee assessment at close."},{"id":"PL02","title":"E-scooter parking corrals and footpath clearance","proposals":["P01"],"owner":"Transport & Parking","start":"2027-02-01","end":"2027-06-30","status":"Planned","powers":"Operator agreement plus obstruction powers under cl.127. Tests the drafting before it is written.","hypothesis":"Mandatory corral parking cuts footpath obstruction reports by more than half without displacing trips.","measure":"Obstruction reports per 1,000 trips; corral compliance rate; audit of clear width at 20 fixed points."},{"id":"PL03","title":"Cat containment — voluntary phase and education","proposals":["P09"],"owner":"Local Laws & Compliance","start":"2027-03-01","end":"2027-06-30","status":"Planned","powers":"Education and voluntary registration only. A containment requirement itself needs the new law.","hypothesis":"Voluntary uptake and the shape of the objections tell us whether a curfew or full containment is deliverable.","measure":"Voluntary sign-ups; cat-related requests; wildlife reports; a structured record of objection themes for the drafting file."},{"id":"PL04","title":"Amplified music compliance — Prahran and Windsor late night","proposals":["P07"],"owner":"City Amenity","start":"2027-02-15","end":"2027-05-31","status":"Planned","powers":"Monitoring and voluntary agreements with operators under existing cl.144.","hypothesis":"Speaker placement rules do more work than the 65dB number, and a placement-first standard is easier to enforce.","measure":"Paired measurements at facade and source; complaints per venue; officer time per matter."},{"id":"PL05","title":"Nature strip planting — self-assessment approval","proposals":["P04"],"owner":"Parks & Environment","start":"2026-11-16","end":"2027-04-30","status":"Planned","powers":"Administrative approval pathway under the existing Nature Strip Planting Policy.","hypothesis":"A self-assessment checklist can replace individual approvals without increasing sightline or service-asset incidents.","measure":"Applications processed; non-compliant plantings found on audit; asset-strike incidents; processing time per application."},{"id":"PL06","title":"Extended building hours in exchange for a construction management plan","proposals":["P10"],"owner":"City Works & Assets","start":"2027-01-18","end":"2027-06-30","status":"Planned","powers":"Consent conditions on asset protection permits under cl.115.","hypothesis":"Traded extended hours plus a named community liaison reduce total disruption compared with the current fixed hours.","measure":"Complaints per site per week against matched control sites; number of hour breaches; builder take-up."},{"id":"PL07","title":"Kerbside EV charging and footpath cable covers","proposals":["P14"],"owner":"Transport & Parking","start":"2027-03-15","end":"2027-06-30","status":"Planned","powers":"Trial permit with conditions, treating the cable as a permitted obstruction under cl.127.","hypothesis":"A conditional permit with an approved cable cover is a workable alternative to prohibition for homes without off-street parking.","measure":"Trip-hazard incidents; insurance and liability assessment; participant and passer-by feedback; cost per permit."}],"engagement":[{"id":"E01","phase":"F1","name":"Internal clause-by-clause workshops (11 business units)","iap2":"Involve","audience":"Officers and authorised officers","window":"Oct 2026 – Feb 2027","owner":"Project Manager","status":"In progress","note":"The first pass over the register. Every clause gets an owning unit and a disposition."},{"id":"E02","phase":"F1","name":"Held-over items surgery with unit managers","iap2":"Involve","audience":"Managers holding long-standing requests","window":"Nov 2026","owner":"Project Manager","status":"Planned","note":"Bring the parked items into the open and force a decision: in scope, out of scope, or deferred with a stated reason."},{"id":"E03","phase":"F3","name":"Community issues survey — what is and is not working","iap2":"Consult","audience":"Whole municipality","window":"Feb – Mar 2027","owner":"Community & Wellbeing","status":"Planned","note":"Issues stage, before positions are fixed. Reaching people early is what makes the statutory exhibition defensible later."},{"id":"E04","phase":"F3","name":"Trader and business roundtables","iap2":"Consult","audience":"Chapel St, Glenferrie Rd, High St, Toorak Village","window":"Mar 2027","owner":"Economic Development","status":"Planned","note":"Footpath trading, parklets, signage, filming and street events."},{"id":"E05","phase":"F3","name":"Deliberative panel on the contested items","iap2":"Collaborate","audience":"Randomly selected residents (n=40)","window":"Apr – May 2027","owner":"Community & Wellbeing","status":"Planned","note":"Reserved for the genuinely contested items: cat containment, amplified music hours, alcohol-free areas."},{"id":"E06","phase":"F3","name":"Targeted sessions — Disability Advisory Committee and multicultural groups","iap2":"Involve","audience":"Advisory committees and community groups","window":"Mar – Apr 2027","owner":"Community & Wellbeing","status":"Planned","note":"Accessible footpath width, signage, and how directive powers are experienced."},{"id":"E07","phase":"F3","name":"Rough sleeping and outreach sector session","iap2":"Involve","audience":"Homelessness services, Victoria Police, outreach providers","window":"Apr 2027","owner":"Community & Wellbeing","status":"Planned","note":"Camping clauses and the operating protocol that sits behind them. Feeds the Charter assessment directly."},{"id":"E08","phase":"F3","name":"Youth and sport user groups","iap2":"Consult","audience":"Reserve user groups, clubs, young people","window":"Apr 2027","owner":"Recreation & Leisure","status":"Planned","note":"Reserve restrictions, ball games, skating, drones, personal training."},{"id":"E09","phase":"F5","name":"Close the loop — what we heard and what changed","iap2":"Consult","audience":"All participants","window":"Jul 2027","owner":"Communications","status":"Planned","note":"Published before positions go to Councillors, not after. Participants should see their input in the options paper."},{"id":"E10","phase":"F7","name":"Statutory public notice and exhibition of the proposed local law","iap2":"Consult","audience":"Whole municipality","window":"Nov 2027 – Jan 2028","owner":"Manager Governance","status":"Planned","note":"The formal step. Notice of purpose and general purport, copies available, submission period. Confirm the notice and submission requirements with Governance against the Act and the Governance Rules."},{"id":"E11","phase":"F7","name":"Hearing of submitters","iap2":"Consult","audience":"Submitters who ask to be heard","window":"Feb 2028","owner":"Manager Governance","status":"Planned","note":"Allow for a dedicated committee meeting. Volume is the variable — cat containment could carry this on its own."},{"id":"E12","phase":"F9","name":"Commencement communications and permit-holder transition","iap2":"Inform","audience":"Permit holders, traders, residents","window":"May – Aug 2028","owner":"Communications","status":"Planned","note":"Existing permits under cl.184 run a year from issue, so some will straddle commencement. Transitional arrangements must be drafted, not improvised."}],"risks":[{"id":"R01","title":"The sunset date cannot move","likelihood":2,"consequence":5,"owner":"Director Corporate","status":"Open","treatment":"Plan to commence on 19 June 2028, a clear month early. Track G10 (resolve to make) as the immovable decision — everything after it is administrative. Report float at every steering group.","note":"If the law is not remade by 19 July 2028, every permit trigger, notice power and infringeable offence in the register stops. There is no extension mechanism."},{"id":"R02","title":"Slippage runs into the 2028 election caretaker period","likelihood":2,"consequence":5,"owner":"Project Manager","status":"Open","treatment":"Hold the making decision at April 2028 with August as the last recoverable date. Confirm the caretaker start with Governance once the VEC publishes it.","note":"General elections in October 2028. Major decisions are constrained from roughly late September, so the float after the sunset is illusory."},{"id":"R03","title":"Council meeting cycle compresses the Q1 gates","likelihood":4,"consequence":3,"owner":"Manager Governance","status":"Open","treatment":"Book G2, G9 and G10 into the meeting calendar as soon as it is set, with the report deadline working backwards from the agenda close date.","note":"There is no January meeting, and report deadlines close roughly two weeks before each meeting. Two gates sit either side of that gap."},{"id":"R04","title":"Charter of Human Rights challenge to the camping and directive powers","likelihood":3,"consequence":4,"owner":"Governance & Legal","status":"Open","treatment":"Start the Charter assessment in phase 1 rather than at drafting. Document the outreach-first operating protocol alongside the clause. Brief counsel early on cl.143.","note":"Clauses 143, 120, 149 and 177 are the exposure. Assessment after drafting is too late to change the drafting."},{"id":"R05","title":"Submission volume on cat containment overwhelms the statutory stage","likelihood":4,"consequence":3,"owner":"Community & Wellbeing","status":"Open","treatment":"Do the contested work at the deliberative panel in phase 3, not at exhibition. Resource submission handling for a high-volume scenario and book a dedicated hearing committee.","note":"Neighbouring councils have drawn submissions in the thousands on this single question."},{"id":"R06","title":"The three incorporated documents are not reviewed in step with the law","likelihood":4,"consequence":4,"owner":"Manager Governance","status":"Open","treatment":"Run the Footpath Trading Policy, Keeping of Animals Policy and Procedure and Protocol Manual as named workstreams with their own owners and the same gate dates.","note":"Clause 19 incorporates all three. If they lag, the new law commences pointing at documents written for the old one."},{"id":"R07","title":"Enforcement data is not good enough to carry an evidence case","likelihood":3,"consequence":3,"owner":"Local Laws & Compliance","status":"Open","treatment":"Scope the data extract in phase 2 and find out early what cannot be answered. Where the record is thin, use the pilots to generate the evidence instead.","note":"Request and infringement data is held across several systems and clause-level coding is inconsistent."},{"id":"R08","title":"Drafting resource is not secured in time","likelihood":3,"consequence":4,"owner":"Director Corporate","status":"Open","treatment":"Confirm the drafting resource at G1 and start procurement by March 2027. Drafting cannot start later than July 2027 without eating the exhibition window.","note":"External drafting has procurement lead time, and a specialist local law drafter is a small market."},{"id":"R09","title":"Overlap with state regimes creates an inconsistency argument","likelihood":3,"consequence":3,"owner":"Governance & Legal","status":"Open","treatment":"Legal review of each overlapping clause before drafting instructions. Where the state covers the field, remove rather than restate.","note":"Noise against the Environment Protection Regulations 2021, short-stay against the state levy and owners corporation rules, drones against CASA, e-rideables against the Road Safety Road Rules."},{"id":"R10","title":"Pilots run too late to influence the drafting","likelihood":3,"consequence":4,"owner":"Project Manager","status":"Open","treatment":"Every pilot must close by 30 June 2027 with a written evaluation. A pilot that cannot report by G4 does not start.","note":"Drafting instructions are approved at G6 in September 2027. Evidence that arrives after that is evidence for the next review, not this one."},{"id":"R11","title":"Items parked for years reappear after the scope is locked","likelihood":4,"consequence":2,"owner":"Project Manager","status":"Open","treatment":"Run the held-over surgery at E02 and publish the disposition of every backlog item. After G3, new items go to a register for the next review unless the sponsor takes it to the steering group.","note":"Three items in the backlog have been open since 2019 and 2020. The review is the moment they surface."}],"decisions":[{"id":"D01","date":"2026-09-08","title":"Replace rather than amend the 2018 law","forum":"Project steering group","decision":"The review will produce a new General Local Law rather than a further amendment to the 2018 law.","rationale":"The 2018 law still runs on Local Government Act 1989 definitions, Part 4 is already a hole, and a fourth amendment layer would be unreadable for officers and the public.","status":"Agreed"},{"id":"D02","date":"2026-09-08","title":"Commencement target set at 19 June 2028","forum":"Project steering group","decision":"Plan to a commencement date one month clear of the 19 July 2028 sunset.","rationale":"Preserves a month of recovery time for a gazettal or administrative delay without touching the making decision.","status":"Agreed"},{"id":"D03","date":"2026-09-01","title":"Pilots close by 30 June 2027","forum":"Project steering group","decision":"Every pilot must report by gate G4. Pilots that cannot report by then will not be started.","rationale":"Drafting instructions are approved in September 2027. Evidence after that date cannot change the draft.","status":"Agreed"},{"id":"D04","date":"2026-10-26","title":"Charter of Human Rights assessment starts in phase 1","forum":"Executive Leadership Team","decision":"Bring the Charter compatibility assessment forward to run alongside the clause triage rather than after drafting.","rationale":"An assessment done after drafting cannot influence the drafting. Clauses 143, 120, 149 and 177 need the analysis before the instructions are written.","status":"Proposed"},{"id":"D05","date":"2026-11-16","title":"Treatment of the three incorporated documents","forum":"Executive Leadership Team","decision":"Pending — whether the Footpath Trading and Keeping of Animals policies stay incorporated under cl.19 or move into the law itself.","rationale":"Incorporation keeps the documents amendable without remaking the law, but weakens enforceability and leaves obligations outside the instrument people read.","status":"Open"}]};
const TODAY = new Date();

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = (s) => new Date(s + "T00:00:00");
const days = (a, b) => Math.round((day(b) - a) / 86400000);
const fmt = (s) => day(s).toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
const fmtShort = (s) => day(s).toLocaleDateString("en-AU", { day: "numeric", month: "short" });
const monthYear = (d) => d.toLocaleDateString("en-AU", { month: "short", year: "2-digit" });

const DISPOSITIONS = ["Not started", "Under review", "Retain", "Amend", "Rewrite", "Revoke", "Move to policy"];
const DISP_COLOUR = { "Not started": "var(--rule-strong)", "Under review": "var(--blue)", Retain: "var(--green)", Amend: "var(--amber)", Rewrite: "var(--teal)", Revoke: "var(--accent)", "Move to policy": "var(--ink-3)" };
const DISP_PILL = { "Not started": "grey", "Under review": "blue", Retain: "green", Amend: "amber", Rewrite: "teal", Revoke: "red", "Move to policy": "grey" };
const PROPOSAL_STATUS = ["Parked", "Triage", "In scope", "Out of scope", "Deferred to next review"];
const PS_PILL = { Parked: "grey", Triage: "blue", "In scope": "green", "Out of scope": "red", "Deferred to next review": "amber" };
const GATE_STATUS = ["Not started", "In progress", "At risk", "Complete"];
const GS_PILL = { "Not started": "grey", "In progress": "blue", "At risk": "red", Complete: "green" };
const RUN_STATUS = ["Planned", "Running", "Reporting", "Complete", "Dropped"];
const RS_PILL = { Planned: "grey", Running: "blue", Reporting: "amber", Complete: "green", Dropped: "red" };
const UNITS = [...new Set(D.clauses.map((c) => c.owner))].sort();
const TAG_LABEL = { P: ["p", "Permit"], N: ["n", "Notice"], I: ["i", "Offence"], D: ["", "Machinery"], X: ["x", "Superseded"] };

/* ---------- state ---------- */
const overlay = { clauses: {}, proposals: {}, gates: {}, pilots: {}, risks: {}, engagement: {} };
let dbDoc = null, dbExists = false;
const filters = { q: "", part: "", disp: "", owner: "", tag: "", pstatus: "", punit: "" };
let initials = "";
try { initials = localStorage.getItem("llr-initials") || ""; } catch (e) {}

const ov = (kind, id, field, fallback) => {
  const o = overlay[kind] && overlay[kind][id];
  return o && o[field] !== undefined && o[field] !== null ? o[field] : fallback;
};
const stamp = (kind, id, patch) => {
  const body = Object.assign({}, patch, { at: new Date().toISOString().slice(0, 10) });
  if (initials) body.by = initials.toUpperCase();
  overlay[kind][id] = Object.assign({}, overlay[kind][id], body);
  write(kind, id, body);
  return body;
};
const editedNote = (kind, id) => {
  const o = overlay[kind][id];
  if (!o || !o.at) return "";
  return `<span class="meta">Changed ${esc(fmtShort(o.at))}${o.by ? " · " + esc(o.by) : ""}</span>`;
};

/* ---------- persistence ---------- */
async function write(kind, id, body) {
  if (!dbDoc) return;
  const patch = { [kind]: { [id]: body } };
  try {
    if (dbExists) await dbDoc.update(patch);
    else { await dbDoc.set(patch); dbExists = true; }
  } catch (e) {
    if (e && e.code === "invalid_argument" && !dbExists) {
      try { await dbDoc.set(patch); dbExists = true; return; } catch (e2) {}
    }
    setDbStatus("local", "Change not saved — working locally");
  }
}
function setDbStatus(kind, text) {
  const dot = $("#dbdot"), t = $("#dbtext");
  if (!dot) return;
  dot.className = "dot" + (kind ? " " + kind : "");
  t.textContent = text;
}
(async function connect() {
  const db = window.claude && (await window.claude.use("db"));
  if (!db) { setDbStatus("local", "Working copy — changes stay in this browser"); return; }
  dbDoc = db.doc("program/state");
  dbDoc.onSnapshot(
    (snap) => {
      dbExists = snap.exists;
      const data = snap.data() || {};
      for (const k of Object.keys(overlay)) overlay[k] = data[k] || {};
      setDbStatus("live", "Shared with the project team");
      render();
    },
    () => setDbStatus("local", "Shared copy unavailable — working locally"),
  );
})();

/* ---------- derived program facts ---------- */
const LAW = D.program.law;
const GATES = D.program.gates.map((g) => Object.assign({}, g));
const gateStatus = (g) => ov("gates", g.id, "status", g.status);
const gateDate = (g) => ov("gates", g.id, "date", g.date);
const daysToSunset = days(TODAY, LAW.sunset);
const decisionGate = GATES.find((g) => g.id === "G10");
const commence = GATES.find((g) => g.id === "G12");
const floatWeeks = Math.round(days(day(gateDate(commence)), LAW.sunset) / 7);
const nextGate = () => GATES.filter((g) => gateStatus(g) !== "Complete").sort((a, b) => gateDate(a).localeCompare(gateDate(b)))[0];

const dispOf = (c) => ov("clauses", c.id, "disposition", c.disposition);
const ownerOf = (c) => ov("clauses", c.id, "owner", c.owner);
const pstatusOf = (p) => ov("proposals", p.id, "status", p.status);
const clauseTally = () => {
  const t = {};
  for (const d of DISPOSITIONS) t[d] = 0;
  for (const c of D.clauses) t[dispOf(c)] = (t[dispOf(c)] || 0) + 1;
  return t;
};

/* ---------- topbar ---------- */
function renderTop() {
  const g = nextGate();
  const done = D.clauses.filter((c) => dispOf(c) !== "Not started").length;
  $("#topbar").innerHTML = `
    <div class="tb alert"><span class="k">Sunset</span><span class="v count">${daysToSunset} days</span></div>
    <div class="tb"><span class="k">Next gate</span><span class="v">${esc(g ? g.id + " · " + fmtShort(gateDate(g)) : "All gates closed")}</span></div>
    <div class="tb"><span class="k">Clauses triaged</span><span class="v count">${done}/${D.clauses.length}</span></div>
    <div class="tb"><span class="k">In scope</span><span class="v count">${D.proposals.filter((p) => pstatusOf(p) === "In scope").length} of ${D.proposals.length} proposals</span></div>`;
}

/* ---------- view: program ---------- */
function viewProgram() {
  const t = clauseTally();
  const totalC = D.clauses.length;
  const bars = DISPOSITIONS.filter((d) => t[d]).map((d) => `<i style="width:${(t[d] / totalC) * 100}%;background:${DISP_COLOUR[d]}"></i>`).join("");
  const key = DISPOSITIONS.filter((d) => t[d]).map((d) => `<span><i style="background:${DISP_COLOUR[d]}"></i>${esc(d)} <b>${t[d]}</b></span>`).join("");

  const horizon = GATES.filter((g) => days(TODAY, gateDate(g)) <= 180 && gateStatus(g) !== "Complete")
    .sort((a, b) => gateDate(a).localeCompare(gateDate(b)));
  const soon = horizon.map((g) => {
    const d = days(TODAY, gateDate(g));
    return `<div class="item"><div class="top"><span class="ti">${esc(g.id)} · ${esc(g.title)}</span><span class="date">${esc(fmtShort(gateDate(g)))}</span></div>
      <div class="sub">${esc(g.forum)} · ${esc(ov("gates", g.id, "owner", g.owner))} · <span class="pill ${GS_PILL[gateStatus(g)]}">${esc(gateStatus(g))}</span> · ${d < 0 ? "overdue by " + -d : "in " + d} days</div></div>`;
  }).join("") || `<div class="item"><div class="sub">Nothing falls due in the next six months.</div></div>`;

  const topRisks = D.risks
    .map((r) => ({ r, s: ov("risks", r.id, "likelihood", r.likelihood) * ov("risks", r.id, "consequence", r.consequence) }))
    .sort((a, b) => b.s - a.s).slice(0, 5)
    .map(({ r, s }) => `<div class="item"><div class="top"><span class="ti">${esc(r.title)}</span><span class="date">${s}</span></div>
      <div class="sub">${esc(r.id)} · ${esc(ov("risks", r.id, "owner", r.owner))} · <span class="pill ${s >= 15 ? "red" : s >= 9 ? "amber" : "grey"}">${s >= 15 ? "Severe" : s >= 9 ? "High" : "Moderate"}</span></div></div>`).join("");

  const livePilots = D.pilots.filter((p) => ov("pilots", p.id, "status", p.status) !== "Dropped").length;
  const g4 = GATES.find((g) => g.id === "G4");

  return `
  <div class="vh">
    <div class="eyebrow">01 — Program</div>
    <h2>Everything works backwards from one date</h2>
    <p>Clause 4 of the current law ends it on 19 July 2028, ten years after it commenced. There is no power to extend that date, so the whole program is a backward plan from a fixed wall.</p>
  </div>

  <div class="seal">
    <div><div class="k">Days to sunset</div><div class="big hot">${daysToSunset}</div><div class="cap">${esc(fmt(LAW.sunset))} — cl.&nbsp;4 of the 2018 law</div></div>
    <div><div class="k">To the making decision</div><div class="big">${days(TODAY, gateDate(decisionGate))}</div><div class="cap">${esc(decisionGate.id)} at Council, ${esc(fmt(gateDate(decisionGate)))}. The last immovable decision.</div></div>
    <div><div class="k">Float at commencement</div><div class="big">${floatWeeks}<span style="font-size:18px"> wks</span></div><div class="cap">Between the planned commencement and the sunset. This is the whole safety margin.</div></div>
    <div><div class="k">Clauses to triage</div><div class="big">${totalC - D.clauses.filter((c) => dispOf(c) !== "Not started").length}</div><div class="cap">Of ${totalC} operative clauses still without a disposition.</div></div>
    <div><div class="k">Pilots committed</div><div class="big">${livePilots}</div><div class="cap">Every one reports by G4, ${esc(fmt(gateDate(g4)))}. A pilot that cannot report by then does not start.</div></div>
  </div>

  <h3 class="sec">Phases and gates <span class="tally">Sep 2026 – Oct 2028</span></h3>
  ${gantt()}

  <div class="grid2" style="margin-top:26px">
    <div class="panel"><h4>Falling due in the next six months</h4><p class="lede">Gates in date order, with the forum that has to sign them off.</p><div class="stack">${soon}</div></div>
    <div class="panel"><h4>Risks carrying the most exposure</h4><p class="lede">Likelihood &times; consequence, scored out of 25.</p><div class="stack">${topRisks}</div></div>
  </div>

  <h3 class="sec">Where the clause register stands <span class="tally">${totalC} operative clauses</span></h3>
  <div class="tallybar">${bars}</div>
  <div class="tallykey">${key}</div>

  <div class="caveat"><b>Statutory steps still to be confirmed.</b> The gates marked with a flag carry a provisional reference to the Local Government Act 2020 and Council's Governance Rules. Governance and Legal should confirm the exact notice period, submission process and publication requirements before G2 is written up — the dates here assume a conventional exhibition and hearing cycle, not a verified pin-cite.</div>`;
}

function gantt() {
  const t0 = day("2026-09-01"), t1 = day("2028-10-01");
  const span = t1 - t0;
  const pos = (d) => ((day(d) - t0) / span) * 100;
  const nowPos = ((TODAY - t0) / span) * 100;

  let ticks = "";
  for (let y = 2026; y <= 2028; y++)
    for (let m = 0; m < 12; m += 3) {
      const d = new Date(y, m, 1);
      if (d < t0 || d > t1) continue;
      ticks += `<span style="left:${((d - t0) / span) * 100}%">${monthYear(d)}</span>`;
    }

  const bounds = D.program.boundaries
    .map((b) => `<div class="vline hard" style="left:${pos(b.date)}%;opacity:${b.kind === "immovable" ? .9 : .45}" title="${esc(b.label)}"></div>`)
    .join("");

  const rows = D.program.phases.map((p) => {
    const live = day(p.start) <= TODAY && TODAY <= day(p.end);
    return `<div class="gantt-row"><div class="lab"><b>${esc(p.name)}</b>${esc(p.lead)}</div>
      <div class="track">
        <div class="bar${live ? " now" : ""}" style="left:${pos(p.start)}%;width:${pos(p.end) - pos(p.start)}%" title="${esc(p.name)}: ${esc(fmt(p.start))} – ${esc(fmt(p.end))}"></div>
        ${bounds}
        <div class="vline now" style="left:${nowPos}%"></div>
      </div></div>`;
  }).join("");

  const marks = GATES.map((g) => {
    const s = gateStatus(g);
    const cls = s === "Complete" ? "done" : s === "In progress" || s === "At risk" ? "active" : "";
    return `<button class="mark ${cls}" style="left:${pos(gateDate(g))}%" data-gate="${esc(g.id)}" title="${esc(g.title)} — ${esc(fmt(gateDate(g)))}" aria-label="${esc(g.id)}: ${esc(g.title)}"><i></i><b>${esc(g.id)}</b></button>`;
  }).join("");

  return `<div class="gantt"><div class="gantt-in">
    <div class="axis">${ticks}</div>
    ${rows}
    <div class="gantt-row"><div class="lab"><b>Hard dates</b>no float past these</div>
      <div class="track hardrow">${bounds}
      ${D.program.boundaries.map((b) => `<span class="hardlab" style="left:${pos(b.date)}%">${b.kind === "immovable" ? "SUNSET" : "CARETAKER"}</span>`).join("")}</div></div>
    <div class="gantt-marks">${marks}</div>
  </div>
  <div class="legend">
    <span><i style="background:var(--accent)"></i>Running now</span>
    <span><i style="background:var(--teal);opacity:.82"></i>Phase</span>
    <span><i style="background:var(--green);transform:rotate(45deg);width:8px;height:8px"></i>Gate closed</span>
    <span><i style="background:transparent;border-left:1px dashed var(--accent);border-radius:0;width:1px"></i>Dates that cannot move</span>
    <span style="color:var(--ink-2)">Select a gate marker for what has to be true before it closes.</span>
  </div></div>`;
}

/* ---------- view: clauses ---------- */
function viewClauses() {
  const t = clauseTally();
  const parts = [...new Set(D.clauses.map((c) => c.part))];
  const rows = [];
  let lastPart = null;

  const list = D.clauses.filter((c) => {
    const q = filters.q.toLowerCase();
    if (q && !(c.title.toLowerCase().includes(q) || c.id.includes(q) || c.partTitle.toLowerCase().includes(q))) return false;
    if (filters.part && String(c.part) !== filters.part) return false;
    if (filters.disp && dispOf(c) !== filters.disp) return false;
    if (filters.owner && ownerOf(c) !== filters.owner) return false;
    if (filters.tag && !c.tags.includes(filters.tag)) return false;
    return true;
  });

  for (const c of list) {
    if (c.part !== lastPart) {
      if (lastPart === 3 && c.part === 5)
        rows.push(`<tr class="gaprow"><td colspan="6">Part 4 — Council administration. Repealed in 2023 and moved to the Governance Rules; clause numbering jumps from 24 to 104.</td></tr>`);
      rows.push(`<tr class="gaprow"><td colspan="6">Part ${c.part} — ${esc(c.partTitle)}</td></tr>`);
      lastPart = c.part;
    }
    const d = dispOf(c), o = ownerOf(c);
    rows.push(`<tr>
      <td class="num">cl.&nbsp;${esc(c.id)}</td>
      <td><div class="ti">${esc(c.title)}</div>
        <div class="meta">${c.tags.map((g) => `<span class="chip ${TAG_LABEL[g][0]}">${esc(TAG_LABEL[g][1])}</span>`).join("")}
        ${c.proposals.map((p) => `<button class="chip link" data-proposal="${esc(p)}">${esc(p)}</button>`).join("")}</div></td>
      <td><select class="sel-dis" data-clause="${esc(c.id)}" data-field="disposition" aria-label="Disposition for clause ${esc(c.id)}">${DISPOSITIONS.map((x) => `<option${x === d ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></td>
      <td><select class="sel-own" data-clause="${esc(c.id)}" data-field="owner" aria-label="Owner for clause ${esc(c.id)}">${UNITS.map((x) => `<option${x === o ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></td>
      <td style="min-width:190px"><textarea data-clause="${esc(c.id)}" data-field="note" rows="1" placeholder="Review note…" aria-label="Note for clause ${esc(c.id)}">${esc(ov("clauses", c.id, "note", ""))}</textarea>${editedNote("clauses", c.id)}</td>
    </tr>`);
  }

  const bars = DISPOSITIONS.filter((d) => t[d]).map((d) => `<i style="width:${(t[d] / D.clauses.length) * 100}%;background:${DISP_COLOUR[d]}"></i>`).join("");
  const key = DISPOSITIONS.filter((d) => t[d]).map((d) => `<span><i style="background:${DISP_COLOUR[d]}"></i>${esc(d)} <b>${t[d]}</b></span>`).join("");

  return `
  <div class="vh">
    <div class="eyebrow">02 — Clause register</div>
    <h2>Every operative clause, with a decision against it</h2>
    <p>The complete register of General Local Law 2018 (No.&nbsp;1) as amended in 2023. Gate G3 is met when no clause is left at “Not started”. Changes save for the whole project team.</p>
  </div>
  <div class="tallybar">${bars}</div>
  <div class="tallykey">${key}</div>
  <div class="filters">
    <input type="search" id="f-q" placeholder="Search clause number, title or part…" value="${esc(filters.q)}" aria-label="Search clauses">
    <label for="f-part">Part</label>
    <select id="f-part"><option value="">All</option>${parts.map((p) => `<option value="${p}"${filters.part == p ? " selected" : ""}>Part ${p}</option>`).join("")}</select>
    <label for="f-disp">Disposition</label>
    <select id="f-disp"><option value="">All</option>${DISPOSITIONS.map((x) => `<option${filters.disp === x ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
    <label for="f-owner">Owner</label>
    <select id="f-owner"><option value="">All</option>${UNITS.map((x) => `<option${filters.owner === x ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
    <label for="f-tag">Type</label>
    <select id="f-tag"><option value="">All</option>${Object.entries(TAG_LABEL).map(([k, v]) => `<option value="${k}"${filters.tag === k ? " selected" : ""}>${esc(v[1])}</option>`).join("")}</select>
    <button class="clearbtn" id="f-clear" type="button">Clear</button>
    <span class="meta" style="margin-left:auto;color:var(--ink-3);font-family:var(--mono);font-size:11px">${list.length} shown</span>
  </div>
  <div class="tablewrap"><table class="ledger">
    <thead><tr><th>Clause</th><th>Title &amp; type</th><th>Disposition</th><th>Owning unit</th><th>Review note</th></tr></thead>
    <tbody>${rows.join("")}</tbody>
  </table></div>
  <p class="note">Type markers come from the law itself: <b>Permit</b> is a clause that creates a permit trigger, <b>Notice</b> a notice-to-comply or directive power, <b>Offence</b> conduct that can be infringed, <b>Superseded</b> a clause that already points at the Local Government Act 1989 or at Part 4, repealed in 2023.</p>`;
}

/* ---------- view: proposals ---------- */
function viewProposals() {
  const list = D.proposals.filter((p) => {
    if (filters.pstatus && pstatusOf(p) !== filters.pstatus) return false;
    if (filters.punit && p.unit !== filters.punit) return false;
    return true;
  });
  const units = [...new Set(D.proposals.map((p) => p.unit))].sort();

  const cells = {};
  for (const p of D.proposals) {
    const k = p.impact + ":" + p.effort;
    (cells[k] = cells[k] || []).push(p);
  }
  let grid = "";
  for (let i = 5; i >= 1; i--) {
    grid += i === 5 ? `<div class="ylab">Impact →</div>` : "";
    for (let e = 1; e <= 5; e++) {
      const here = cells[i + ":" + e] || [];
      const lvl = i >= 4 && e <= 2 ? "l1" : i >= 4 ? "l3" : i >= 3 ? "l2" : "l2";
      grid += `<div class="cell ${lvl}">${here.map((p) => `<button class="tok" data-proposal="${esc(p.id)}" title="${esc(p.title)}">${esc(p.id)}</button>`).join("")}</div>`;
    }
  }
  grid += `<div></div>` + [1, 2, 3, 4, 5].map((e) => `<div class="xlab">${e}</div>`).join("");

  const rows = list.sort((a, b) => b.impact * 2 - b.effort - (a.impact * 2 - a.effort)).map((p) => {
    const s = pstatusOf(p);
    return `<tr>
      <td class="num">${esc(p.id)}</td>
      <td><div class="ti"><button class="tok" style="border:0;background:none;padding:0;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer" data-proposal="${esc(p.id)}">${esc(p.title)}</button></div>
        <div class="meta">${p.clauses.map((c) => `<span class="chip">cl. ${esc(c)}</span>`).join("")} · Raised ${esc(p.raised)} · ${esc(p.source)}</div></td>
      <td>${esc(p.unit)}</td>
      <td class="num">${p.impact} / ${p.effort}</td>
      <td><span class="pill ${p.sensitivity === "Critical" ? "red" : p.sensitivity === "High" ? "amber" : "grey"}">${esc(p.sensitivity)}</span></td>
      <td><select data-proposal-field="${esc(p.id)}" aria-label="Status for ${esc(p.id)}">${PROPOSAL_STATUS.map((x) => `<option${x === s ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>${editedNote("proposals", p.id)}</td>
    </tr>`;
  }).join("");

  const aged = D.proposals.filter((p) => p.raised < "2021").length;

  return `
  <div class="vh">
    <div class="eyebrow">03 — Proposals</div>
    <h2>The backlog, in the open</h2>
    <p>Every change that has been asked for, including the ones that have been sitting with a manager since 2019. Nothing leaves this list without a disposition — in scope, out of scope, or deferred with a stated reason. ${aged} of the ${D.proposals.length} items have been open since 2020 or earlier.</p>
  </div>
  <div class="grid2" style="align-items:start">
    <div class="matrix">
      <h4 style="font-family:var(--serif);font-size:14.5px;margin-bottom:3px">Impact against effort</h4>
      <p class="lede" style="font-size:12px;color:var(--ink-3);margin:0 0 14px">High impact, low effort sits top left. Select an item for the full note.</p>
      <div class="mx">${grid}</div>
      <div class="mxfoot"><span>Effort, 1 (least) to 5 (most)</span></div>
    </div>
    <div class="panel">
      <h4>How to read this</h4>
      <p class="lede">Position is the argument for sequencing, not the decision.</p>
      <div class="stack">
        <div class="item"><div class="ti">Top-left items belong in the first drafting tranche</div><div class="sub">High impact, low effort. P20 (repeal spent machinery clauses) and P04 (nature strip planting) can be settled without consultation load.</div></div>
        <div class="item"><div class="ti">High impact, high effort items need the pilots</div><div class="sub">P01, P07, P09 and P14 all carry an operational unknown. Each has a pilot attached so the drafting rests on evidence rather than argument.</div></div>
        <div class="item"><div class="ti">Critical sensitivity is a consultation signal, not a stop</div><div class="sub">P08 (camping) and P09 (cat containment) will generate the submission volume. Plan the hearing capacity for these two alone.</div></div>
        <div class="item"><div class="ti">Parked items still need a decision</div><div class="sub">Three items have sat since 2019–2020. Leaving them parked through the review means carrying them for another ten years.</div></div>
      </div>
    </div>
  </div>
  <div class="filters" style="margin-top:22px">
    <label for="f-ps">Status</label>
    <select id="f-ps"><option value="">All</option>${PROPOSAL_STATUS.map((x) => `<option${filters.pstatus === x ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
    <label for="f-pu">Unit</label>
    <select id="f-pu"><option value="">All</option>${units.map((x) => `<option${filters.punit === x ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
    <button class="clearbtn" id="f-pclear" type="button">Clear</button>
    <span style="margin-left:auto;color:var(--ink-3);font-family:var(--mono);font-size:11px">${list.length} shown</span>
  </div>
  <div class="tablewrap"><table class="ledger">
    <thead><tr><th>Ref</th><th>Proposal</th><th>Sponsor</th><th>Impact / effort</th><th>Sensitivity</th><th>Disposition</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------- view: engagement ---------- */
function viewEngagement() {
  const phases = Object.fromEntries(D.program.phases.map((p) => [p.id, p.name]));
  const IAP2 = { Inform: "grey", Consult: "blue", Involve: "teal", Collaborate: "green", Empower: "amber" };
  const rows = D.engagement.map((e) => {
    const s = ov("engagement", e.id, "status", e.status);
    return `<tr>
      <td class="num">${esc(e.id)}</td>
      <td><div class="ti">${esc(e.name)}</div><div class="meta">${esc(e.note)}</div></td>
      <td><span class="pill ${IAP2[e.iap2] || "grey"}">${esc(e.iap2)}</span></td>
      <td>${esc(e.audience)}</td>
      <td class="num">${esc(e.window)}</td>
      <td>${esc(e.owner)}</td>
      <td><select data-eng="${esc(e.id)}" aria-label="Status for ${esc(e.id)}">${RUN_STATUS.map((x) => `<option${x === s ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>${editedNote("engagement", e.id)}</td>
    </tr>`;
  }).join("");

  return `
  <div class="vh">
    <div class="eyebrow">04 — Engagement</div>
    <h2>Consult before the positions harden, not after</h2>
    <p>The statutory exhibition at phase 7 is the formal step, but it is a poor place to discover an objection. The issues-stage work in phase 3 is what makes the formal stage survivable — and what the Community Engagement Policy expects.</p>
  </div>
  <div class="caveat"><b>Check this against the Act before G2.</b> The exhibition and submission arrangements at E10 and E11 are planned on a conventional cycle: public notice stating the purpose and general purport of the proposed law, copies available, a submission period, and a hearing for those who ask to be heard. Governance and Legal should confirm the current requirements under the Local Government Act 2020 and Council's Governance Rules, and the dates in the program should be re-cut if the notice period differs.</div>
  <div class="tablewrap"><table class="ledger">
    <thead><tr><th>Ref</th><th>Activity</th><th>IAP2</th><th>Who</th><th>When</th><th>Lead</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  <p class="note">IAP2 levels set the promise made to participants. <b>Consult</b> promises to listen and report back; <b>Involve</b> promises that concerns will be reflected; <b>Collaborate</b> promises the advice will shape the recommendation. Do not promise a level the gate dates cannot honour.</p>`;
}

/* ---------- view: pilots ---------- */
function viewPilots() {
  const t0 = day("2026-09-01"), t1 = day("2027-09-01"), span = t1 - t0;
  const pos = (d) => Math.max(0, Math.min(100, ((day(d) - t0) / span) * 100));
  const cards = D.pilots.map((p) => {
    const s = ov("pilots", p.id, "status", p.status);
    return `<div class="card">
      <div class="hd"><span class="id">${esc(p.id)}</span><span class="pill ${RS_PILL[s]}">${esc(s)}</span></div>
      <h4>${esc(p.title)}</h4>
      <div class="track" style="height:8px"><div class="bar" style="left:${pos(p.start)}%;width:${pos(p.end) - pos(p.start)}%;top:0;height:8px"></div></div>
      <div class="kv"><b>${esc(fmtShort(p.start))} – ${esc(fmt(p.end))}</b></div>
      <p class="test">${esc(p.hypothesis)}</p>
      <div class="kv"><b>Measured by</b></div><p style="font-size:12px;margin-top:-4px">${esc(p.measure)}</p>
      <div class="kv"><b>Runs under</b></div><p style="font-size:12px;margin-top:-4px">${esc(p.powers)}</p>
      <div class="foot">
        <span class="kv"><b>${esc(p.owner)}</b></span>
        ${p.proposals.map((x) => `<button class="chip link" data-proposal="${esc(x)}">${esc(x)}</button>`).join("")}
        <select data-pilot="${esc(p.id)}" style="margin-left:auto" aria-label="Status for ${esc(p.id)}">${RUN_STATUS.map((x) => `<option${x === s ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
      </div>${editedNote("pilots", p.id)}
    </div>`;
  }).join("");

  return `
  <div class="vh">
    <div class="eyebrow">05 — Pilots</div>
    <h2>Test it while you can still change the drafting</h2>
    <p>Each pilot runs under powers Council already has — permit conditions, operator agreements, policy — so none of them waits on the new law. All seven must report by G4 on 28 June 2027, because drafting instructions are approved in September 2027 and evidence after that date changes nothing.</p>
  </div>
  <div class="cards">${cards}</div>
  <p class="note">A pilot without a stated measure is a trial balloon. Every card above names what will be counted and against what, so the evaluation at G4 is an assessment rather than an argument.</p>`;
}

/* ---------- view: risks ---------- */
function viewRisks() {
  const cells = {};
  for (const r of D.risks) {
    const l = ov("risks", r.id, "likelihood", r.likelihood), c = ov("risks", r.id, "consequence", r.consequence);
    (cells[l + ":" + c] = cells[l + ":" + c] || []).push(r);
  }
  let grid = "";
  for (let c = 5; c >= 1; c--) {
    grid += c === 5 ? `<div class="ylab">Consequence →</div>` : "";
    for (let l = 1; l <= 5; l++) {
      const s = l * c;
      const lvl = s >= 15 ? "l4" : s >= 9 ? "l3" : s >= 4 ? "l2" : "l1";
      grid += `<div class="cell ${lvl}">${(cells[l + ":" + c] || []).map((r) => `<button class="tok" data-risk="${esc(r.id)}" title="${esc(r.title)}">${esc(r.id)}</button>`).join("")}</div>`;
    }
  }
  grid += `<div></div>` + [1, 2, 3, 4, 5].map((l) => `<div class="xlab">${l}</div>`).join("");

  const rrows = D.risks.map((r) => {
    const l = ov("risks", r.id, "likelihood", r.likelihood), c = ov("risks", r.id, "consequence", r.consequence), s = l * c;
    const st = ov("risks", r.id, "status", r.status);
    return `<tr>
      <td class="num">${esc(r.id)}</td>
      <td><div class="ti"><button class="tok" style="border:0;background:none;padding:0;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer" data-risk="${esc(r.id)}">${esc(r.title)}</button></div><div class="meta">${esc(r.note)}</div></td>
      <td class="num">${l} &times; ${c} = <b>${s}</b></td>
      <td><span class="pill ${s >= 15 ? "red" : s >= 9 ? "amber" : "grey"}">${s >= 15 ? "Severe" : s >= 9 ? "High" : "Moderate"}</span></td>
      <td>${esc(ov("risks", r.id, "owner", r.owner))}</td>
      <td><select data-riskstatus="${esc(r.id)}" aria-label="Status for ${esc(r.id)}">${["Open", "Monitoring", "Treated", "Closed"].map((x) => `<option${x === st ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>${editedNote("risks", r.id)}</td>
    </tr>`;
  }).join("");

  const drows = D.decisions.map((d) => `<tr>
      <td class="num">${esc(d.id)}</td>
      <td class="num">${esc(fmtShort(d.date))}</td>
      <td><div class="ti">${esc(d.title)}</div><div class="meta">${esc(d.decision)}</div></td>
      <td style="max-width:290px"><div class="meta" style="margin:0">${esc(d.rationale)}</div></td>
      <td>${esc(d.forum)}</td>
      <td><span class="pill ${d.status === "Agreed" ? "green" : d.status === "Proposed" ? "blue" : "amber"}">${esc(d.status)}</span></td>
    </tr>`).join("");

  return `
  <div class="vh">
    <div class="eyebrow">06 — Risks &amp; decisions</div>
    <h2>What could take the date away, and what has already been settled</h2>
    <p>Two risks carry a consequence of 5: missing the sunset, and slipping into the 2028 election caretaker period. Everything else is recoverable. The decision log below is what stops settled questions being reopened at the last briefing.</p>
  </div>
  <div class="grid2" style="align-items:start">
    <div class="matrix">
      <h4 style="font-family:var(--serif);font-size:14.5px;margin-bottom:3px">Risk position</h4>
      <p class="lede" style="font-size:12px;color:var(--ink-3);margin:0 0 14px">Likelihood across, consequence up. Select a marker for the treatment.</p>
      <div class="mx">${grid}</div>
      <div class="mxfoot"><span>Likelihood, 1 (rare) to 5 (near certain)</span></div>
    </div>
    <div class="panel">
      <h4>Decision log</h4>
      <p class="lede">Five decisions recorded. D05 is still open.</p>
      <div class="stack">${D.decisions.map((d) => `<div class="item"><div class="top"><span class="ti">${esc(d.title)}</span><span class="date">${esc(fmtShort(d.date))}</span></div><div class="sub">${esc(d.decision)}</div></div>`).join("")}</div>
    </div>
  </div>
  <h3 class="sec">Risk register <span class="tally">${D.risks.length} open</span></h3>
  <div class="tablewrap"><table class="ledger">
    <thead><tr><th>Ref</th><th>Risk</th><th>Score</th><th>Rating</th><th>Owner</th><th>Status</th></tr></thead>
    <tbody>${rrows}</tbody></table></div>
  <h3 class="sec">Decisions</h3>
  <div class="tablewrap"><table class="ledger">
    <thead><tr><th>Ref</th><th>Date</th><th>Decision</th><th>Why</th><th>Forum</th><th>Status</th></tr></thead>
    <tbody>${drows}</tbody></table></div>`;
}

/* ---------- drawer ---------- */
function openDrawer(html) {
  $("#drawer-body").innerHTML = html;
  $("#drawer").setAttribute("open", "");
  $("#drawer .close").focus();
}
function closeDrawer() { $("#drawer").removeAttribute("open"); }

function drawerProposal(id) {
  const p = D.proposals.find((x) => x.id === id);
  if (!p) return;
  const pilot = p.pilot ? D.pilots.find((x) => x.id === p.pilot) : null;
  openDrawer(`
    <div class="crest" style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)">Proposal ${esc(p.id)}</div>
    <h3 id="drawer-title">${esc(p.title)}</h3>
    <div style="margin:10px 0"><span class="pill ${PS_PILL[pstatusOf(p)]}">${esc(pstatusOf(p))}</span>
      <span class="pill ${p.sensitivity === "Critical" ? "red" : p.sensitivity === "High" ? "amber" : "grey"}">${esc(p.sensitivity)} sensitivity</span></div>
    <div class="drow"><div class="k">The issue</div>${esc(p.note)}</div>
    <div class="drow"><div class="k">Clauses engaged</div>${p.clauses.map((c) => {
      const cl = D.clauses.find((x) => x.id === c);
      return cl ? `cl.&nbsp;${esc(c)} — ${esc(cl.title)}` : "cl. " + esc(c);
    }).join("<br>")}</div>
    <div class="drow"><div class="k">Raised</div>${esc(p.raised)} · ${esc(p.source)}</div>
    <div class="drow"><div class="k">Sponsor</div>${esc(p.unit)}</div>
    <div class="drow"><div class="k">Impact / effort</div>${p.impact} / ${p.effort}</div>
    ${pilot ? `<div class="drow"><div class="k">Evidence from</div><b>${esc(pilot.id)}</b> — ${esc(pilot.title)}<br><span style="color:var(--ink-3)">${esc(pilot.measure)}</span></div>` : `<div class="drow"><div class="k">Evidence</div>No pilot attached. Evidence comes from the enforcement data review in phase 2.</div>`}
    <div class="drow"><div class="k">Project note</div>
      <textarea data-proposal-note="${esc(p.id)}" rows="4" placeholder="Working note for the drafting file…">${esc(ov("proposals", p.id, "note", ""))}</textarea>
      ${editedNote("proposals", p.id)}</div>`);
}

function drawerGate(id) {
  const g = GATES.find((x) => x.id === id);
  if (!g) return;
  const phase = D.program.phases.find((p) => p.id === g.phase);
  openDrawer(`
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)">Gate ${esc(g.id)}</div>
    <h3 id="drawer-title">${esc(g.title)}</h3>
    <div style="margin:10px 0"><span class="pill ${GS_PILL[gateStatus(g)]}">${esc(gateStatus(g))}</span>
      <span class="pill grey">${esc(fmt(gateDate(g)))}</span></div>
    <div class="drow"><div class="k">What must be true</div>${esc(g.test)}</div>
    <div class="drow"><div class="k">Decided by</div>${esc(g.forum)} · owner ${esc(ov("gates", g.id, "owner", g.owner))}</div>
    <div class="drow"><div class="k">Phase</div>${esc(phase ? phase.name : g.phase)}${phase ? " — " + esc(phase.detail) : ""}</div>
    <div class="drow"><div class="k">Authority</div>${esc(g.authority)}${g.confirm ? ` <span class="chip n">Confirm with Governance</span>` : ""}</div>
    <div class="drow"><div class="k">Status</div>
      <select data-gate-status="${esc(g.id)}" aria-label="Status for ${esc(g.id)}">${GATE_STATUS.map((x) => `<option${x === gateStatus(g) ? " selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
    <div class="drow"><div class="k">Note</div>
      <textarea data-gate-note="${esc(g.id)}" rows="4" placeholder="Progress note…">${esc(ov("gates", g.id, "note", ""))}</textarea>${editedNote("gates", g.id)}</div>`);
}

function drawerRisk(id) {
  const r = D.risks.find((x) => x.id === id);
  if (!r) return;
  const l = ov("risks", r.id, "likelihood", r.likelihood), c = ov("risks", r.id, "consequence", r.consequence);
  openDrawer(`
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)">Risk ${esc(r.id)}</div>
    <h3 id="drawer-title">${esc(r.title)}</h3>
    <div style="margin:10px 0"><span class="pill ${l * c >= 15 ? "red" : l * c >= 9 ? "amber" : "grey"}">Score ${l * c}</span>
      <span class="pill grey">${esc(ov("risks", r.id, "status", r.status))}</span></div>
    <div class="drow"><div class="k">Why it matters</div>${esc(r.note)}</div>
    <div class="drow"><div class="k">Treatment</div>${esc(r.treatment)}</div>
    <div class="drow"><div class="k">Owner</div>${esc(ov("risks", r.id, "owner", r.owner))}</div>
    <div class="drow"><div class="k">Likelihood</div>
      <select data-risk-l="${esc(r.id)}" aria-label="Likelihood">${[1, 2, 3, 4, 5].map((x) => `<option${x === l ? " selected" : ""}>${x}</option>`).join("")}</select>
      <span style="margin-left:12px" class="k">Consequence</span>
      <select data-risk-c="${esc(r.id)}" aria-label="Consequence">${[1, 2, 3, 4, 5].map((x) => `<option${x === c ? " selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="drow"><div class="k">Note</div>
      <textarea data-risk-note="${esc(r.id)}" rows="4" placeholder="Update…">${esc(ov("risks", r.id, "note", ""))}</textarea>${editedNote("risks", r.id)}</div>`);
}

/* ---------- routing & events ---------- */
const VIEWS = { program: viewProgram, clauses: viewClauses, proposals: viewProposals, engagement: viewEngagement, pilots: viewPilots, risks: viewRisks };
const route = () => (location.hash.replace("#", "") in VIEWS ? location.hash.replace("#", "") : "program");

function render() {
  const r = route();
  $("#view").innerHTML = VIEWS[r]();
  renderTop();
  for (const a of document.querySelectorAll("#nav a")) {
    if (a.getAttribute("href") === "#" + r) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  for (const t of document.querySelectorAll("#view textarea")) autosize(t);
}
const autosize = (t) => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, 180) + "px"; };

addEventListener("hashchange", () => { closeDrawer(); scrollTo(0, 0); render(); });

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-proposal],[data-gate],[data-risk],[data-close],#f-clear,#f-pclear,#themebtn");
  if (!b) return;
  if (b.hasAttribute("data-close")) return closeDrawer();
  if (b.id === "themebtn") {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : cur === "light" ? null : matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    if (next) document.documentElement.setAttribute("data-theme", next);
    else document.documentElement.removeAttribute("data-theme");
    return;
  }
  if (b.id === "f-clear") { filters.q = filters.part = filters.disp = filters.owner = filters.tag = ""; return render(); }
  if (b.id === "f-pclear") { filters.pstatus = filters.punit = ""; return render(); }
  if (b.hasAttribute("data-proposal")) return drawerProposal(b.getAttribute("data-proposal"));
  if (b.hasAttribute("data-gate")) return drawerGate(b.getAttribute("data-gate"));
  if (b.hasAttribute("data-risk")) return drawerRisk(b.getAttribute("data-risk"));
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "initials") { initials = t.value.trim(); try { localStorage.setItem("llr-initials", initials); } catch (err) {} return; }
  if (t.id === "f-part") { filters.part = t.value; return render(); }
  if (t.id === "f-disp") { filters.disp = t.value; return render(); }
  if (t.id === "f-owner") { filters.owner = t.value; return render(); }
  if (t.id === "f-tag") { filters.tag = t.value; return render(); }
  if (t.id === "f-ps") { filters.pstatus = t.value; return render(); }
  if (t.id === "f-pu") { filters.punit = t.value; return render(); }

  if (t.dataset.clause) { stamp("clauses", t.dataset.clause, { [t.dataset.field]: t.value }); return render(); }
  if (t.dataset.proposalField) { stamp("proposals", t.dataset.proposalField, { status: t.value }); return render(); }
  if (t.dataset.proposalNote !== undefined && t.dataset.proposalNote) { stamp("proposals", t.dataset.proposalNote, { note: t.value }); return; }
  if (t.dataset.gateStatus) { stamp("gates", t.dataset.gateStatus, { status: t.value }); render(); return drawerGate(t.dataset.gateStatus); }
  if (t.dataset.gateNote) { stamp("gates", t.dataset.gateNote, { note: t.value }); return; }
  if (t.dataset.pilot) { stamp("pilots", t.dataset.pilot, { status: t.value }); return render(); }
  if (t.dataset.eng) { stamp("engagement", t.dataset.eng, { status: t.value }); return render(); }
  if (t.dataset.riskstatus) { stamp("risks", t.dataset.riskstatus, { status: t.value }); return render(); }
  if (t.dataset.riskL) { stamp("risks", t.dataset.riskL, { likelihood: Number(t.value) }); render(); return drawerRisk(t.dataset.riskL); }
  if (t.dataset.riskC) { stamp("risks", t.dataset.riskC, { consequence: Number(t.value) }); render(); return drawerRisk(t.dataset.riskC); }
  if (t.dataset.riskNote) { stamp("risks", t.dataset.riskNote, { note: t.value }); return; }
});

let qtimer;
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.tagName === "TEXTAREA") autosize(t);
  if (t.id === "f-q") {
    filters.q = t.value;
    clearTimeout(qtimer);
    qtimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = $("#f-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 220);
  }
});

$("#initials").value = initials;
render();
</script>
