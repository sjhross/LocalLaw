ble outside the land or Motor Vehicle\nfor more than;\n(i) 10 consecutive minutes; or\n(ii) two (2) or more separate periods, each cumulatively\namounting to 10 minutes or more within a period of\none (1) hour.\n(4) Sub-clause (3) does not apply where the noise is from a\ndifferent audible alarm or a location that is different from the\nearlier occasions, or where the noise occurred after the\naudible alarm had been manually re-set and (in the case of\nan audible alarm on land) there is displayed on the land, in a\nprominent location near the front door, details of the name\nand telephone number of a person (not at the land) who\ncan and will deactivate the audible alarm to prevent a\nbreach of this Local Law.\n(5) A person must not deliver to or pick up goods from\nland used for commercial purposes if noise from that activity\nis audible in a habitable room of any residential dwelling\nbetween:\n(a) 10pm and 7am, Monday to Saturday; or\n(b) 10pm and 9am, Sunday or a public holiday.\n(6) The owner, occupier and person in charge of land\nused for a commercial purpose must not cause or allow\namplified speech or music to be audible outside the\nland unless each speaker is:\n(a) within the building on the land;\n(b) not less than three (3) metres from any entrance to\nthe building;\n\n(c) directed away from any wall (that is less than 15 metres\nfrom the device), external window or entrance to the\nbuilding; and\n(d) operating at a level that does not exceed 65 dB\n(LA max) two (2) metres from the façade of a building\nadjoining a Road.\n(7) Without limiting the generality of sub-clause (1), any noise:\n(a) emitted from land, other than residential land, from any\nitem at any time that is specified as a prohibited time in\nrespect of that item in Table 2; and\n(b) that noise can be heard in a habitable room in any\nresidential dwelling,\nis deemed to be detrimental to the amenity of the area\nunless it is emitted in the case of an emergency.\n\nTable 2 — referred to in sub-clause (7) above.\nGroup Items Prohibited times\n1. A motor vehicle (except a vehicle moving in or out of premises),\nlawn mower or other grass-cutting device and any equipment or\nappliance not falling within Group 2 having an internal combustion\nengine\nMonday to Friday: before 7am and\nafter 8pm\nWeekends and public holidays:\nbefore 8am and after 8pm\n2. An electric power tool, chain or circular saw, gas or air\ncompressor, pneumatic power tool, hammer and any other\nimpacting tool, grinding equipment\nMonday to Friday: before 7am and\nafter 8pm\nWeekends and public holidays:\nbefore 9am and after 8pm\n3. A musical instrument and any electrical amplified sound\nreproducing equipment including a stereogram, radio,\ntelevision and public address system\nMonday to Thursday: before 7am\nand after 10pm\nFriday: before 7am and after 11pm\nSaturday and public holidays:\nbefore 9am and after 11pm\nSunday: before 9am and after 10pm\n4. Any electric equipment or appliance not falling within Group 2\nor Group 3, including electric gardening equipment\nMonday to Friday: before 7am and\nafter 8pm\nWeekends and public holidays:\nbefore 9am and after 8pm","proposals":["P06","P07","P22"],"disposition":"Amend"},{"id":"145","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Advertisements","tags":["P","N","I"],"owner":"City Amenity","text":"Advertisements\n(1) A person must not, without a Permit, write, paint, stencil,\nplace or affix any letter, figure, Graffiti, device, poster, sign or\nadvertisement upon any:\n(a) Road;\n(b) Council Land;\n(c) Building, structure, fixture or any other thing on a Road\nor Council Land; or\n(d) Motor Vehicle, Vehicle, instrument, machinery, device,\ntool or other item on a Road or Council Land.\n(2) Any person who allows, authorises or engages another person\nto do anything in sub-clause (1) is guilty of an offence.\n(3) A person must not, without a Permit, erect and display any\nreal estate sign on or above a verandah, over a footpath or\non the façade of a Building on the boundary of a footpath.\n(4) An Authorised Officer may remove, or direct to be removed\nand disposed of, any letter, figure, Graffiti, device, poster,\nsign or advertisement in contravention of sub-clause\n(1) or (3).","proposals":["P16"],"disposition":"Amend"},{"id":"146","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Mobile Billboards","tags":["P","I"],"owner":"City Amenity","text":"Mobile Billboards\n(1) A person must not, without a Permit, place a mobile\nbillboard on:\n(a) a Road, Road-related area or Council Land; or\n(b) any other location likely to interfere with the vision\nof a pedestrian or driver.\n(2) For the purposes of sub-clause (1) a mobile billboard\nis an advertising sign that is specifically constructed to\nbe part of a Motor Vehicle or pulled along on a trailer\nby a Motor Vehicle.\n(3) If a mobile billboard is placed in contravention of\nsub-clause (1) each of the following persons are guilty\nof an offence:\n(a) the person who is responsible for the placement, siting\nor distribution of the advertising sign including, without\nlimitation, the person who engages another whether as\nan employee or agent to place, site or distribute the\nadvertising sign; and\n(b) the person who is the promoter of the premises,\nproperty, business, event or activity to which the\nadvertising sign relates.","proposals":[],"disposition":"Under review"},{"id":"147","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Incinerators and Fires","tags":["P","I"],"owner":"City Amenity","text":"Incinerators and Fires\n(1) A person must not set alight or allow any Fire to remain\nalight on land or in the open air without a Permit.\n(2) Sub-clause (1) does not apply if:\n(a) that person is a person authorised by a Public Body\nengaged in fire protection measures for or on behalf\nof that Public Body; or\n(b) the Fire is in a Barbecue.\n(3) An owner, occupier or person in charge of land must\nnot allow a Barbecue to discharge ash or smoke that is\ndangerous to health or offensive to any other person.","proposals":[],"disposition":"Not started"},{"id":"148","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Chimneys","tags":["N","I"],"owner":"City Amenity","text":"Chimneys\nThe owner and occupier of any land must not cause or\nknowingly allow or suffer smoke to be emitted from a Chimney\nthat is a nuisance.","proposals":[],"disposition":"Retain"},{"id":"149","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Directive Powers","tags":["N","I"],"owner":"City Amenity","text":"Directive Powers\n(1) An Authorised Officer may direct a person to extinguish a\nFire where the Authorised Officer believes on reasonable\ngrounds that the Fire is causing a nuisance to another\nperson or is contrary to this Local Law.\n(2) Any person who does not comply with the direction of an\nAuthorised Officer in sub-clause (1) or the direction of a\nmember of Victoria Police or member of a fire brigade in\nrelation to a Fire is guilty of an offence.","proposals":["P23"],"disposition":"Rewrite"},{"id":"150","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Unsightly Premises","tags":["N","I"],"owner":"City Amenity","text":"Unsightly Premises\n(1) For the purpose of this section the word ‘land’ includes any\nnature strip.\n(2) The owner and occupier of land must not cause or\nallow the land to be kept in a condition that is unsightly\nor detrimental to the amenity of the area.\n(3) The owner and occupier of land must ensure that:\n(a) all necessary steps are taken to prevent Fire on\nthat land and minimise the possibility of the spread\nof Fire from that land; and\n(b) the land is kept free of undergrowth, scrub bracken,\nferns, weeds, stubble or grass (whether alive or dead\nexceeding 30 cm in height and whether standing or not\nstanding) and any other material or substance likely to\nassist in the spread of Fire.\n(4) Without affecting the operation of clause 11, where Council\nis of the opinion that any land contains:\n(a) unconstrained rubbish;\n(b) an excavation that is not part of current works;\n(c) waste material; or\n(d) any material or substance on premises that constitutes\nor is likely to constitute a Fire hazard,\nthe Council may serve a Notice to Comply on the\nowner and occupier of the land for the cleaning up,\nscreening, removal or disposal of any material or substance\non that land.","proposals":[],"disposition":"Under review"},{"id":"151","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Fencing of Vacant Land","tags":["N","I"],"owner":"City Amenity","text":"Fencing of Vacant Land\n(1) If Council is of the opinion that vacant land is unsightly\nor waste is being dumped on the land or the land is\ndangerous, it may, by notice in writing, direct the owner\nor occupier of any vacant land to erect, repair, replace\nor modify fencing enclosing the vacant land.\n(2) A notice under this clause may specify:\n(a)  the material with which any fencing to be erected must\nbe constructed;\n(b) the material to be applied to the fencing to restrict\nthe view into the vacant land; and\n(c)  the height and other dimensions of the fencing\nto be erected.\n(3) The owner or occupier of any land must comply with a\nnotice directed to that person under clause 11 and must\nperform any work specified in the notice within the time\nspecified in the notice.","proposals":[],"disposition":"Under review"},{"id":"152","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Securing and Fencing Dilapidated Land","tags":["N","I"],"owner":"City Amenity","text":"Securing and Fencing Dilapidated Land\n(1) Council may, by notice in writing, direct the owner or\noccupier of land on which any dilapidated dwelling\nexists to:\n(a) secure or better secure the dwelling; or\n(b) fence the land.\n(2) The owner or occupier of any land must comply with a\nnotice directed to that person under clause 11 and must\nperform any work specified in the notice within the time\nspecified in the notice.","proposals":[],"disposition":"Under review"},{"id":"153","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Vermin and Noxious Weeds","tags":["N","I"],"owner":"City Amenity","text":"Vermin and Noxious Weeds\nThe owner and occupier of land must ensure that the land and\nnature strip adjacent to that land do not contain blackberries or\na weed that is a noxious weed within the meaning defined in the\nCatchment and Land Protection Act 1994.","proposals":[],"disposition":"Retain"},{"id":"154","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Dangerous Land","tags":["N","I"],"owner":"City Amenity","text":"Dangerous Land\nThe owner and occupier of land must not allow the land to be\nkept in a manner that is dangerous or likely to cause danger to\nlife or property.","proposals":[],"disposition":"Not started"},{"id":"155","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Motor Vehicles and Machinery","tags":["N","I"],"owner":"City Amenity","text":"Motor Vehicles and Machinery\n(1) Unless in accordance with the Planning Scheme\nor a Permit, a person must not use land for:\n(a) the storage of old or second-hand Motor Vehicles,\nmotor boats, machinery, goods or materials; or\n(b) dismantling or breaking up of Motor Vehicles, motor\nboats, machinery, goods or materials.\n(2) Unless in accordance with a Permit or the Planning\nScheme, a person must not use land for the repairing\nor servicing of any Motor Vehicle (except one that is\nregistered under the Road Safety Act 1986 to that address)\nor motor boat.\n(3) A person must not in the process of repairing or\nservicing a Motor Vehicle or motor boat perform any\nact in a manner that disturbs the peace and quiet of\nany person in an adjoining dwelling.","proposals":[],"disposition":"Under review"},{"id":"156","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Overhanging and Encroaching Trees","tags":["N","I"],"owner":"City Amenity","text":"Overhanging and Encroaching Trees\n(1) The owner and occupier of land must not allow any tree,\nhedge, plant or vegetation of any kind growing on that land\nto:\n(a) overhang any Road at a height less than two and\na half (2.5) metres;\n(b) grow in such a manner so that it obstructs the view\nof a Motor Vehicle, sign or signal on a Road by any\nperson using that Road; or\n(c) obstruct a footpath.","proposals":[],"disposition":"Under review"},{"id":"157","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Dilapidated Buildings","tags":["N","I"],"owner":"City Amenity","text":"Dilapidated Buildings\n(1) The owner and occupier of land on which there is a Building\nmust not allow or permit the Building to be dilapidated.\n(2) Where a Building is dilapidated, Council may serve a Notice\nto Comply on the owner and occupier of the land specifying\nthe works required to correct the dilapidated state, or that\nthe Building be removed or demolished.\nPart 1 3  –\nBuilding Activity","proposals":[],"disposition":"Under review"},{"id":"158","part":13,"partTitle":"Building Activity","title":"Building Definitions","tags":["D"],"owner":"City Works & Assets","text":"Building Definitions\nIn this Part:\n“Building Activity” includes:\n(a) any act or thing done or to be done on, over or\nacross any land, Road or Council Land for the\npurpose of or in the course of constructing,\nrepairing, demolishing, pulling down or removing\nany building;\n(b) the erection or removal of any kind of scaffolding\nand the excavation and carrying away of earth, soil,\nclay, rock or material of any kind on, over or across\nany land, Road or Council Land;\n(c)  the moving about of any building equipment or\nmaterial and any rubble, waste or second-hand\nbuilding materials on, over or across any land, Road\nor Council Land; or\n(d)  any work or action incidental to the matters referred\nto in paragraph (a), (b) and (c) conducted on, over or\nacross any land, Road or Council Land.\n“Building Activity Hours” means the period of time\nbetween 7 am and 6 pm on any week day or the period\nof time between 9 am and 6 pm on a Saturday.\n“Repair” includes the re-construction or renewal of any part\nof an existing building for the purpose of its maintenance.","proposals":[],"disposition":"Retain"},{"id":"159","part":13,"partTitle":"Building Activity","title":"Building Activity Hours","tags":["I"],"owner":"City Works & Assets","text":"Building Activity Hours\n(1) A person must not, without a Permit, carry out any Building\nActivity on land or use any machinery or device ancillary to\nBuilding Activity on or over or across a Road or Council\nLand:\n(a) on a public holiday;\n(b) a Sunday; or\n(c) on any other day outside of Building Activity Hours.\n(2) Sub-clause (1) does not apply to a natural person who:\n(a) is an owner of the land on which Building Activity is\nbeing carried out; and\n(b)  the Building Activity does not require a building permit;\nand\n(c) is not a registered builder.","proposals":["P10"],"disposition":"Amend"},{"id":"160","part":13,"partTitle":"Building Activity","title":"Dust Control","tags":["N","I"],"owner":"City Works & Assets","text":"Dust Control\n(1) A person carrying out any Building Activity, landscaping\nor gardening works on land must ensure that dust or\nspoil is not deposited on any Road.\n(2) A person carrying out any Building Activity, landscaping\nor gardening works on land must ensure that dust, spoil\nor other material does not escape from the land to be\na nuisance.\n(3) A person carrying out any Building Activity, landscaping\nor gardening works on land must ensure that any rubbish,\nwaste, water, slime or other debris does not escape from the\nland.\n(4) A person instructed by an Authorised Officer to rectify, clean\nup or remedy the dust or spoil referred to in sub-clauses (1)\nto (3) must immediately rectify the situation to the\nsatisfaction of the Authorised Officer.","proposals":["P10"],"disposition":"Under review"},{"id":"161","part":13,"partTitle":"Building Activity","title":"Spoil from Building Sites","tags":["N","I"],"owner":"City Works & Assets","text":"Spoil from Building Sites\n(1) An owner or occupier of land or a building contractor\nresponsible for Building Activity on that land must not allow\na Motor Vehicle to leave the land on which building works\nare being carried out and enter an adjoining Road unless\nthe wheels and tyres of that Motor Vehicle are clean and\nfree from soil, earth, clay or other debris.\n(2) An owner or occupier and building contractor responsible\nfor Building Activity on that land who allows by consent,\nneglect, omission or direction the matters in sub-clause (1)\nto occur is guilty of an offence.","proposals":["P10"],"disposition":"Under review"},{"id":"162","part":13,"partTitle":"Building Activity","title":"Building Material","tags":["N","I"],"owner":"City Works & Assets","text":"Building Material\nA person must not, without a Permit, place any building\nmaterial, rubble, plant, equipment or portable toilet on any Road\nor Council Land.\nPart 1 4  –\nTree\nProtection","proposals":["P10"],"disposition":"Under review"},{"id":"163","part":14,"partTitle":"Tree Protection","title":"Tree Protection","tags":["P","I"],"owner":"Parks & Environment","text":"Tree Protection\n(1) In this Part:\n“Damage” means to lop, prune or undertake Works near a tree\nsuch that the tree is no longer viable in terms of health, structure\nor stability.\n“Prune” means to remove any branches of a tree that are\ngreater than 50 mm in diameter at the point of contact with the\nlarger branches or the trunk.\n“Significant Tree” means a tree or palm:\n(a) with a trunk circumference of 140 cm or greater\nmeasured at 1.4 m above its base;\n(b) with a total circumference of all its trunks of 140 cm\nor greater measured at 1.4 m above its base;\n(c) with a trunk circumference of 180 cm or greater\nmeasured at its base; or\n(d) with a total circumference of all its trunks of 180 cm\nor greater measured at its base.\nNote: See Figure 1 and 2.\n“Tree Protection Zone” means the area surrounding a tree’s\ntrunk that contains the roots that are essential to the tree’s\ncontinued health, vigour and stability, being a circular area\nbelow the tree extending at equal distances from the tree base\nin all directions, the radius of which is 12 times the trunk\ndiameter measured at 1.4 m above its base.\nNote: See Figure 3.\n“Works” includes building, trenching, digging, compacting,\nexcavating, filling or storing materials and equipment whether by\nmechanical or manual methods.\n(2) Unless in accordance with a Permit a person must not:\n(a) remove, kill or Damage a Significant Tree; (these actions\nresult in the killing or the necessary removal of the tree\nand therefore are the most serious offending)\n(b) lop, prune or trim a Significant Tree; (the lopping or\npruning of a tree that does not result in the loss of the\ntree)\n(c) carry out any Works within the Tree Protection Zone\nof a Significant Tree; or (the carrying out of Works may\nor may not result in the death of the tree)\n(d) direct, authorise or allow a person to do any of (a), (b) or\n(c) above.\nNote: See Figure 3.\n(3) Sub-clause (2) does not apply to:\n(a) a person whose actions are authorised under a Planning\nPermit under the Planning Scheme;\n(b) a person whose actions are required by any other\nlegislation or by any other statutory authority; or\n(c) a person acting in accordance with an instruction\nor direction from an Authorised Officer.\n(4) If a tree is interfered with in any of the circumstances\nspecified in breach of sub-clause (2) (having regard to\nsub-clause (3), the owner of land on which the tree is\nlocated is guilty of an offence, whether or not the person\nwho actually contravened sub-clause (2) is identified or\nprosecuted, unless the owner can prove that the\ninterference was undertaken by another person without the\nknowledge of the owner.\n(5) A person must not, without a Permit, remove, kill, Damage,\nlop, Prune or trim a Significant Tree that is overhanging\nproperty owned or occupied by that person.\n(6) In deciding whether to grant a Permit under this clause\nCouncil must take into consideration the matters specified\nin the Procedure and Protocol Manual.\nFigure 1: Diagram illustrating how to measure a circumference of the base of different shaped trees.\nFigure 2: Diagram illustrating where and how to measure the circumference at 1.4m above ground level.\nFigure 3: Diagram illustrating how to determine the Tree Protection Zone.\nSingle Trunk\nSingle Trunk Multi-trunked\nShort Trunk Flared Trunk Multi-trunked\nRepresents the Tree Protection Zone.\nWorks are not allowed without a Permit\nin the Tree Protection Zone.\n\nAnimals\nand Birds\nTable 3\nHouses Units, townhouses, flats\nand apartments\nCats\nCats under 3 months\nDogs\nDogs under 3 months\nDomestic birds (budgie/canary or similar) 5 2\nDomestic mice 6 3\nRabbits or guinea pigs 10 2\nCold water and tropical fish unlimited unlimited","proposals":["P03"],"disposition":"Amend"},{"id":"164","part":15,"partTitle":"Animals and Birds","title":"Application of Part","tags":["D"],"owner":"Local Laws & Compliance","text":"Application of Part\nThis Part does not apply to land:\n(a) on which a pet shop is located; or\n(b) on which an animal hospital or veterinary\npractice is located,\nif the use of the land for this purpose is permitted\nunder the Planning Scheme applicable to that land.","proposals":[],"disposition":"Retain"},{"id":"165","part":15,"partTitle":"Animals and Birds","title":"Conditions Under Which Animals May be Kept","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Conditions Under Which Animals May be Kept\n(1) The owner and occupier of land must not, without a Permit,\nkeep or allow to be kept on that land at any time no more in\nnumber for each type of Animal than is set out in Table 3.\n(2) Sub-clause (1) does not apply where a Planning Permit has\nbeen obtained for the use of land for the purposes\nof Animal boarding or breeding.\n(3) A Permit may be granted for the keeping of any Animals not\nlisted in Table 3 of sub-clause (1):\n(a) if the Animals are to be part of a display for education,\ncultural or historical purposes; or\n(b) if the Animal is not prohibited and in accordance\nwith the requirements and criteria in the Keeping of\nAnimals Policy.","proposals":["P09"],"disposition":"Amend"},{"id":"166","part":15,"partTitle":"Animals and Birds","title":"Keeping of Animals Policy","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Keeping of Animals Policy\n(1) The Keeping of Animals Policy is incorporated into this\nLocal Law.\n(2) A person who contravenes or fails to comply with a\nrequirement for the keeping of Animals in the Keeping of\nAnimals Policy imposed on that person is guilty of an\noffence.\n(3) The owner and occupier of land must not keep or allow to\nbe kept on that land at any time an Animal specified in the\nKeeping of Animals Policy.\n(4) A person who fails to comply with a condition of a Permit is\nguilty of an offence.","proposals":["P09"],"disposition":"Amend"},{"id":"167","part":15,"partTitle":"Animals and Birds","title":"Animal Noises","tags":["N","I"],"owner":"Local Laws & Compliance","text":"Animal Noises\n(1) The owner and occupier of land where any Animal is kept\nmust ensure that the keeping of the Animal does not create\na nuisance.\n(2) An Animal creates a nuisance for the purpose of\nsub-clause (1) if it creates a noise by any means and\nunreasonably interferes with the peace, comfort or\nconvenience of any person.","proposals":[],"disposition":"Under review"},{"id":"168","part":15,"partTitle":"Animals and Birds","title":"Animal Excrement","tags":["I"],"owner":"Local Laws & Compliance","text":"Animal Excrement\n(1) A person in charge of any Animal in a Public Place must\nimmediately remove that Animal’s excrement and dispose of\nit as litter in a lawful manner.\n(2) A person in charge of any Animal in a Public Place must\ncarry a Litter Device suitable to clean up and remove any\nexcrement left by their Animal and must produce\nthat Litter Device upon request of an Authorised Officer.\n(3) A person who fails to produce a Litter Device when\nrequested to do so is guilty of an offence.","proposals":[],"disposition":"Under review"},{"id":"169","part":15,"partTitle":"Animals and Birds","title":"Wasp Nest(s) and Bee Swarm(s) to be Removed","tags":["N","I"],"owner":"Local Laws & Compliance","text":"Wasp Nest(s) and Bee Swarm(s) to be Removed\nThe owner and occupier of land must, upon becoming aware of\nthe existence of a wasp nest or bee swarm on the land or at the\ndirection of an Authorised Officer:\n(a) take steps to cause the wasp nest or bee swarm\nto be removed; and\n(b) arrange for the removal to be undertaken by an\nappropriate contractor.","proposals":[],"disposition":"Under review"},{"id":"170","part":15,"partTitle":"Animals and Birds","title":"Pest Animals","tags":["N","I"],"owner":"Local Laws & Compliance","text":"Pest Animals\n(1) A person must not keep, store or allow to be kept or stored\non land any prepared food for consumption by an Animal\nunless the food is stored in a manner secure from all vermin,\nferal and stray Animals.\n(2) A person must not, without a Permit, feed or encourage the\npresence of feral Animals, stray Animals or foxes nor allow\nany such Animals access to prepared food stored or issued\nto Animals.","proposals":[],"disposition":"Under review"},{"id":"171","part":15,"partTitle":"Animals and Birds","title":"Fencing of Dogs","tags":["N","I"],"owner":"Local Laws & Compliance","text":"Fencing of Dogs\nThe owner and occupier of land on which a dog is kept must\nensure that all boundary fencing is adequate to keep the dog\nwholly within the boundaries of the land.","proposals":[],"disposition":"Under review"},{"id":"172","part":15,"partTitle":"Animals and Birds","title":"Feeding of Animals and Birds","tags":["I"],"owner":"Local Laws & Compliance","text":"Feeding of Animals and Birds\n(1) A person must not feed or leave food for an Animal or bird\nin a Public Place.\n(2)  Nothing in sub-clause (1) applies to any person feeding\nor leaving food for an Animal that is registered under the\nDomestic Animals Act 1994 and under the effective\ncontrol of that person.\nPart 1 6  –\nSanitation","proposals":[],"disposition":"Retain"},{"id":"173","part":16,"partTitle":"Sanitation","title":"Supply and Use of Waste Receptacles","tags":["I"],"owner":"Waste & Recycling","text":"Supply and Use of Waste Receptacles\n(1) The owner and occupier of land must:\n(a) ensure that an appropriate receptacle for the collection\nof waste is available on the land for the collection and\ncontainment of waste;\n(b) deposit or cause to be deposited in an appropriate\nreceptacle only waste generated from the land;\n(c) maintain all waste receptacles and any area of the land\nin which waste receptacles are located in a\nclean and sanitary condition; and\n(d) not deposit commercial or residential waste in\nCouncil street bins.\n(2) The owner or owners corporation of commercial\nand residential land on which there is more than one\npremises or dwelling must:\n(a) construct on the land an area for storing waste\nreceptacles;\n(b) ensure that the area constructed is screened\nfrom view and maintained in a clean and sanitary\ncondition; and\n(c) ensure that the area is used to store waste receptacles.\n(3) A person must not remove an Approved Receptacle\nfrom the land to which it has been assigned.\n(4) A person must not damage or destroy an Approved\nReceptacle.","proposals":["P17"],"disposition":"Amend"},{"id":"174","part":16,"partTitle":"Sanitation","title":"Domestic and Recycling Waste Collection","tags":["I"],"owner":"Waste & Recycling","text":"Domestic and Recycling Waste Collection\n(1) The owner and occupier of land to which Council\nprovides a domestic waste collection service or a domestic\nrecycling collection service must only use\nan Approved Receptacle.\n(2) The owner and occupier of land to which Council\nprovides a domestic waste collection service or a domestic\nrecycling collection service must:\n(a) ensure the Approved Receptacle and contents does\nnot exceed 60 kg;\n(aa) only deposit general waste in the Approved Receptacle\nfor general waste and only deposit recyclable materials\nin the Approved Receptacle for recycling materials;\n(b) not place in an Approved Receptacle commercial or\nindustrial waste or use an Approved Receptacle for any\nother purpose other than for the collection and\ncontainment of domestic waste or domestic recycling;\n(c) place an Approved Receptacle for collection at the\nfront of the land adjacent to the kerb;\n(d) ensure that the lid is secure and that waste cannot spill\nonto the ground;\n(e) ensure that if waste has spilled onto the ground that the\nwaste is collected and deposited back into the\nApproved Receptacle;\n(f) ensure that the Approved Receptacle is returned\nto the land on the day of collection; and\n(g) comply with the additional requirements specified\nin the Procedures and Protocol Manual.\n(3)  If Council has given notice of a collection of Hard Waste, the\nowner or occupier of land may place or allow to be placed\nat the front of the land in a neat, tidy, safe and orderly\nmanner Hard Waste for collection by Council.\n(4)  Hard Waste placed out for collection becomes the property\nof Council or such person as Council may specify.\n(5)  A person must not deposit or allow to be deposited\nany Hard Waste contrary to the notice given pursuant\nto sub-clause (3).\n(6)  A person must not interfere with or remove any Hard Waste\nunless:\n(a) it is a person who has a Permit to do so;\n(b) it is Council;\n(c) the person is authorised by Council; or\n(d) it is the person who deposited the Hard Waste.","proposals":["P17"],"disposition":"Amend"},{"id":"175","part":16,"partTitle":"Sanitation","title":"Trade Waste Bins and Hoppers","tags":["P","I"],"owner":"Waste & Recycling","text":"Trade Waste Bins and Hoppers\n(1)  The owner and occupier of land on which a waste\nreceptacle used for the collection and storage of\ncommercial or industrial waste must:\n(a) construct on the land an area to store the waste\nreceptacle that is supplied with reticulated water so that\nthe waste receptacle can be adequately cleaned;\n(b) ensure that the area constructed is screened from view,\nmaintained in a clean and sanitary condition and fenced\nin such a manner to deny access to the public;\n(c) ensure the waste receptacle is available for collection on\nthe day of collection and returned to the land after\ncollection;\n(d) ensure when the waste receptacle is on a Road or\nCouncil Land for collection:\n(i) the lid is closed and waste is not able to spill\nonto the ground;\n(ii) the waste receptacle is not in an unclean and\noffensive condition; and\n(iii) any waste that has spilled onto the ground that\nthe waste is collected and deposited back into\nthe waste receptacle; and\n(e) comply with the additional requirements specified\nin the Procedures and Protocol Manual.\n(2) A person collecting and removing any commercial or\nindustrial waste must not:\n(a) collect and remove the waste other than between\nthe hours of 7am and 10pm on Monday to Saturday\n(inclusive) and between the hours of 9am and 10pm\n(inclusive) on Sunday and a public holiday; and\n(b) use a vehicle from which liquid waste water is able\nto leak onto the Road.\n(3) For the purpose of sub-clause (2) above, the person\ncollecting and removing commercial or industrial waste in\ncontravention of sub-clause (2) includes the driver of the\nvehicle and the employer of the driver of the vehicle.","proposals":[],"disposition":"Under review"},{"id":"176","part":16,"partTitle":"Sanitation","title":"Council Waste Acceptance Facilities","tags":["I"],"owner":"Waste & Recycling","text":"Council Waste Acceptance Facilities\n(1) A person must not, without a Permit, deposit any waste in or\nat, or enter any Council Waste Depot unless:\n(a) the fee, if any, has been paid;\n(b) the waste is deposited where directed by Council notice,\nan Authorised Officer or a member of Council staff\nacting in the course of that member’s duties;\n(c) the waste is waste approved by Council for deposit; and\n(d) during the hours the Council Waste Depot is open\nto the public.\n(2) A person must not, without a Permit, remove from a Council\nWaste Depot any waste or material of any kind that has\nbeen deposited or left there.\n(3) A person must, while in any Council Waste Depot, obey:\n(a) a lawful order or direction of any Authorised Officer\nor member of Council staff acting in the course of\nthat member’s duties; and\n(b) any sign authorised by Council.","proposals":[],"disposition":"Retain"},{"id":"177","part":16,"partTitle":"Sanitation","title":"Directive Powers","tags":["N","I"],"owner":"Waste & Recycling","text":"Directive Powers\n(1) An Authorised Officer may direct and require a person who\ndeposits waste or places a waste receptacle or allows it to\nremain in place contrary to:\n(a) this Local Law; or\n(b) a Permit,\nto immediately remove the waste or waste receptacle\n(as the case may be).\n\nPart 1 7  –\nPermits","proposals":["P23"],"disposition":"Rewrite"},{"id":"178","part":17,"partTitle":"Permits","title":"Application for a Permit","tags":["P","D"],"owner":"Governance & Legal","text":"Application for a Permit\n(1) An application for a Permit must be in the form prescribed\nby Council from time to time and must be accompanied by\nthe appropriate fee, as determined by Council from time to\ntime.\n(2) Council may prescribe the form for an application for a\nPermit and specify the requirements for an application\nfor a Permit and the matters to be considered or to be\napplied in the grant of a Permit in the Procedure and\nProtocol Manual.\n(3) Council may require a person making an application for a\nPermit to give public notice that will entitle any person to\nmake a submission and to be heard.\n(4) Council may require additional information to enable an\napplication for a Permit to be properly considered and for\nthe purposes of administering and enforcing the provisions\nof this Local Law.\n(5) Council may grant a Permit with or without conditions or\nrefuse to grant a Permit.","proposals":[],"disposition":"Under review"},{"id":"179","part":17,"partTitle":"Permits","title":"Consideration of Applications","tags":["P","D"],"owner":"Governance & Legal","text":"Consideration of Applications\n(1) In considering an application for a Permit, Council must\nconsider as appropriate:\n(a) any policy or guideline relating to the subject matter\nof the application for the Permit;\n(b) any written objection or written submission received\nin respect of the application;\n(c) any written comment made in respect of the application\nby any Public Body or community organisation;\n(d) any matters specified in the Procedure and\nProtocol Manual; and\n(e) any other relevant matter.\n(2) Where the applicant is not the owner of the land that is the\nsubject of the  application, the consent of the owner of the\nland to the application must be provided to Council with the\napplication.","proposals":[],"disposition":"Under review"},{"id":"180","part":17,"partTitle":"Permits","title":"Permits May be Conditional","tags":["P","D"],"owner":"Governance & Legal","text":"Permits May be Conditional\n(1) A Permit may be issued with or without conditions including,\nbut not limited to, conditions relating to:\n(a) the payment of a fee, charge, fare or rent;\n(b) a standard to be applied;\n(c) a time limit to be applied either specifying the duration,\ncommencement or completion time or date;\n(d) the issue of the permit subject to the happening of an\nevent;\n(e) the rectification, remedying or restoration of a situation\nor circumstance;\n(f) a condition that a specified thing is to be done or not to\nbe done to the satisfaction of Council or an Authorised\nOfficer;\n(g) the amendment or cancellation of a specified Permit\nprior the Permit coming into effect;\n(h) a Permit for a use for a specified time:\n(i) that any use or development carried out on the land\nunder the Permit is to cease or be removed (as the\ncase may be) at the end of the specified time; and\n(ii) that the land is to be restored to a specified\nstate at the end of the specified time;\n(iii) the consent of the owner of land where the applicant\nis not the owner of that land;\n(i) the granting of some other Permit that may be required\nby Council whether under this Local\nLaw or otherwise; and\n(j) any other matter as considered appropriate.\n(2) Council may by resolution determine a fee, charge, fare\nor rent in relation to any property, undertaking, goods,\nservice or other act, matter or thing for the application,\nconsideration, grant, renewal, suspension or cancellation of\na Permit.\n(3) Council may prescribe, regulate or determine the manner in\nwhich an application may be made for a Permit and the\nconditions on which a Permit may be granted, any service\nperformed or supplied or the supply of any goods or\ninformation.","proposals":[],"disposition":"Under review"},{"id":"181","part":17,"partTitle":"Permits","title":"Power to Amend Conditions","tags":["P","D"],"owner":"Governance & Legal","text":"Power to Amend Conditions\n(1) Council may, during the currency of a Permit, amend\nthe conditions of a Permit if it considers it appropriate\nto do so.\n(2) In considering whether it is appropriate to amend the\nconditions on the Permit, Council must have regard to:\n(a) the purposes for which the conditions were imposed;\n(b) whether those purposes are adequately achieved by the\ncurrent conditions;\n(c) the impact of the proposed amendment on the\nPermit holder and any relevant third parties; and\n(d) any other relevant matter.\nIf Council proposes to amend the conditions on a Permit,\nit must:\n(a) provide the permit holder an opportunity to make\nsubmissions on whether the amendment should\nbe made; and\n(b) take into account those submissions in deciding\nwhether to amend the permit.","proposals":[],"disposition":"Not started"},{"id":"182","part":17,"partTitle":"Permits","title":"Security Bonds","tags":["P","D"],"owner":"Governance & Legal","text":"Security Bonds\n(1) In deciding to grant a Permit, Council may require the\napplicant to lodge with Council a security bond, bank\nguarantee or similar surety in an amount and in a manner as\nCouncil considers reasonable in the circumstances.\n(2) Council may use a security bond, bank guarantee or other\nsurety to remedy a breach of that Permit, Local Law or\nrepair any damage caused by any works under a Permit.\n(3) Upon the completion of any required remediation works,\nCouncil must release any remaining security bond, bank\nguarantee or other surety.","proposals":["P11"],"disposition":"Not started"},{"id":"183","part":17,"partTitle":"Permits","title":"Register of Permits","tags":["P","D"],"owner":"Governance & Legal","text":"Register of Permits\nCouncil must keep a register of Permits.","proposals":[],"disposition":"Retain"},{"id":"184","part":17,"partTitle":"Permits","title":"Duration of Permits","tags":["P","D"],"owner":"Governance & Legal","text":"Duration of Permits\nExcept where expressly stated in the Permit, the Permit operates\nfrom the date it is issued and expires one year after the date of\nissue or earlier if expressly provided in the Permit or if\ndetermined by Council.","proposals":[],"disposition":"Retain"},{"id":"185","part":17,"partTitle":"Permits","title":"Correction of Permits","tags":["P","D"],"owner":"Governance & Legal","text":"Correction of Permits\n(1) Council may correct a Permit issued if that Permit contains:\n(a) a clerical mistake or an error arising from any accident,\nslip or omission; or\n(b) a material miscalculation of figures or a material mistake\nin the description of any person, thing or property\nreferred to in the Permit.\n(2) Council must note the correction in the register of Permits.","proposals":[],"disposition":"Not started"},{"id":"186","part":17,"partTitle":"Permits","title":"Cancellation, Suspension or Amendment of Permits","tags":["P","D"],"owner":"Governance & Legal","text":"Cancellation, Suspension or Amendment of Permits\n(1) Council may cancel, suspend or amend any Permit at any\ntime if:\n(a) it is requested to do so by the Permit holder; or\n(b) Council considers that there has been:\n(i) a material mis-statement or concealment of fact\nin relation to the application for the Permit;\n(ii) any material mistake in relation to the issue of\nthe Permit; or\n(iii) any material change of circumstances that has\noccurred since the granting of the Permit;\n(c) Council believes that the continuance of the activity\npermitted by the Permit may result in a hazard, danger\nor inconvenience to any other person or property or be\notherwise detrimental to the amenity of the area;\n(d) Council is satisfied that there has been a substantial\nfailure to comply with a Permit condition or Notice to\nComply relating to the Permit; or\n(e) the Permit holder defaults in any payment of a fee,\ncharge, security bond, bank guarantee or similar surety\nrequired by the Permit.\n(2) Council must note any cancellation, suspension or\namendment of a Permit in the register of Permits.\n(3) Prior to cancelling, suspending or amending a Permit,\nCouncil must:\n(a) provide the Permit holder an opportunity to make\na submission on whether the Permit should be\ncancelled, suspended or amended; and\n(b) take into account the submission in deciding whether to\namend the Permit.","proposals":[],"disposition":"Not started"},{"id":"187","part":17,"partTitle":"Permits","title":"Transferability of Permits","tags":["P","D"],"owner":"Governance & Legal","text":"Transferability of Permits\nUnless otherwise stated in the Permit, a Permit is:\n(a) personal and authorises only the person named in\nthe Permit to carry out the activity authorised; and\n(b) not transferable without the consent of Council.","proposals":[],"disposition":"Not started"},{"id":"188","part":17,"partTitle":"Permits","title":"Permit Issue and Refusal","tags":["P","D"],"owner":"Governance & Legal","text":"Permit Issue and Refusal\n(1) Wherever in this Local Law power is given to Council to\nissue, refuse to issue, suspend or cancel a Permit, such\npower may be exercised by an Authorised Officer.\n(2) The power conferred in sub-clause (1) does not apply\nwhere:\n(a) a written objection is received to the issuing of a Permit,\nin which case the application and objections must be\nreferred to an Authorised Officer nominated by the Chief\nExecutive Officer, Director or Council for consideration\nand determination; or\n(b) where Council has issued or refused a Permit.","proposals":[],"disposition":"Not started"},{"id":"189","part":17,"partTitle":"Permits","title":"Exemptions","tags":["P","D"],"owner":"Governance & Legal","text":"Exemptions\n(1) Council may exempt any person or class of persons\nfrom the requirement to obtain a Permit, either generally or\nat specified times.\n(2) Any person or class of persons specified in the\nProcedure and Protocols Manual may be\nexempt from the requirement to obtain a Permit.","proposals":[],"disposition":"Not started"},{"id":"190","part":17,"partTitle":"Permits","title":"Information","tags":["P","I"],"owner":"Governance & Legal","text":"Information\n(1) A person must not obtain or attempt to obtain a Permit\nby knowingly making or causing to be made any false\nrepresentation whether orally or in writing.\n(2) Any person must, when requested to do so, produce\na Permit to:\n(a) an Authorised Officer; and\n(b) a member of Victoria Police or a member of the\nfire brigade.\n\nPart 1 8  –\nFees, Charges\nand Costs","proposals":[],"disposition":"Not started"},{"id":"191","part":18,"partTitle":"Fees, Charges and Costs","title":"Setting Fees and Charges","tags":["D"],"owner":"Governance & Legal","text":"Setting Fees and Charges\nCouncil may, from time to time and by resolution determine\na fee, charge, fare or rent in relation to any property,\nundertaking, goods, service or other act, matter or thing\nor the application, consideration, grant, renewal, suspension\nor cancellation of a Permit.","proposals":[],"disposition":"Retain"},{"id":"192","part":18,"partTitle":"Fees, Charges and Costs","title":"Differential or Structured Fees and Charges","tags":["D"],"owner":"Governance & Legal","text":"Differential or Structured Fees and Charges\nIn determining any fee, charge, fare or rent, Council may\nestablish a system or structure of fees, charges, fares or rents\nincluding a minimum or maximum, specific fees, scales of fees\naccording to the value of goods or services provided\nor project being assessed, if it considers it is appropriate\nto do so.","proposals":[],"disposition":"Retain"},{"id":"193","part":18,"partTitle":"Fees, Charges and Costs","title":"Waiver or Alteration to Fees and Charges","tags":["D"],"owner":"Governance & Legal","text":"Waiver or Alteration to Fees and Charges\nThe Council may waive, reduce, alter or refund in whole or in\npart any fee, charge, fare or rent with or without conditions.\nPart 1 9  –\nInfringement\nNotices","proposals":[],"disposition":"Not started"},{"id":"194","part":19,"partTitle":"Infringement Notices","title":"Purpose","tags":["D"],"owner":"Local Laws & Compliance","text":"Purpose\nThe purpose of this Part is to provide for the issue of\ninfringement notices for contraventions of this Local Law.","proposals":[],"disposition":"Retain"},{"id":"195","part":19,"partTitle":"Infringement Notices","title":"Infringement Notice","tags":["I"],"owner":"Local Laws & Compliance","text":"Infringement Notice\n(1) An Authorised Officer may serve, or cause to be served, an\ninfringement notice to a person who the Authorised Officer\nreasonably believes has contravened or failed to comply\nwith this Local Law.\n(2) An infringement notice may only be served to a person for a\ncontravention of this Local Law if the offence is listed in the\nschedule to the Procedure and Protocol Manual.\n(3) The infringement notice must specify the penalty (shown as\nPenalty Units) specified for that offence in the schedule to\nthe Procedure and Protocol Manual.\n\nEnforcement,\nOffences and\nProsecutions","proposals":["P21"],"disposition":"Amend"},{"id":"196","part":20,"partTitle":"Enforcement, Offences and Prosecutions","title":"Recovery of Costs","tags":["D"],"owner":"Local Laws & Compliance","text":"Recovery of Costs\nIn addition to any penalty under the Act or this Local Law,\nany expense, damage or loss incurred by Council in\nconsequence of a breach of this Local Law or in the\nprosecution of a breach of this Local Law must be paid\nby the person committing such a breach.","proposals":[],"disposition":"Retain"},{"id":"197","part":20,"partTitle":"Enforcement, Offences and Prosecutions","title":"Offences","tags":["I"],"owner":"Local Laws & Compliance","text":"Offences\nA person is guilty of an offence if the person:\n(a) does something that a provision of this Local Law\nprohibits to be done or makes an offence;\n(b) fails to do something that a provision of this Local\nLaw requires to be done;\n(c) allows any act to occur by consent, neglect, omission\nor direction that is a contravention of this Local Law;\n(d) engages in activity without a current Permit where\na provision of this Local Law requires that person\nto obtain a Permit before engaging in that activity;\n(e) breaches or fails to comply with a condition of a Permit\nissued under this Local Law;\n(f) is the driver of a Motor Vehicle that is parked or left\nstanding on Council Land as well as the registered\nowner of the Motor Vehicle (unless the owner of the\nMotor Vehicle complies with the operator onus\nprovisions of Part 6AA of the Road Safety Act 1986).","proposals":[],"disposition":"Retain"},{"id":"198","part":20,"partTitle":"Enforcement, Offences and Prosecutions","title":"General Penalties","tags":["I"],"owner":"Local Laws & Compliance","text":"General Penalties\n(1) A person who is guilty of an offence against this Local\nlaw for which a specific penalty is not provided is liable\nto a penalty not exceeding 20 Penalty Units.\n(2) In the case of a continuing offence a person is liable to a\npenalty not exceeding two (2) Penalty Units for each day\nafter conviction for an offence during which the\ncontravention continues.","proposals":["P21"],"disposition":"Amend"},{"id":"199","part":20,"partTitle":"Enforcement, Offences and Prosecutions","title":"Power to Impound","tags":["I"],"owner":"Local Laws & Compliance","text":"Power to Impound\n(1) An Authorised Officer may seize and impound a Motor\nVehicle, Vehicle, sign, Goods or any other item where there\nhas been a contravention of this Local Law.\n(2) As soon as practicable after impounding any Motor Vehicle,\nVehicle, sign, Goods or any other item an Authorised Officer\nmust, if the name and address of its owner is known, serve\na notice of impoundment on the owner.\n(3) Council may determine, from time to time, a fee that must be\npaid by the owner of any impounded Motor Vehicle, Vehicle,\nsign, Goods or any other item before Council is required to\nrelease the Motor Vehicle, Vehicle, sign, Goods or any other\nitem. Any impounded Vehicle, sign or Goods may be\nclaimed by its owner after the payment of the relevant fees.\n(4) Any impounded Motor Vehicle, Vehicle, sign, Goods or any\nother item not claimed within the time specified on\nthe notice of impoundment or within seven (7) days of the\nimpounding may be disposed of by Council by tender or\npublic auction, transferred to the Council Waste Depot or\ngiven away.","proposals":[],"disposition":"Retain"},{"id":"200","part":20,"partTitle":"Enforcement, Offences and Prosecutions","title":"Impersonating Council Staff","tags":["I"],"owner":"Local Laws & Compliance","text":"Impersonating Council Staff\n(1) A person who is not a member of Council staff must not,\nin any way, hold themselves out to be a member of\nCouncil staff.\n(2) A person who is not a member of Council staff must not\nproduce a document that contains the Council logo or\nCouncil name, unless authorised by Council.\n(3) A person who is not a member of Council staff must not use\na document that contains the Council logo or Council name,\nunless authorised by Council.","proposals":[],"disposition":"Retain"}],"proposals":[{"id":"P01","title":"E-rideables and share scheme parking on footpaths","clauses":["137","127","123"],"unit":"Transport & Parking","raised":"2022-11","source":"Operations — parking officers","impact":5,"effort":4,"status":"In scope","sensitivity":"High","pilot":"PL02","note":"Cl.137 defines a 'wheeled recreational vehicle' around mini bikes and Segways and predates hire e-scooters entirely. Need a head of power for corral parking, impoundment and operator agreements that does not conflict with the Road Safety Road Rules."},{"id":"P02","title":"Make parklets and streateries a permanent permit class","clauses":["126","127"],"unit":"Economic Development","raised":"2021-06","source":"Traders associations (Chapel St, Glenferrie Rd)","impact":5,"effort":3,"status":"In scope","sensitivity":"High","pilot":"PL01","note":"Outdoor dining structures were stood up under emergency arrangements and have run on extensions since. The Footpath Trading Policy is incorporated under cl.19(3), so the policy and the law have to move together."},{"id":"P03","title":"Lower the Significant Tree trigger and add a canopy test","clauses":["163"],"unit":"Parks & Environment","raised":"2020-09","source":"Urban Forest Strategy action 4.2","impact":5,"effort":4,"status":"In scope","sensitivity":"High","pilot":null,"note":"Current trigger is 140cm circumference at 1.4m (or 180cm at base). Arborists argue this misses medium-maturity canopy on small lots. Options: lower threshold, add a canopy-spread test, or a species schedule."},{"id":"P04","title":"Bring the Nature Strip Planting Policy inside the law","clauses":["110","113"],"unit":"Parks & Environment","raised":"2023-03","source":"Councillor request","impact":3,"effort":2,"status":"In scope","sensitivity":"Medium","pilot":"PL05","note":"Cl.110(4) refers to the Nature Strip Planting Policy but, unlike the Footpath Trading and Keeping of Animals policies, it is not an incorporated document under cl.19. Inconsistent enforceability."},{"id":"P05","title":"Remove the 25-trolley exemption for shopping trolleys","clauses":["125"],"unit":"Local Laws & Compliance","raised":"2019-08","source":"Compliance team — recurring hotspots","impact":3,"effort":2,"status":"Triage","sensitivity":"Low","pilot":null,"note":"Cl.125(2) exempts operators with 25 trolleys or fewer, which covers the small supermarkets generating most of the abandoned-trolley reports."},{"id":"P06","title":"Align noise Table 2 with the EPA Environment Reference Standard","clauses":["144"],"unit":"City Amenity","raised":"2021-02","source":"Legal — advice on overlapping regimes","impact":4,"effort":4,"status":"In scope","sensitivity":"Medium","pilot":null,"note":"Table 2 prohibited hours sit alongside the Environment Protection Regulations 2021 residential noise provisions. Officers report confusion about which instrument to use; risk of an inconsistency argument on review."},{"id":"P07","title":"Review the 65dB amplified-music standard for entertainment precincts","clauses":["144"],"unit":"City Amenity","raised":"2022-04","source":"Hospitality operators + resident groups","impact":4,"effort":4,"status":"In scope","sensitivity":"High","pilot":"PL04","note":"Cl.144(6) sets speaker placement rules and 65dB (LA max) at 2m from an adjoining facade. Contested from both directions in Prahran and Windsor."},{"id":"P08","title":"Camping provisions and the Human Rights Charter","clauses":["143"],"unit":"Community & Wellbeing","raised":"2020-07","source":"Legal + Homelessness Working Group","impact":5,"effort":3,"status":"In scope","sensitivity":"Critical","pilot":null,"note":"Cl.143(3)-(4) prohibit camping and leaving personal effects on Council land. Charter s.12 (freedom of movement), s.13 (privacy) and s.17 (protection of families) engagement must be documented, with an assertive-outreach-first operating protocol."},{"id":"P09","title":"Cat containment / curfew under the Keeping of Animals Policy","clauses":["165","166"],"unit":"Local Laws & Compliance","raised":"2019-11","source":"Councillor notice of motion (lapsed)","impact":4,"effort":4,"status":"In scope","sensitivity":"Critical","pilot":"PL03","note":"Made under s.42 Domestic Animals Act 1994. Neighbouring councils have moved; this is the single most likely source of submission volume."},{"id":"P10","title":"Building activity hours and construction management on major works","clauses":["159","160","161","162"],"unit":"City Works & Assets","raised":"2022-08","source":"Building surveying + resident complaints","impact":4,"effort":3,"status":"In scope","sensitivity":"Medium","pilot":"PL06","note":"Requests to allow extended hours for concrete pours and crane work in exchange for a construction management plan and community liaison obligations."},{"id":"P11","title":"Reset asset protection bond levels and exemption classes","clauses":["115","182"],"unit":"City Works & Assets","raised":"2023-01","source":"Assets — cost recovery review","impact":3,"effort":2,"status":"Triage","sensitivity":"Low","pilot":null,"note":"Bond levels are set through the Procedure and Protocol Manual. Confirm whether the quantum belongs in the law, the manual or the fees schedule."},{"id":"P12","title":"Tiered filming permits for small-crew and social content","clauses":["136"],"unit":"Economic Development","raised":"2021-10","source":"Film Vic liaison + internal","impact":2,"effort":2,"status":"Triage","sensitivity":"Low","pilot":null,"note":"Cl.136 captures any commercial filming on Council land. A single-operator shoot and a feature unit are treated identically."},{"id":"P13","title":"Drone operation over Council reserves","clauses":["123"],"unit":"Recreation & Leisure","raised":"2020-02","source":"Reserve bookings team","impact":3,"effort":3,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"Cl.123(1)(a) bans drones unless the reserve is exempted in the Procedure and Protocol Manual. CASA holds airspace control — confirm the limits of Council's power over take-off and landing only."},{"id":"P14","title":"EV charging cables across footpaths and kerbside charging","clauses":["127","135","107"],"unit":"Transport & Parking","raised":"2023-05","source":"Climate & Energy team","impact":4,"effort":4,"status":"In scope","sensitivity":"Medium","pilot":"PL07","note":"Residents without off-street parking are running cables across footpaths. Currently an obstruction under cl.127 with no permit pathway. Interacts with the residential parking permit scheme."},{"id":"P15","title":"Clothing bins — separate charitable from commercial collection","clauses":["133"],"unit":"Waste & Recycling","raised":"2019-05","source":"Compliance","impact":2,"effort":2,"status":"Parked","sensitivity":"Low","pilot":null,"note":"Sitting since 2019. Dumping around commercial bins drives most of the cost; a permit condition set may be enough without a drafting change."},{"id":"P16","title":"Real estate signage over footpaths and on facades","clauses":["145"],"unit":"Urban Planning","raised":"2018-12","source":"Officer report (not progressed)","impact":2,"effort":2,"status":"Parked","sensitivity":"Medium","pilot":null,"note":"Cl.145(3) requires a permit for signage over a verandah or footpath. Enforcement is effectively complaint-driven; industry expects a standing arrangement."},{"id":"P17","title":"Bin presentation times and bin storage on nature strips","clauses":["173","174"],"unit":"Waste & Recycling","raised":"2022-02","source":"Waste services + amenity officers","impact":3,"effort":2,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"No presentation window in the current law. Four-stream rollout has increased bins left out; interacts with the state's FOGO requirements."},{"id":"P18","title":"Commercial use of open space — personal training and boot camps","clauses":["122"],"unit":"Recreation & Leisure","raised":"2021-09","source":"Open space team","impact":3,"effort":2,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"Cl.122(o) requires a permit for paid personal training. Group size, turf wear and fee structure are unresolved."},{"id":"P19","title":"Accessible footpath clear width as a hard standard","clauses":["126","127"],"unit":"Community & Wellbeing","raised":"2022-06","source":"Disability Advisory Committee","impact":4,"effort":3,"status":"In scope","sensitivity":"Medium","pilot":"PL01","note":"The Disability Advisory Committee has asked for a minimum continuous accessible path set in the law rather than the policy, so it survives policy amendment."},{"id":"P20","title":"Repeal spent Common Seal and machinery clauses","clauses":["20","21","22","23","24","2","5"],"unit":"Governance & Legal","raised":"2023-09","source":"Governance — post-2023 amendment tidy-up","impact":2,"effort":1,"status":"In scope","sensitivity":"Low","pilot":null,"note":"Part 4 was repealed in 2023 and moved to the Governance Rules. Part 3 largely duplicates the Governance Rules. Definitions still reference the Local Government Act 1989 throughout."},{"id":"P21","title":"Infringement schedule and penalty level review","clauses":["195","198"],"unit":"Local Laws & Compliance","raised":"2023-07","source":"Compliance — deterrence analysis","impact":4,"effort":3,"status":"In scope","sensitivity":"Medium","pilot":null,"note":"Cl.198 caps at 20 penalty units, with 2 units per day for continuing offences. Test whether current infringement levels deter tree removal and illegal works, where the commercial gain exceeds the penalty."},{"id":"P22","title":"Short-stay accommodation amenity and party-house noise","clauses":["144","117"],"unit":"City Amenity","raised":"2022-12","source":"Resident complaints + Councillor request","impact":4,"effort":4,"status":"Triage","sensitivity":"High","pilot":null,"note":"State short-stay levy and the Owners Corporations regime cover part of this. Need legal advice on what is left for a local law to do before scoping drafting."},{"id":"P23","title":"Consolidate directive powers and add a review right","clauses":["120","149","177","16"],"unit":"Governance & Legal","raised":"2024-02","source":"Internal audit — administrative fairness","impact":3,"effort":3,"status":"Triage","sensitivity":"Medium","pilot":null,"note":"Directive powers appear in at least four places with different wording. Cl.16 gives 28 days to be heard but does not stay the notice. Audit recommended one consistent procedural code."},{"id":"P24","title":"Designated alcohol-free areas — evidence review","clauses":["129","123"],"unit":"Local Laws & Compliance","raised":"2020-11","source":"Victoria Police liaison","impact":3,"effort":3,"status":"Parked","sensitivity":"High","pilot":null,"note":"Blanket prohibition under cl.129 with exemptions by permit. Police support retention; equity concerns raised about enforcement patterns."}],"program":{"law":{"title":"General Local Law 2018 (No. 1)","council":"City of Stonnington","commenced":"2018-07-20","sunset":"2028-07-19","amended":"2023 (Part 4 repealed — moved to Governance Rules)","madeUnder":"s.111 Local Government Act 1989 and s.42 Domestic Animals Act 1994","incorporated":["Procedure and Protocol Manual","Keeping of Animals Policy","Footpath Trading Policy"]},"phases":[{"id":"F1","name":"Initiate & diagnose","start":"2026-09-01","end":"2027-02-26","lead":"Governance & Legal","detail":"Project plan, governance, clause-by-clause internal review, triage of the held-over backlog."},{"id":"F2","name":"Evidence & benchmarking","start":"2026-10-01","end":"2027-03-31","lead":"Local Laws & Compliance","detail":"Enforcement and request data, permit volumes, VCAT and complaint history, comparison against neighbouring councils' current laws."},{"id":"F3","name":"Community & stakeholder engagement","start":"2027-02-15","end":"2027-05-28","lead":"Community & Wellbeing","detail":"Issues-stage engagement under the Community Engagement Policy — before positions are fixed."},{"id":"F4","name":"Pilots & operational testing","start":"2026-11-02","end":"2027-06-30","lead":"Local Laws & Compliance","detail":"Test proposed changes operationally under existing powers, permit conditions or policy, so the drafting rests on evidence."},{"id":"F5","name":"Policy settlement","start":"2027-05-03","end":"2027-08-31","lead":"Governance & Legal","detail":"Councillor briefings, position papers, resolution of contested items."},{"id":"F6","name":"Drafting & statutory assessments","start":"2027-07-01","end":"2027-10-29","lead":"Governance & Legal","detail":"Drafting instructions, legal drafting, Community Impact Statement, Human Rights Charter assessment, competition assessment."},{"id":"F7","name":"Statutory exhibition & submissions","start":"2027-11-01","end":"2028-02-29","lead":"Governance & Legal","detail":"Public notice, exhibition of the proposed local law, receipt and hearing of submissions."},{"id":"F8","name":"Making, gazettal & commencement","start":"2028-03-01","end":"2028-06-30","lead":"Governance & Legal","detail":"Council resolution to make the law, publication in the Government Gazette, public notice, commencement."},{"id":"F9","name":"Transition & implementation","start":"2028-04-03","end":"2028-09-29","lead":"Local Laws & Compliance","detail":"Delegations and authorisations, officer training, permit migration, signage, incorporated document updates, communications."}],"gates":[{"id":"G1","date":"2026-10-26","forum":"Executive Leadership Team","title":"Project plan, governance and resourcing endorsed","phase":"F1","owner":"Project Manager","status":"In progress","test":"Sponsor, steering group, budget and a named drafting resource are all confirmed in writing.","authority":"Internal project governance","confirm":false},{"id":"G2","date":"2026-12-14","forum":"Council","title":"Review commenced — scope and engagement plan endorsed","phase":"F1","owner":"Director Corporate","status":"Not started","test":"Council resolves to commence the review and endorses the engagement approach under the Community Engagement Policy.","authority":"Local Government Act 2020 s.55 (community engagement policy)","confirm":true},{"id":"G3","date":"2027-03-01","forum":"Executive Leadership Team","title":"Clause triage complete, backlog dispositioned","phase":"F1","owner":"Project Manager","status":"Not started","test":"Every clause in the register carries a disposition and an owner; every backlog item is in scope, out of scope or deferred with a reason.","authority":"Internal project governance","confirm":false},{"id":"G4","date":"2027-06-28","forum":"Executive Leadership Team","title":"Consultation findings and pilot evidence accepted","phase":"F3","owner":"Project Manager","status":"Not started","test":"Engagement report published back to participants; each pilot has a written evaluation against its stated measure.","authority":"Internal project governance","confirm":false},{"id":"G5","date":"2027-08-16","forum":"Councillor briefing","title":"Policy positions confirmed","phase":"F5","owner":"Director Corporate","status":"Not started","test":"Councillors have seen an options paper on every contested item and indicated a preferred position.","authority":"Internal project governance","confirm":false},{"id":"G6","date":"2027-09-13","forum":"Council","title":"Drafting instructions and Community Impact Statement approved","phase":"F6","owner":"Manager Governance","status":"Not started","test":"Instructions signed off; Community Impact Statement covers restriction of competition and administrative burden.","authority":"Victorian local law guidelines — community impact statement","confirm":true},{"id":"G7","date":"2027-10-25","forum":"Executive Leadership Team","title":"Draft law and statutory assessments complete","phase":"F6","owner":"Manager Governance","status":"Not started","test":"Draft law, Charter of Human Rights compatibility assessment and competition assessment are complete and legally reviewed.","authority":"Charter of Human Rights and Responsibilities Act 2006","confirm":true},{"id":"G8","date":"2027-11-22","forum":"Council","title":"Resolve to give notice of the proposed local law","phase":"F7","owner":"Director Corporate","status":"Not started","test":"Council resolves to give public notice; notice states purpose and general purport and where a copy may be obtained.","authority":"Local Government Act 2020 Part 3 Div. 2 — process for making a local law","confirm":true},{"id":"G9","date":"2028-02-21","forum":"Council","title":"Submissions considered and submitters heard","phase":"F7","owner":"Manager Governance","status":"Not started","test":"All submissions tabled, submitters who asked to be heard have been heard, and a response to each theme is documented.","authority":"Council's Community Engagement Policy and Governance Rules","confirm":true},{"id":"G10","date":"2028-04-17","forum":"Council","title":"Resolve to make the local law","phase":"F8","owner":"Director Corporate","status":"Not started","test":"Council resolves to make the local law in its final form. This is the immovable decision — everything downstream is administrative.","authority":"Local Government Act 2020 Part 3 Div. 2","confirm":true},{"id":"G11","date":"2028-05-15","forum":"Administrative","title":"Published in the Government Gazette, public notice given, copy to the Minister","phase":"F8","owner":"Manager Governance","status":"Not started","test":"Gazette notice published, public notice given, and a copy provided to the Minister within the statutory period.","authority":"Local Government Act 2020 Part 3 Div. 2 — publication requirements","confirm":true},{"id":"G12","date":"2028-06-19","forum":"Administrative","title":"New law commences — 30 days clear of the sunset","phase":"F8","owner":"Project Manager","status":"Not started","test":"New law in operation, delegations and authorisations remade, officers trained, permits migrated, website and signage updated.","authority":"Local Government Act 2020 Part 3 Div. 2","confirm":true}],"boundaries":[{"date":"2028-07-19","label":"Sunset — General Local Law 2018 (No. 1) ceases to operate","kind":"immovable","note":"Clause 4 of the current law. A ten-year life from commencement on 20 July 2018. There is no power to extend it: if nothing replaces it, every permit trigger, notice power and infringeable offence in the register stops on this date."},{"date":"2028-09-19","label":"Indicative start of the election caretaker period","kind":"hard","note":"Victorian council general elections fall in October 2028. Major decisions are constrained once the election period starts, so there is no usable float past August 2028. Confirm the exact date with Governance when the Victorian Electoral Commission publishes it."}]},"pilots":[{"id":"PL01","title":"Parklet and accessible clear-width pilot — Chapel St north","proposals":["P02","P19"],"owner":"Economic Development","start":"2026-11-02","end":"2027-05-28","status":"Planned","powers":"Permit conditions under cl.126 and the Footpath Trading Policy — no change to the law needed to run it.","hypothesis":"A permanent parklet class with a 1.8m continuous accessible path can be delivered without reducing trader participation.",
