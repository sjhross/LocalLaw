<title>Sunset Clause</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#ECEEF0; --surface:#FFFFFF; --surface-2:#F4F6F7; --surface-3:#E4E8EB;
  --ink:#14181C; --ink-2:#4A545C; --ink-3:#79848D;
  --rule:#D2D9DE; --rule-strong:#B6C0C7;
  --accent:#8A2F32; --accent-ink:#FFFFFF; --accent-wash:#F3E6E6;
  --teal:#1F5F66; --teal-wash:#E2EDEE;
  --amber:#9C6510; --amber-wash:#F5EADA;
  --blue:#2C4E8A; --blue-wash:#E3E9F3;
  --green:#2C6B50; --green-wash:#E2EEE8;
  --red:#A33131; --red-wash:#F5E3E3;
  --grey-wash:#E8ECEE;
  --shadow:0 1px 2px rgba(20,24,28,.06), 0 6px 20px rgba(20,24,28,.05);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1317; --surface:#171C21; --surface-2:#1D242A; --surface-3:#252D34;
    --ink:#E4E9ED; --ink-2:#A4AFB7; --ink-3:#78838C;
    --rule:#2A323A; --rule-strong:#3B444D;
    --accent:#D97F84; --accent-ink:#1A0F10; --accent-wash:#341F21;
    --teal:#63AEB4; --teal-wash:#17302F;
    --amber:#D9A445; --amber-wash:#332816;
    --blue:#89A6DC; --blue-wash:#1B2436;
    --green:#6BB795; --green-wash:#162C23;
    --red:#E38C8C; --red-wash:#38201F;
    --grey-wash:#232A30;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1317; --surface:#171C21; --surface-2:#1D242A; --surface-3:#252D34;
  --ink:#E4E9ED; --ink-2:#A4AFB7; --ink-3:#78838C;
  --rule:#2A323A; --rule-strong:#3B444D;
  --accent:#D97F84; --accent-ink:#1A0F10; --accent-wash:#341F21;
  --teal:#63AEB4; --teal-wash:#17302F;
  --amber:#D9A445; --amber-wash:#332816;
  --blue:#89A6DC; --blue-wash:#1B2436;
  --green:#6BB795; --green-wash:#162C23;
  --red:#E38C8C; --red-wash:#38201F;
  --grey-wash:#232A30;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.005em}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.rail{flex:0 0 228px;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--rule)}
.brand .crest{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.brand h1{font-size:19px;line-height:1.15;margin-top:6px}
.brand .sub{font-size:11.5px;color:var(--ink-2);margin-top:5px;line-height:1.35}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
.nav a{display:flex;align-items:baseline;gap:8px;padding:8px 9px;border-radius:3px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:500}
.nav a .n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:15px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-wash);color:var(--accent)}
.nav a[aria-current="page"] .n{color:var(--accent)}
.railfoot{border-top:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.who{display:flex;align-items:center;gap:7px}
.who label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.who input{width:52px;background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:3px 6px;font-family:var(--mono);font-size:11px;color:var(--ink);text-transform:uppercase}
.dbstat{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-3);line-height:1.3}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.dot.live{background:var(--green)} .dot.local{background:var(--amber)}
.themebtn{background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 8px;font-size:11px;color:var(--ink-2);cursor:pointer;align-self:flex-start}
.themebtn:hover{border-color:var(--rule-strong);color:var(--ink)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:9px 28px;display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.tb{display:flex;align-items:baseline;gap:8px;min-width:0}
.tb .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.tb .v{font-size:13px;font-weight:500}
.tb .v.count{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tb.alert .v{color:var(--accent)}
main{padding:30px 28px 72px;max-width:1220px;width:100%}

/* ---------- headings ---------- */
.vh{margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.vh .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.vh h2{font-size:27px}
.vh p{margin:8px 0 0;color:var(--ink-2);max-width:66ch;font-size:13.5px}
h3.sec{font-size:16px;margin:32px 0 12px;display:flex;align-items:baseline;gap:10px}
h3.sec:first-child{margin-top:0}
h3.sec .tally{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
.note{font-size:12px;color:var(--ink-3);max-width:72ch;margin:8px 0 0}

/* ---------- seal / countdown ---------- */
.seal{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:8px}
.seal>div{background:var(--surface);padding:15px 16px 14px}
.seal .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.seal .big{font-family:var(--serif);font-size:38px;line-height:1;margin-top:9px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.seal .big.hot{color:var(--accent)}
.seal .cap{font-size:11.5px;color:var(--ink-2);margin-top:7px;line-height:1.35}

/* ---------- gantt ---------- */
.gantt{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:0 0 6px;overflow-x:auto}
.gantt-in{min-width:760px;padding:14px 18px 8px}
.axis{position:relative;height:19px;border-bottom:1px solid var(--rule);margin-bottom:11px}
.axis span{position:absolute;top:0;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);transform:translateX(-50%);white-space:nowrap}
.gantt-row{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;margin-bottom:5px}
.gantt-row .lab{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.25}
.gantt-row .lab b{display:block;color:var(--ink);font-weight:500;font-size:12.5px}
.track{position:relative;height:20px;background:linear-gradient(var(--surface-2),var(--surface-2));border-radius:2px}
.bar{position:absolute;top:3px;height:14px;border-radius:2px;background:var(--teal);opacity:.82}
.bar.now{background:var(--accent)}
.vline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--accent)}
.vline.now{border-left:1px solid var(--accent);opacity:.5}
.hardrow{background:transparent;border-top:1px solid var(--rule)}
.hardlab{position:absolute;left:0;top:3px;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--accent);white-space:nowrap}
.gantt-marks{position:relative;height:56px;margin-top:6px;border-top:1px solid var(--rule);padding-top:4px}
.mark{position:absolute;top:4px;transform:translateX(-50%);text-align:center;width:24px}
.mark i{display:block;width:7px;height:7px;margin:0 auto;background:var(--surface);border:1.5px solid var(--ink-2);transform:rotate(45deg)}
.mark.done i{background:var(--green);border-color:var(--green)}
.mark.active i{background:var(--accent);border-color:var(--accent)}
.mark b{display:block;font-family:var(--mono);font-size:9px;color:var(--ink-3);margin-top:5px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);padding:8px 18px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---------- ledger ---------- */
.ledger{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.ledger th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:400;padding:9px 11px;border-bottom:1px solid var(--rule-strong);white-space:nowrap;background:var(--surface-2)}
.ledger td{padding:8px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
.ledger tr:last-child td{border-bottom:0}
.ledger tr:hover td{background:var(--surface-2)}
.ledger .num{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger .ti{font-weight:500;line-height:1.35}
.ledger .meta{color:var(--ink-3);font-size:11.5px;margin-top:3px;line-height:1.4}
.tablewrap{overflow-x:auto;border-radius:3px}
.gaprow td{background:var(--grey-wash)!important;color:var(--ink-3);font-size:11.5px;font-style:italic;padding:7px 11px}

/* ---------- chips, pills ---------- */
.chip{display:inline-block;padding:1px 6px;border-radius:2px;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;background:var(--grey-wash);color:var(--ink-2);white-space:nowrap}
.chip+.chip{margin-left:3px}
.chip.p{background:var(--blue-wash);color:var(--blue)}
.chip.n{background:var(--amber-wash);color:var(--amber)}
.chip.i{background:var(--accent-wash);color:var(--accent)}
.chip.x{background:var(--red-wash);color:var(--red)}
.chip.link{background:var(--teal-wash);color:var(--teal);cursor:pointer;border:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;background:var(--grey-wash);color:var(--ink-2);white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}
.pill.green{background:var(--green-wash);color:var(--green)}
.pill.amber{background:var(--amber-wash);color:var(--amber)}
.pill.red{background:var(--red-wash);color:var(--red)}
.pill.blue{background:var(--blue-wash);color:var(--blue)}
.pill.teal{background:var(--teal-wash);color:var(--teal)}
.pill.grey{background:var(--grey-wash);color:var(--ink-3)}

/* ---------- controls ---------- */
select,input[type=text],input[type=search],textarea{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:4px 7px;max-width:100%}
select:hover,input:hover{border-color:var(--rule-strong)}
textarea{width:100%;resize:vertical;line-height:1.45;font-size:12.5px;min-height:34px}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:11px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.filters label{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-right:-4px}
.filters input[type=search]{flex:1;min-width:150px}
.clearbtn{background:none;border:1px solid var(--rule);border-radius:3px;padding:4px 9px;font-size:11.5px;color:var(--ink-2);cursor:pointer}
.clearbtn:hover{border-color:var(--accent);color:var(--accent)}
.sel-dis{width:112px} .sel-own{width:150px}

/* ---------- tally bar ---------- */
.tallybar{display:flex;height:9px;border-radius:2px;overflow:hidden;background:var(--surface-3);margin:0 0 9px}
.tallybar i{display:block;height:100%}
.tallykey{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-bottom:20px}
.tallykey b{font-family:var(--mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.tallykey span i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* ---------- panels ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 17px}
.panel h4{font-size:14.5px;margin-bottom:3px}
.panel .lede{font-size:12px;color:var(--ink-3);margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:0}
.item{padding:10px 0;border-top:1px solid var(--rule)}
.item:first-child{border-top:0;padding-top:2px}
.item .top{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.item .ti{font-weight:500;font-size:13px;line-height:1.35}
.item .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.date{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- cards (gates, pilots) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--rule-strong);border-radius:3px;padding:14px 15px;display:flex;flex-direction:column;gap:8px}
.card.is-next{border-left-color:var(--accent)}
.card.is-done{border-left-color:var(--green)}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .id{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.card h4{font-size:14px;line-height:1.3}
.card p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.card .test{font-size:12px;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:10px;line-height:1.5}
.card .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.kv{display:flex;gap:6px;font-size:11.5px;color:var(--ink-3)}
.kv b{font-weight:500;color:var(--ink-2)}

/* ---------- matrices ---------- */
.matrix{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 18px}
.mx{display:grid;grid-template-columns:auto repeat(5,1fr);gap:3px}
.mx .ylab,.mx .xlab{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);display:flex;align-items:center;justify-content:center;text-align:center}
.mx .ylab{writing-mode:vertical-rl;transform:rotate(180deg);grid-row:span 5;padding-right:4px}
.cell{min-height:54px;border-radius:2px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;background:var(--surface-2);border:1px solid var(--rule)}
.cell.l1{background:var(--green-wash)} .cell.l2{background:var(--grey-wash)}
.cell.l3{background:var(--amber-wash)} .cell.l4{background:var(--red-wash)}
.tok{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:2px;background:var(--surface);border:1px solid var(--rule-strong);color:var(--ink);cursor:pointer;height:fit-content}
.tok:hover{border-color:var(--accent);color:var(--accent)}
.mxfoot{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-top:7px;padding-left:22px}

/* ---------- detail drawer ---------- */
.drawer{position:fixed;inset:0;z-index:60;display:none}
.drawer[open]{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(10,14,18,.42)}
.drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--shadow);overflow-y:auto;padding:22px 24px 40px}
.drawer h3{font-size:19px;margin:6px 0 4px}
.drawer .close{position:absolute;top:14px;right:18px;background:none;border:0;font-size:19px;color:var(--ink-3);cursor:pointer;line-height:1}
.drawer .close:hover{color:var(--accent)}
.drow{padding:11px 0;border-top:1px solid var(--rule);font-size:13px;line-height:1.55;color:var(--ink-2)}
.drow .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

.draftbox{background:var(--surface);border:1px solid var(--rule);border-radius:3px}
.drafthead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:16px 18px}
.drafthead h4{font-family:var(--serif);font-size:14.5px;font-weight:500;margin:0 0 3px}
.drafthead .lede{font-size:12px;color:var(--ink-3);margin:0;max-width:54ch}
.dobtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;padding:8px 15px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.dobtn:hover{filter:brightness(1.08)}
.dobtn[disabled]{opacity:.55;cursor:default;filter:none}
.dobtn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule);font-weight:400}
.dobtn.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.draftbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:9px 18px;border-top:1px solid var(--rule);background:var(--amber-wash);font-size:12px;color:var(--ink-2)}
.draftbar b{color:var(--ink);font-weight:600}
.draftbody{padding:4px 18px 18px;border-top:1px solid var(--rule);max-width:74ch}
.draftbody h5{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:18px 0 7px;font-weight:400}
.draftbody h5:first-child{margin-top:14px}
.draftbody p{margin:0 0 9px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.draftbody ul{margin:0 0 9px;padding-left:18px}
.draftbody li{font-size:13.5px;line-height:1.6;color:var(--ink-2);margin-bottom:5px}
.draftbody .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.draftfoot{display:flex;gap:9px;padding:0 18px 16px;flex-wrap:wrap;align-items:center}
.ask{display:flex;gap:9px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
.ask input{flex:1;min-width:250px;font-size:15px;padding:11px 13px;font-family:var(--sans)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;border-left:1px solid var(--rule);padding:7px 13px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[disabled]{color:var(--ink-3);cursor:not-allowed;background:var(--surface-2)}
.basisnote{font-size:12px;color:var(--ink-3);margin:0 0 16px;max-width:74ch;line-height:1.5}
.egs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.eg{background:var(--surface);border:1px solid var(--rule);border-radius:20px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;text-align:left}
.eg:hover{border-color:var(--accent);color:var(--accent)}
.answer{background:var(--surface);border:1px solid var(--rule);border-radius:3px;margin-bottom:18px}
.answer .q{padding:14px 18px 12px;border-bottom:1px solid var(--rule);font-family:var(--serif);font-size:18px;line-height:1.35}
.answer .bod{padding:2px 18px 16px;max-width:76ch}

<script>
const D = {"generated":"2026-09-13","clauses":[{"id":"1","part":1,"partTitle":"Preliminary","title":"Name and Objectives of Local Law","tags":["D"],"owner":"Governance & Legal","text":"Name and Objectives of Local Law\nThis Local Law is known as the General Local Law No. 1,\nand the objectives of this Local Law are to provide for:\n(a)  the peace, order and good government of the Municipal\nDistrict;\n(b)  the administration of Council powers and functions;\n(c)  a safe and healthy environment so the community can\nenjoy a quality of life that meets its expectations;\n(d) the safe and equitable use and enjoyment of\nPublic Places;\n(e) the protection and enhancement of the amenity and\nenvironment of the Municipal District;\n(f) the fair and reasonable use and enjoyment of private land;\n(g) the prohibition, regulation and control of activities, events,\npractices or behaviour in places so that no detriment is\ncaused to the amenity of the neighbourhood nor nuisance\ncaused to a person nor damage caused to a person’s\nproperty; and\n(h) the prohibition, regulation and control of activities that may\naffect urban character and local amenity.","proposals":[],"disposition":"Retain"},{"id":"2","part":1,"partTitle":"Preliminary","title":"Authorising Provision of this Local Law","tags":["D","X"],"owner":"Governance & Legal","text":"Authorising Provision of this Local Law\nThis Local Law is a Local Law made under section 1 1 1\nof the Local Government Act 1989 and section 42 of\nthe Domestic Animal Act 1994.","proposals":["P20"],"disposition":"Revoke"},{"id":"3","part":1,"partTitle":"Preliminary","title":"Commencement of this Local Law","tags":["D"],"owner":"Governance & Legal","text":"Commencement of this Local Law\nThis Local Law comes into operation on the day after\nthe date of notice of making the Local Law is published\nin the Victoria Government Gazette.","proposals":[],"disposition":"Retain"},{"id":"4","part":1,"partTitle":"Preliminary","title":"Revocation Date of this Local Law","tags":["D","X"],"owner":"Governance & Legal","text":"Revocation Date of this Local Law\nThis Local Law ceases to operate on 19 July 2028.","proposals":[],"disposition":"Revoke"},{"id":"5","part":1,"partTitle":"Preliminary","title":"Definition of Words Used in this Local Law","tags":["D","X"],"owner":"Governance & Legal","text":"Definition of Words Used in this Local Law\nUnless the contrary intention appears in this Local Law:\n“Act” means the Local Government Act 1989, as amended\nfrom time to time.\n“Advisory Committee” means an advisory committee\nestablished by Council under section 86(1) of the Act.\n“Agenda” means the notice of a meeting setting out the\nbusiness to be transacted at the meeting.\n“Animal” includes a bird or reptile.\n“Approved Receptacle” means a waste receptacle\npurchased and supplied by Council.\n“Asset Protection Permit Bond” means a bond,\nbank guarantee or like security required to be paid\nunder a Permit.\n“Assistance Animal” has the same meaning as in\nsection 9 of the Disability Discrimination Act 1992 (Cth).\n“Authorised Officer” means a person appointed by Council\nto be an Authorised Officer pursuant to section\n224 of the Act or treated by section 224A of that Act to have\nbeen either in relation to the whole of this Local Law\nor to a particular portion of it in which the term is used.\n“Barbecue” means a permanent structure, device or\ncontraption:\n(a)  designed or constructed for the purpose of cooking food\nin the open air for human consumption; and\n(b)  which is being used for the purpose of cooking food\nor prior to or subsequent to cooking food.\n“Building” includes a part of a building, a structure,\ntemporary structure, part of a temporary building, outbuilding,\nfence, wall, provision for lighting, heating,\nwater supply, drainage and sewerage and any other\nappurtenances of a building.\n“Chairperson” means the Chairperson of the meeting\nand includes an acting, a temporary and a substitute\nChairperson.\n“Chief Executive Officer” means the Chief Executive Officer\nof Council appointed in accordance with section\n94 of the Act, or other person appointed to act in that position\nduring the Chief Executive Officer’s absence.\n“Chimney” includes a structure or opening of any kind\nfrom or through which smoke or air impurity may be\nemitted from a building.\n“Committee” means an advisory Committee or a\nSpecial Committee.\n“Common Seal” means the common seal of Council.\n“Confidential Business” means:\n(a) personnel matters;\n(b) the personal hardship of any resident or ratepayer;\n(c) industrial matters;\n(d) contractual matters;\n(e) proposed developments;\n(f) legal advice;\n(g) matters affecting the security of Council property;\n(h) any matter that Council or the Special Committee\nconsiders would prejudice Council or any person;\n(i) a resolution to close the meeting to members\nof the public.\n“Construct” includes build, construct, erect, place in position,\nre-build, re-construct, re-erect, replace in position or do any\nstructural work.\n“Council” means Stonnington City Council.\n“Council Land” means all land:\n(a) owned, leased, managed or occupied by Council; or\n(b) vested in Council or under the control of Council and\nwhich it has a duty to maintain.\n“Council Meeting” means an Ordinary Meeting or a Special\nMeeting of Council.\n“Council Reserve” means Council land that is:\n(a) a sports ground; or\n(b) a park; or\n(c) a nature reservation; or\n(d) a facility provided or used in association with activities\nat a sporting ground, park or nature reservation; or\n(e) a place specified in the Procedure and Protocol Manual;\nor\n(f) a reserve, as declared by resolution of the Council; or\n(g) purchased by, leased or otherwise provided to or\nmanaged or controlled by Council for a recreation, cultural\nor entertainment purpose.\n“Council Waste Depot” includes:\n(a) any depot or station for the collection or transfer of Waste;\nor\n(b) any Waste disposal landfill site, operated by or on\nbehalf of Council.\n“Councillor” means an elected person who holds the\noffice of a member of Council.\n“Delegate” means a delegate appointed on the nomination of\nCouncil.\n“Election Period” means the election period as defined in\nsection 3 of the Act.\n“Extraordinary Vacancy” means an extraordinary vacancy\nas described in section 69(1) of the Act.\n“Fire” includes smouldering or causing smoke (whether\nor not there is a conflagration) but does not include:\n(a) a fire lit in the course of official duties by a member of a\nFire Brigade;\n(b) a domestic appliance; or\n(c) a tool of trade.\n“Footpath Trading Policy” means the code regulating\nactivities that occur on the footpaths as adopted by Council by\nresolution dated 17 September 2007 as amended by Council\nfrom time to time.\n“General Election” means a general election as described in\nsection 31 of the Act.\n“Director” means a member of staff occupying a second-level\nposition in the organisational structure of the organisation as\napproved by Council.\n“Goods” includes food or services.\n“Graffiti” includes any inscriptions or drawings scribbled,\nscratched, sprayed or otherwise applied, as determined by\nCouncil, on any surface.\n“Hard Waste” means garden refuse, any rubbish of a size,\nshape, nature or volume that cannot be contained in an\nApproved Receptacle including any brick, concrete, masonry\nor engine parts and any other type of rubbish prescribed by\nCouncil.\n“Liquor” means a beverage intended for human consumption\nwith an alcoholic content greater than 0.5 per centum by\nvolume at a temperature of 20 degrees Celsius.\n“Litter Device” means an apparatus designed for the\npurpose of removing Animal excrement and includes a paper\nor plastic bag.\n“Manager” includes:\n(a) the person for the time being holding the office of\nManager of a swim centre;\n(b) any person from time to time acting as Manager of a swim\ncentre;\n(c) any person from time to time appointed or authorised by\nCouncil to deal with, form an opinion, or act in regard to\nany act, matter or thing required or authorised to be dealt\nwith or acted in regard to by a Manager;\n(d) the person for the time being holding the office of Library\nCoordinator, or the person in charge of each branch library\nor history service, or senior on Duty Officer;\n(e) the person for the time being holding the office of Director\nor Manager of the City of Stonnington; and\n(f) any person holding the office of or from time to time acting\nas Manager of a municipal building.\n“Material or Substance” includes undergrowth, scrub,\nbracken, ferns, weeds, stubble and grass (whether alive or\ndead and whether standing or not standing).\n“Mayor” means the Mayor of Council and any person acting\nas Mayor.\n“Meeting” means an Ordinary or a Special meeting of Council,\na Special Committee meeting or an Advisory Committee\nmeeting.\n“Member” means a Councillor or a member of a Special\nCommittee Meeting.\n“Motor Vehicle” has the same meaning as in the Road Safety\nAct 1986.\n“Municipal District” means Council’s municipal district.\n“Municipal Place” means the area which the public as the\npublic may go (whether an admission fee is required or not)\nof a Library, building, golf course or swimming pool that is\nowned, managed or under the control of Council.\n“Notice to Comply” means a Notice to Comply given\nunder clause 11 specifically provided for in any other clause.\n“Occasional Event” means a gathering of 30 or more people\nfor any purpose.\n“Ordinary Meeting” means an ordinary meeting of\nCouncil as described in section 83(a) of the Act.\n“Penalty Unit” has the same meaning as set out in\nsection 110 of the Sentencing Act 1991.\n“Permit”, when used as a noun, means a written permit issued\nunder this Local Law.\n“Personal explanation” means an explanation about an action\nor statement where that action or statement reflects, or may\nreflect, on the personal qualities, conduct or reputation of the\nperson making the explanation.\n“Planning Scheme” means the Stonnington Planning Scheme\nor any replacement scheme.\n“Principal Local Law” means the General Local Law\nNo.1 made by Council.\n“Public Body” means any government department or\nmunicipal Council or body established for a public purpose by\nan Act of the Parliament of Victoria, any other state or territory of\nthe Commonwealth, or the Commonwealth.\n“Public Place” has the same meaning as in the Summary\nOffences Act 1966.\n“Road” has the same meaning as in the Local Government\nAct 1989.\n“Segway” means a two wheeled self-balancing scooter.\n“Sell” includes:\n(a) barter, offer or attempt to sell, receive for sale, have\nin possession for sale, expose for sale, send, forward\nor deliver for sale, or allow to be sold or offered for\nsale; and\n(b) sell for re-sale.\n“Service Centre” means an administrative office of\nthe Council.\n“Special Committee” means a Special Committee established\nby Council under section 86 of the Act.\n“Special Meeting” means a special meeting of Council\nas described in section 83(b) of the Act.\n“Statutory Meeting” means a meeting of Council at which the\nMayor is elected, as described in section 84A of the\nAct or as called under clause 26.\n“Vehicle” has the same meaning as in the Road Safety\nAct 1986.","proposals":["P20"],"disposition":"Rewrite"},{"id":"6","part":1,"partTitle":"Preliminary","title":"Application of the Local Law","tags":["D"],"owner":"Governance & Legal","text":"Application of the Local Law\n(1) This Local Law applies throughout the whole of the\nMunicipal District.\n(2) Nothing in this Local Law relating to an Animal in general or\na dog in particular prevents:\n(a) a person being entitled at all times and in all places to\nbe accompanied by an Assistance Animal; or\n(b)  a member of the police force or government agency in\ncharge of a dog from carrying out their law enforcement\nduties.\n(3) This Local Law does not apply to an Authorised Officer or a\nmember of Council staff in the course of carrying out that\nperson’s powers and duties.\n(4) This Local Law does not apply to a person engaged to\nundertake any activity on behalf of Council.\n(5) No footnote in this Local Law shall be taken to form part of\nthe Local Law.\n(6) Explanatory notes shall not be taken to form part of the\nLocal Law. They are provided to assist understanding.","proposals":[],"disposition":"Retain"},{"id":"7","part":1,"partTitle":"Preliminary","title":"Council Positions","tags":["D"],"owner":"Governance & Legal","text":"Council Positions\n(1) A reference to a person by way of that person’s position with\nCouncil includes a person:\n(a) authorised to carry out the powers, duties and\nfunctions of that position at Council;\n(b) acting in that capacity; or\n(c) if that position in Council ceases to exist, any\nperson exercising any power, duty or function\nthat was previously a power, duty or function\nof the previous position.","proposals":[],"disposition":"Retain"},{"id":"8","part":1,"partTitle":"Preliminary","title":"Conflict with Other Legislation","tags":["D"],"owner":"Governance & Legal","text":"Conflict with Other Legislation\n(1) This Local Law does not apply where any act or thing\nis authorised by or under the Planning Scheme.\nAdministration\nof this Local Law","proposals":[],"disposition":"Retain"},{"id":"9","part":2,"partTitle":"Administration of this Local Law","title":"Exercise of Discretions","tags":["D"],"owner":"Governance & Legal","text":"Exercise of Discretions\n(1) In exercising a discretion in this Local Law, the matters that\nCouncil are to have regard to include:\n(a) the objectives and purposes of this Local Law;\n(b) any standards and codes of practice adopted by\nCouncil from time to time; and\n(c) any guidelines adopted by Council from time to time.\n(2) Council may prepare guidelines for use by Council, a\nmember of Council staff, Authorised Officers and other\npersons for the purposes of this Local Law.\n(3) Guidelines prepared by Council must not be inconsistent\nwith the objectives of this Local Law or with the standards\nand codes of practice as adopted by Council.\n(4) In preparing guidelines, Council must have regard to the\nobjectives of this Local Law and the standards and codes of\npractice as adopted by Council.","proposals":[],"disposition":"Retain"},{"id":"10","part":2,"partTitle":"Administration of this Local Law","title":"Register of Determinations","tags":["D"],"owner":"Governance & Legal","text":"Register of Determinations\n(1) A standard, code of practice or guideline adopted by\nCouncil for the purposes of this Local Law must be\nmaintained by the Chief Executive Officer in a register\nkept for that purpose.\n(2) The register must be available for inspection at the\noffice of Council during normal business hours.","proposals":[],"disposition":"Retain"},{"id":"11","part":2,"partTitle":"Administration of this Local Law","title":"Direction of Council: Notice to Comply","tags":["N"],"owner":"Governance & Legal","text":"Direction of Council: Notice to Comply\n(1) Council may, by a Notice to Comply, make any reasonable\ndirection to a person:\n(a) to remedy any situation that, in the opinion of Council,\nconstitutes a breach of this Local Law; or\n(b) to do anything specifically provided in this Local Law\nand being the subject of a Notice to Comply,\nand the person must comply with that direction.\n(2) Council may determine the form of a Notice to Comply\ncontained in the Procedure and Protocol Manual.","proposals":[],"disposition":"Amend"},{"id":"12","part":2,"partTitle":"Administration of this Local Law","title":"Time to Comply","tags":["N"],"owner":"Governance & Legal","text":"Time to Comply\n(1) A Notice to Comply must state the time and date by which\nthe notice must be complied.\n(2) The time required by a Notice to Comply served under this\nLocal Law must be reasonable in the circumstances, and\nwhat will be reasonable will vary depending on the matters\nto be remedied; however, the following should be taken into\naccount, where applicable:\n\n(a) the amount of work involved;\n(b) the degree of difficulty in remedying the situation;\n(c) the availability of necessary materials or other necessary\nitems;\n(d) climatic conditions;\n(e) the degree of risk or potential risk; and\n(f) any other relevant matter.","proposals":[],"disposition":"Amend"},{"id":"13","part":2,"partTitle":"Administration of this Local Law","title":"Service of Notice to Comply","tags":["N"],"owner":"Governance & Legal","text":"Service of Notice to Comply\nA Notice to Comply may be served or given pursuant to section\n315 of the Local Government Act 2020.","proposals":[],"disposition":"Not started"},{"id":"14","part":2,"partTitle":"Administration of this Local Law","title":"Failure to Comply with a Notice to Comply","tags":["N","I"],"owner":"Governance & Legal","text":"Failure to Comply with a Notice to Comply\nA person who fails to comply with a Notice to Comply is guilty\nof an offence.","proposals":[],"disposition":"Not started"},{"id":"15","part":2,"partTitle":"Administration of this Local Law","title":"Power of Authorised Officers to Act in Urgent Circumstances","tags":["N"],"owner":"Governance & Legal","text":"Power of Authorised Officers to Act in Urgent\nCircumstances\n(1) An Authorised Officer may in urgent circumstances\narising out of a failure to comply with this Local Law take\nimmediate action to remedy the situation without the\nnecessity to serve a Notice to Comply if:\n(a) their considers the circumstances or situation\nto be sufficiently urgent and that the time involved or\ndifficulties associated with the serving of a Notice to\nComply may place a person, Animal, property or\nthing at risk or in danger; and\n(b) details of the circumstances and remedying action\nare as soon as possible forwarded to the person\non whose behalf the action was taken.\n(2) The action taken by an Authorised Officer under sub-clause\n(1) must not extend beyond what is reasonably necessary to\nremedy the risk or danger involved.","proposals":[],"disposition":"Not started"},{"id":"16","part":2,"partTitle":"Administration of this Local Law","title":"Appeals","tags":["D"],"owner":"Governance & Legal","text":"Appeals\n(1) Any person who is aggrieved by a direction or Notice to\nComply may, within 28 days after the date of issue of the\ndirection or notice, apply to Council to be heard and may\nmake a written submission for consideration by Council.\n(2) Notwithstanding that a person has made application to\nCouncil in sub-clause (1) their is not relieved of the\nobligation to comply with the direction or Notice to Comply.","proposals":["P23"],"disposition":"Amend"},{"id":"17","part":2,"partTitle":"Administration of this Local Law","title":"Compliance with Directions and Notices","tags":["N"],"owner":"Governance & Legal","text":"Compliance with Directions and Notices\n(1) Where:\n(a)  section 117 of the Local Government Act 2020 does\nnot apply; and\n(b) the person given the direction or served with a\nNotice to Comply fails to comply with the direction\nor notice.\nCouncil or any other person, with the approval of Council, may\nenter upon any land on which there is any such failure to\ncomply and do all such acts, matters or things that are required\nto comply with the direction or Notice to Comply.\nAll costs and expenses incurred by Council in carrying out any\nacts, matters or things described in sub-clause (1) are a debt\ndue to Council from the person on whom the direction or Notice\nto Comply was given or served.","proposals":[],"disposition":"Not started"},{"id":"18","part":2,"partTitle":"Administration of this Local Law","title":"Delegations and Authorisations","tags":["D"],"owner":"Governance & Legal","text":"Delegations and Authorisations\nIn accordance with section 114 of the Act, Council hereby\ndelegates to the Chief Executive Officer and Authorised Officers\nall the powers, discretions, authorities and considerations of\nCouncil under this Local Law including the powers, discretions,\nauthorities and considerations to make a direction by Notice to\nComply, the powers, discretions and authority to issue or refuse\nPermits, fix conditions and durations relevant to Permits, cancel\nor suspend Permits, require additional information, apply\nguidelines, standards or codes of practice of Council, waive the\nneed for any Permit or to do any act, matter or thing necessary\nor incidental to the exercise of any function or power by Council.","proposals":[],"disposition":"Not started"},{"id":"19","part":2,"partTitle":"Administration of this Local Law","title":"Incorporation of Documents","tags":["D"],"owner":"Governance & Legal","text":"Incorporation of Documents\n(1) The document titled “Procedure and Protocol Manual”,\nas made by Council and published from time to time\non Council’s website, is hereby incorporated into this Local\nLaw.\n(2) The document titled “Keeping of Animals Policy”, as made\nby Council and published from time to time on Council’s\nwebsite, is hereby incorporated into this Local Law.\n(3) The document titled “Footpath Trading Policy”, as made by\nCouncil and published from time to time on Council’s\nwebsite, is hereby incorporated into this Local Law.\nThe Common\nSeal","proposals":[],"disposition":"Not started"},{"id":"20","part":3,"partTitle":"The Common Seal","title":"Purpose of the Common Seal","tags":["D","X"],"owner":"Governance & Legal","text":"Purpose of the Common Seal\nThe purpose of this Part is to regulate the use of the Common\nSeal and prohibit unauthorised use of the Common Seal or any\ndevice resembling the Common Seal.","proposals":["P20"],"disposition":"Revoke"},{"id":"21","part":3,"partTitle":"The Common Seal","title":"Who Keeps the Common Seal","tags":["D","X"],"owner":"Governance & Legal","text":"Who Keeps the Common Seal\nThe Chief Executive Officer or a Director must keep the\nCommon Seal in safe custody.","proposals":["P20"],"disposition":"Revoke"},{"id":"22","part":3,"partTitle":"The Common Seal","title":"Signatures to Accompany the Common Seal","tags":["D","X"],"owner":"Governance & Legal","text":"Signatures to Accompany the Common Seal\nEvery document to which the Common Seal is affixed\nmust be signed by a Councillor and either the Chief\nExecutive Officer or a Director.","proposals":["P20"],"disposition":"Revoke"},{"id":"23","part":3,"partTitle":"The Common Seal","title":"Affixing the Common Seal","tags":["D","X"],"owner":"Governance & Legal","text":"Affixing the Common Seal\n(1) The Common Seal may be affixed to a document for\nthe purpose of giving effect to a decision:\n(a) made by Council resolution;\n(b) made by resolution of a Special Committee\ncomposed solely of Councillors;\n(c) made by resolution of a Special Committee under\ndelegation; or\n(d) made by the Chief Executive Officer under delegation.\n(2) The Chief Executive Officer must ensure a Common Seal\nregister is kept that records, for each time the Common Seal\nis affixed to a document:\n(a) the names of the people who signed as witnesses;\n(b) a description of the document to which the Common\nSeal was affixed;\n(c) the date on which the Common Seal was affixed;\n(d) the date of the authorising Council resolution.\n(3) The sealing clause is:\n“The COMMON SEAL of the\nSTONNINGTON CITY COUNCIL\nwas hereunto affixed in the\npresence of:\n\nCouncillor\n\nChief Executive Officer/Director”\n(4) The sealing clause to be used by the Chief Executive Officer\nunder delegation is:\n“Signed under delegation on behalf of Stonnington City\nCouncil by:\n\nChief Executive Officer\n\nin the presence of\n\nWitness”","proposals":["P20"],"disposition":"Revoke"},{"id":"24","part":3,"partTitle":"The Common Seal","title":"Unauthorised Use of the Common Seal","tags":["I","X"],"owner":"Governance & Legal","text":"Unauthorised Use of the Common Seal\nA person must not use the Common Seal or any\ndevice resembling the Common Seal without the authority\nof Council.\n\nCouncil administration\n- repealed\nManagement\nof Drains","proposals":["P20"],"disposition":"Revoke"},{"id":"104","part":5,"partTitle":"Management of Drains","title":"Interference with Council Drains, Sewers or Similar","tags":["P","I"],"owner":"City Works & Assets","text":"Interference with Council Drains, Sewers or Similar\n(1) A person must not, without a Permit:\n(a) destroy;\n(b) damage;\n(c) interfere with;\n(d) excavate; or\n(e) tap into,\nany drain vested in Council.\n(2) A person must not, without a Permit:\n(a) destroy;\n(b) damage;\n(c) interfere with;\n(d) excavate; or\n(e) tap into,\nany sewer, watercourse, ditch, creek, gutter, tunnel, bridge,\nlevee, culvert or fence which is in, on or under Council\nLand.","proposals":[],"disposition":"Retain"},{"id":"105","part":5,"partTitle":"Management of Drains","title":"Maintenance of Drains","tags":["N"],"owner":"City Works & Assets","text":"Maintenance of Drains\n(1) The owner and occupier of land must ensure that any drain\non the land that is not vested in Council or another public\nauthority is operated for the purpose for which it was\ndesigned.\n(2) The owner and occupier of land must ensure that any drain\non the land that is not vested in Council or another public\nauthority is maintained in a condition that is not unsightly or\na nuisance.","proposals":[],"disposition":"Retain"},{"id":"106","part":5,"partTitle":"Management of Drains","title":"Drainage of Properties","tags":["N"],"owner":"City Works & Assets","text":"Drainage of Properties\n(1) The owner and occupier of land must ensure:\n(a) that the land is adequately drained to the satisfaction of\nan Authorised Officer;\n(b) that the land does not discharge water that is a nuisance\nto an owner or occupier of adjoining land; and\n(c) water does not discharge from an air conditioner or\nother equipment onto a footpath.\n\nVehicle\nCrossings","proposals":[],"disposition":"Retain"},{"id":"107","part":6,"partTitle":"Vehicle Crossings","title":"Vehicle Crossings","tags":["N","I"],"owner":"City Works & Assets","text":"Vehicle Crossings\n(1) The owner and occupier of land must ensure that each\npoint of vehicular access from a Road to the land has\nan appropriately constructed vehicle crossing.\n(2) A person must not cause, allow or drive a Motor\nVehicle from or onto land other than by an appropriately\nconstructed vehicle crossing.\n(3) Council may serve a Notice to Comply on the owner\nand occupier of land requiring the repair, removal or\nreplacement of a vehicle crossing.","proposals":["P14"],"disposition":"Retain"},{"id":"108","part":6,"partTitle":"Vehicle Crossings","title":"Temporary Vehicle Crossings","tags":["N","I"],"owner":"City Works & Assets","text":"Temporary Vehicle Crossings\n(1) A person must construct a temporary vehicle crossing, to\nthe satisfaction of an Authorised Officer, where it is likely that\na Motor Vehicle accessing or leaving land, by reason of its\nnature, size or weight, may damage a kerb, gutter, nature\nstrip, footpath or vehicle crossing.\n(2) If a temporary vehicle crossing has been constructed in\naccordance with sub-clause (1), a person must not allow a\nMotor Vehicle to enter the land or exit the land other than by\nusing the temporary vehicle crossing.\n(3) A person who fails to comply with sub-clause (1) or (2) must\nrepair any damage caused to the kerb, gutter, nature strip,\nfootpath, vehicle crossing or other latent damage or,\nif Council elects to repair any damage, pay to Council\nthe cost of repairing the damage.","proposals":[],"disposition":"Retain"},{"id":"109","part":6,"partTitle":"Vehicle Crossings","title":"Repair of Vehicle Crossings","tags":["N"],"owner":"City Works & Assets","text":"Repair of Vehicle Crossings\nThe owner and occupier of land must ensure that each vehicle\ncrossing to that land from an adjacent Road and any channel or\npipe under or forming part of that crossing are maintained.\nProtection of\nCouncil Land","proposals":[],"disposition":"Retain"},{"id":"110","part":7,"partTitle":"Protection of Council Land","title":"Defacing/Damaging Council Land","tags":["P","I"],"owner":"Parks & Environment","text":"Defacing/Damaging Council Land\n(1) A person must not, without a Permit, destroy, damage,\nremove or interfere with:\n(a) Council Land;\n(b) any building, structure or any other thing on\nCouncil Land;\n(c) anything belonging to Council on Council Land\nunless allowed by the Council, whether under this Local\nLaw or otherwise; and\n(d) any Council property or assets owned or managed\nby Council and located on or in any Council Land.\n(2) A person must not authorise or engage any other person to\nundertake the activities in sub-clause (1).\n(3) A person must not:\n(a)  interfere with or use Council assets in such a way that\ncauses damage or detriment; or\n(b)  any other person could be injured or suffer loss as a\nresult of that interference or use; and\n(c)  attach anything to the Council asset.\n(4) Notwithstanding sub-clause (1), a person may:\n(a)  plant vegetation on; or\n(b) otherwise modify the appearance of the nature strip\nimmediately outside land which they occupy if such\nplanting or modification complies with the Nature Strip\nPlanting Policy.","proposals":["P04"],"disposition":"Not started"},{"id":"111","part":7,"partTitle":"Protection of Council Land","title":"Lighting Fires","tags":["P","I"],"owner":"Parks & Environment","text":"Lighting Fires\n(1) A person must not, without a Permit, light or allow to be\nlit on or in any Council Land (except where permitted in\na Council Reserve):\n(a) any fire; or\n(b) a barbecue.","proposals":[],"disposition":"Not started"},{"id":"112","part":7,"partTitle":"Protection of Council Land","title":"Trees or Plants Causing Damage to Council Land","tags":["N"],"owner":"Parks & Environment","text":"Trees or Plants Causing Damage to Council Land\nThe owner and occupier of land must not allow a tree or plant\non that land to cause damage to or interfere with Council Land\nor a building, structure or anything on Council Land.","proposals":[],"disposition":"Retain"},{"id":"113","part":7,"partTitle":"Protection of Council Land","title":"Trees and Plants on Council Land","tags":["P","I"],"owner":"Parks & Environment","text":"Trees and Plants on Council Land\n(1) A person must not, without a Permit, remove, damage, kill,\ndestroy or adversely affect the health of any part of the tree\nor plant on Council Land.\n(2) A person must not, without a Permit, prune, cut, trim,\nor interfere with in any way, any tree or plant on\nCouncil Land.","proposals":["P04"],"disposition":"Not started"},{"id":"114","part":7,"partTitle":"Protection of Council Land","title":"Temporary Buildings on a Road","tags":["P","I"],"owner":"Parks & Environment","text":"Temporary Buildings on a Road\nA person must not, without a Permit, for the purpose of enabling\nany works to be carried out in, on or over a Road:\n(a) occupy or fence off a Road, or part of a Road; or\n(b) erect a structure or temporary crossing for vehicles\nin, on or over a road.","proposals":[],"disposition":"Not started"},{"id":"115","part":7,"partTitle":"Protection of Council Land","title":"Damage to Kerbs, Paths and Other Assets from Building Work","tags":["P","I"],"owner":"Parks & Environment","text":"Damage to Kerbs, Paths and Other Assets from\nBuilding Work\n(1) If a Building Permit is required for building work on land and\nthat building work, person or class of persons have not\nbeen exempted (in accordance with the Procedure and\nProtocol Manual):\n(a) the owner of the relevant land;\n(b) the builder engaged to carry out building work on\nthe land;\n(c) any appointed agent; or\n(d) any demolition contractor engaged to demolish some\nobject on the land as part of the building work must:\n(a) not carry out or allow to be carried out building\nwork on that land unless a Permit has been\nobtained;\n(b) not carry out or allow to be carried out building\nwork on that land in breach of any conditions of a\nPermit that has been obtained; and\n(c) pay any Asset Protection Permit bond determined\nby Council from time to time, in accordance with\nthe Procedure and Protocols Manual.\n(2) Council may exempt any building work, person or\nclass of persons from the requirement of a Permit.\nUse of\nMunicipal Places","proposals":["P11"],"disposition":"Amend"},{"id":"116","part":8,"partTitle":"Use of Municipal Places","title":"Prohibition of Entry","tags":["P","I"],"owner":"Recreation & Leisure","text":"Prohibition of Entry\nA person must not, without a Permit or in accordance with any\nother law:\n(a)  enter or remain in a Municipal Place without paying the\nappropriate fee (if any);\n(b)  enter or remain in a Municipal Place if that person is less\nthan 10 years of age (except if in the care of an adult\nguardian);\n(c)  enter or remain in a Municipal Place if that person has\nbeen refused entry, excluded from entering or directed\nto leave a Municipal Place by a person who is\nauthorised to do so;\n(d)  re-enter a Municipal Place within 24 hours (or such\nother time as directed) after being excluded from a\nMunicipal Place;\n(e)  enter a Municipal Place if that person is suffering from\nany disease that presents a risk to the health of any\nother person;\n(f)  enter or leave a Municipal Place other than through an\nentrance or exit provided for the public for that purpose\n(unless the person is to use a specifically designated exit\nor entry); or\n(g)  have in their possession in or on a Municipal Place any\nLiquor or other illicit drug which is illegal to possess, or\nany legal drug which is used in an illegal manner.","proposals":[],"disposition":"Not started"},{"id":"117","part":8,"partTitle":"Use of Municipal Places","title":"Behaviour","tags":["I"],"owner":"Recreation & Leisure","text":"Behaviour\n(1)  A person must not while in or on a Municipal Place:\n(a)  behave in a manner that is offensive, indecent, insulting\nor riotous or engage in any conduct that is dangerous or\nthat interferes with any other person;\n(b)  act contrary to any sign or procedure in respect of the\nuse of the Municipal Place;\n(c)  have any Animal in their possession other than an\nAssistance Animal;\n(d)  eat or drink other than in an authorised area;\n(e)  sell or hire any Goods in the Municipal Place other than\nwith the written consent of a Manager or in accordance\nwith a Permit;\n(f)  distribute, leave, post or display any pamphlet, poster,\nhandbill or literature other than with the consent of a\nManager.\n(2) Council may determine any sign or procedure for the\npurpose of clause 1(b).\n(3) Council or an Authorised Officer may erect and display any\nsign or procedure for the purpose of clause 1(b).","proposals":["P22"],"disposition":"Under review"},{"id":"118","part":8,"partTitle":"Use of Municipal Places","title":"Terms and Conditions of Admission to, or Membership of, a Municipal Place","tags":["I"],"owner":"Recreation & Leisure","text":"Terms and Conditions of Admission to, or Membership\nof, a Municipal Place\n(1) A person must:\n(a) comply with the terms and conditions of a membership\nor ticket of admission to any Municipal Place; and\n(b) not sell, transfer, give to or share a membership or ticket\nof admission to any Municipal Place with any other\nperson.","proposals":[],"disposition":"Retain"},{"id":"119","part":8,"partTitle":"Use of Municipal Places","title":"Prohibited Articles","tags":["I"],"owner":"Recreation & Leisure","text":"Prohibited Articles\n(1) A person must not, without the consent of Council or a\nManager, bring into, cause or allow to be brought into or\nremain in any part of a Municipal Place:\n(a) any wheeled Vehicle, skateboard, scooter or similar\nthing other than a pram or pusher with a child, a\nwheelchair for the purpose of assisting a person with a\ndisability or a trolley or other similar device used in the\nprocess of assisting the delivery or removal of goods;\n(b) any ball or other inflatable rubber or plastic article that\nmay interfere with the use or enjoyment of any person of\nthe Municipal Place or any part of it;\n(c) any glass or thing containing glass other than a\nwristwatch, spectacles or thing for testing or sampling\npurposes pursuant to Regulations made under the\nPublic Health and Wellbeing Act 2008; or\n(d) any chemical, substance, liquid or powder that, in\nthe opinion of a member of Council staff, is dangerous\nto health or has the potential to foul, pollute or soil\nany part of a Municipal Place or to cause discomfort to\nany person in a Municipal Place by any means\nwhatsoever.","proposals":[],"disposition":"Under review"},{"id":"120","part":8,"partTitle":"Use of Municipal Places","title":"Directions","tags":["N","I"],"owner":"Recreation & Leisure","text":"Directions\n(1) A person on Council Land must at all times observe\nand comply with any reasonable direction of a member\nof Council staff.\n(2) A person who fails to comply with a direction given under\nsub-clause (1) is guilty of an offence.\nCouncil\nReserves","proposals":["P23"],"disposition":"Rewrite"},{"id":"121","part":9,"partTitle":"Council Reserves","title":"Access to Council Reserves","tags":["P","I"],"owner":"Recreation & Leisure","text":"Access to Council Reserves\n(1) A person must not, without a Permit, construct an opening\nor gate in a fence to access a Council Reserve from\nresidential land.\n(2) A person must not use an opening or gate in a fence\nto access a Council Reserve from residential land unless in\naccordance with a Permit.\n(3)  A person must not, without a Permit, access residential land\nfrom a Council Reserve for the purpose of Building Activity.\n(4) A person must not, without a Permit, carry out any Building\nActivity in a Council Reserve.","proposals":[],"disposition":"Under review"},{"id":"122","part":9,"partTitle":"Council Reserves","title":"Use of Council Reserves","tags":["P","I"],"owner":"Recreation & Leisure","text":"Use of Council Reserves\nA person must not, without a Permit, in or on any\nCouncil Reserve:\n(a) pitch, erect or occupy any tent, marquee or temporary\nshelter, or any jumping castle, amusement ride or other\nrecreational infrastructure;\n(b) operate or allow to be operated any amusement for\nwhich a charge is made;\n(c) light any Fire or allow any Fire to remain alight unless in\na fireplace provided by Council;\n(d) use a Barbecue other than a gas Barbecue;\n(e) hold any circus, carnival, fair, event, commercial or\npromotional activity;\n(f) conduct or attend any rally, procession, demonstration\nor other public gathering;\n(g) sell, hire or give away any Goods or other thing;\n(h) erect, fix, place or display any advertisement;\n(i) seek a collection of money for any purpose;\n(j) conduct or celebrate any wedding;\n(k) conduct an Occasional Event;\n(l) conduct, participate, prepare or train for any competitive\ngame or sport;\n(m) engage in, play or practice any game that may interfere\nwith the use or enjoyment of the reserve by any other\nperson;\n(n) unless the person is a player, official or competitor\nat any sports match or sports gathering authorised\nunder this clause, enter or remain within or upon the\nplaying arena during the progress of such sports match\nor sports gathering;\n(o) conduct personal training services for individuals or\ngroups for which a charge is made;\n(p) ride or drive any horse or Motor Vehicle, except the\nparking of any Motor Vehicle in any parking area set\naside for that purpose by Council;\n(q) park or leave standing any Motor Vehicle except in any\nparking area set aside for that purpose by Council;\n(r) use or operate a motorised toy car, segway or other\nmotorised recreational vehicle or toy;\n(s) land helicopters or hot air balloons other than in an\nemergency; or\n(t) enter any plot or area that is set aside for the planting or\ngrowing of plants.","proposals":["P18"],"disposition":"Amend"},{"id":"123","part":9,"partTitle":"Council Reserves","title":"Restrictions","tags":["N","I"],"owner":"Recreation & Leisure","text":"Restrictions\n(1) A person must not:\n(a) fly or allow to be flown any model aeroplane, remote-\ncontrolled helicopter or drone over a Council Reserve\nunless the Council Reserve is exempted for this\npurpose and specified in the Procedure and Protocol\nManual.\n(aa) in any Council Reserve engage in, play or\npractice golf or archery;\n(b) enter a Council Reserve unless that person pays\nthe required charge or entry fee (where applicable);\n(c) consume Liquor in a Council Reserve or designated\npart of a reserve unless in accordance with any\nexemption specified in the Procedure and\nProtocol Manual;\n(d) interfere with or remove a structure, notice, building,\nseat, tree or plant;\n(e) get on or over any fence or gate;\n(f) spit upon or otherwise foul any path or structure;\n(g) shoot, attempt to shoot, snare or attempt to snare,\ndestroy or attempt to destroy any Animal;\n(h) interfere with, hinder or interrupt any member\nof Council staff or a member of a management\ncommittee of the reserve engaged in any duty;\n(i) behave in a manner that is offensive, indecent,\ninsulting, riotous or disorderly or engage in any conduct\nthat is dangerous or that interferes with any other\nperson;\n(j) ride a bicycle, children’s toy, skateboard or skates\nin a manner that may interfere with the use or\nenjoyment of any part of the Council Reserve by\nany other person;\n(k) remain at any time when directed to leave the reserve\nby an Authorised Officer or member of Council staff\n(even though a fee or charge for admission may have\nbeen paid);\n\n(l) do anything that may endanger a person; or\n(m) act contrary to a sign erected or authorised by\nCouncil or a management committee in respect\nto the use of the reserve or the conduct of a\nperson in the reserve.\n(2) If an Authorised Officer believes that a person is\ncontravening or has contravened sub-clause (1)(c),\nthe Authorised Officer may direct the person to seal\nany container or dispose of the contents of any\nunsealed container.\n(3) A person who fails to obey a direction of an Authorised\nOfficer under sub-clause (2) is guilty of an offence.\n(4) Council may designate any area within a Council\nReserve for the purpose of clause 1(a).\n(5) Council may determine any sign for the purpose of\nclause 1(m).\n(6) Council or an Authorised Officer may erect and display any\nsign for the purpose of clause 1(m).\n(7) Council may prescribe the consumption of liquor in a\nCouncil Reserve or prescribed part of a reserve other than\nin accordance with the requirements specified in the\nProcedure and Protocol Manual;\n(8) Council may designate a Council Reserve or part of\na Council Reserve for the purpose of clause 1(c).\n(9) Council may exempt a Council Reserve or part of a Council\nReserve for the purpose of clause 1(c).\n(0$2) Council may prescribe an event that is exempt from\nthe requirement of clause 1(c).\nPar t 10  –\nRoads, Public\nPlaces and\nCouncil Land","proposals":["P01","P13","P24"],"disposition":"Amend"},{"id":"124","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Application","tags":["D"],"owner":"Local Laws & Compliance","text":"Application\nThis Division applies to Roads, Public Places and Council Land\nwithin the Municipal District.","proposals":[],"disposition":"Retain"},{"id":"125","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Shopping Trolleys","tags":["I"],"owner":"Local Laws & Compliance","text":"Shopping Trolleys\n(1) A person must not make available for use, or permit to\nbe used, a shopping trolley that does not have a device that\nis attached and used so as to ensure the return of\nthe shopping trolley to an area specifically designated for\nstoring shopping trolleys.\n(2) Sub-clause (1) does not apply if the person makes available\nor permits to be used 25 shopping trolleys or less or where\nthe trolley is fitted with a baby capsule.\n(3) Council may exempt a person or a class of people from the\napplication of sub-clause (1).\n(4) A person who makes an application to Council for\nexemption from sub-clause (1) must not make or cause\nto be made any false representation.\n(5) A person who makes or causes to be made any false\nrepresentation is guilty of an offence.\n(6) A person who operates a supermarket or similar activity\nwhere shopping trolleys are made available for use or are\npermitted to be used must ensure that a shopping trolley is\nnot left on any Road or other Public Place.\n(7) A person must not leave, cause to be left or authorise\nanother person to leave a shopping trolley on any Road or\nother Public Place.\n(8) An Authorised Officer or a person engaged by Council may\nseize and impound any shopping trolley that is being made\navailable for use, or which is being used, in contravention of\nthis Local Law.\n(9) As soon as practicable after the impoundment of any\nshopping trolley an Authorised Officer must, if the identity of\nthe person who owns the shopping trolley can be identified,\nserve a notice of impoundment on that person.\n(0$2) Any impounded shopping trolley must be returned to the\nowner of that shopping trolley after:\n(a) payment of any fees, as determined from time to time by\nCouncil, have been paid in full; and\n(b) evidence of ownership of the shopping trolley is\nprovided to the satisfaction of the Authorised Officer.\n(1$2) Any impounded shopping trolley not claimed by the owner\nwithin the time specified on the notice of impoundment or\nwithin 14 days of the impounding, where the owner of the\ntrolley cannot be ascertained, may be disposed of by an\nAuthorised Officer.","proposals":["P05"],"disposition":"Amend"},{"id":"126","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Footpath Trading Policy","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Footpath Trading Policy\n(1) The Footpath Trading Policy is incorporated into this\nLocal Law.\n(2) A person must not, without a Permit, on Council Land:\n(a) occupy;\n(b) place any item or thing;\n(c) construct or erect any structure or anything; or\n(d) remove or interfere with any structure or thing.\n(3) A person who contravenes or fails to comply with a\nrequirement of the Footpath Trading Policy imposed on\nthem is guilty of an offence.\n(4) A person who contravenes or fails to comply with a\ncondition of a Permit is guilty of an offence.","proposals":["P02","P19"],"disposition":"Amend"},{"id":"127","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Obstructions","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Obstructions\n(1) A person must not, without a Permit:\n(a) place any item or thing or attach any structure, item or\nthing, on Council Land that creates an obstruction; or\n(b) obstruct or restrict the use of any Road, footpath or\nCouncil Land by any means.\n(2) A person must not, without a Permit, attach any structure,\nitem or thing that overhangs, is on, or is above any Road or\nany other Council Land.","proposals":["P01","P02","P14","P19"],"disposition":"Amend"},{"id":"128","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Repairing Vehicles","tags":["I"],"owner":"Local Laws & Compliance","text":"Repairing Vehicles\n(1) A person must not on any Road or Council Land service,\npaint or dismantle any Motor Vehicle.\n(2) A person must not on any Road or Council Land repair any\nMotor Vehicle, except where necessary to enable\nthat Motor Vehicle to be removed.","proposals":[],"disposition":"Retain"},{"id":"129","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Consumption of Liquor","tags":["P","N","I"],"owner":"Local Laws & Compliance","text":"Consumption of Liquor\n(1) A person must not in a Public Place or within a Motor\nVehicle that is in a Public Place, without a Permit:\n(a) consume any Liquor; or\n(b) have in their possession or control any Liquor\nother than Liquor in a sealed container.\n(2) Sub-clause (1) does not apply in such places as may\nfor the time being be:\n(a) licensed premises within the meaning of the Liquor\nControl Reform Act 1998;\n(b) an area in which the consumption of Liquor is permitted\nin accordance with a licence granted\nunder the Liquor Control Reform Act 1998 or\nthis Local Law; or\n\n(c) an area in which Council has issued a Permit for\nthe consumption of Liquor.\n(3) If an Authorised Officer believes on reasonable grounds that\na person is contravening or has contravened sub-clause (1),\nthe Authorised Officer may direct the person to seal any\ncontainer or dispose of the contents\nof any unsealed container.\n(4) A person who fails to obey a direction of an Authorised\nOfficer under sub-clause (3) is guilty of an offence.","proposals":["P24"],"disposition":"Amend"},{"id":"130","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Mobile Cranes","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Mobile Cranes\nA person must not, without a Permit, place, leave standing or\nuse a crane, travel tower, boom, hydraulic arm, lift, tackle or any\nother machine on or over a Road or Council Land.","proposals":[],"disposition":"Under review"},{"id":"131","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Hoarding, Scaffolding and Overhead Protective Awning","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Hoarding, Scaffolding and Overhead\nProtective Awning\n(1) A person must not, without a Permit, erect any hoarding,\nscaffolding, protective barrier or like structure on a Road,\nPublic Place or Council Land.\n(2)  A person must not, without a Permit, erect any hoarding,\nscaffolding, fencing, temporary fencing or like structure on\nthe boundary of private land on which building works is\nbeing, or is to be, carried out.\n(3) A person must comply with any requirements imposed\non that person in the Procedure and Protocol Manual.\n(4)  Council may prescribe any requirements in relation to the\nrequirements of hoarding, scaffolding, protective barriers or\nlike structures including the nature and form, coverings,\nmaterials, location and maintenance.","proposals":[],"disposition":"Under review"},{"id":"132","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Bulk Rubbish and Storage Containers Left on Roads","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Bulk Rubbish and Storage Containers Left\non Roads\nA person must not, without a Permit, place, leave or permit\nto be left any:\n(a) bulk rubbish container on a Road or Council Land;\n(b) shipping or other storage container on a Road or\nCouncil Land; or\n(c) thing that encroaches on or obstructs the free use\nof a Road or Council Land or that reduces the breadth\nor confines the limits of a Road or Council Land.","proposals":[],"disposition":"Under review"},{"id":"133","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Clothing Bins","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Clothing Bins\nA person must not, without a Permit, place a clothing bin on\nCouncil Land or on a Road.","proposals":["P15"],"disposition":"Amend"},{"id":"134","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Unregistered, Abandoned and Obstructing Vehicles","tags":["I"],"owner":"Local Laws & Compliance","text":"Unregistered, Abandoned and Obstructing Vehicles\n(1) A person must not, on a Road, Public Place or parking area\nvested in or under the control of Council, place any\nunregistered Motor Vehicle or abandon or cause to be\nabandoned any Motor Vehicle.\n(2) Council may impound any abandoned or unregistered\nMotor Vehicle found on any Road or in any Public Place\nor parking area vested in or under the control of Council\nin accordance with the provisions of the Act.\n(3)  A Council may move or impound any vehicle that is causing\nan unlawful obstruction, or that is unlawfully parked or left\nstanding.","proposals":[],"disposition":"Under review"},{"id":"135","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Parking Permits","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Parking Permits\n(1) A person who lives in an area in which a residential parking\npermit scheme operates may make an application to\nCouncil for a residential parking permit.\n(2) A person who has been allocated a residential parking\npermit must not sell, hire out, lease, license or lend to\nanother person or offer to sell, hire out, lease, license or lend\nthat residential parking permit to any other person.\n(3) A person must not purchase, hire, lease, license or receive,\nor offer to purchase, hire, lease, license or receive a\nresidential parking permit from a person who has been\nallocated a residential parking permit.\n(4) The owner and occupier of land on which an advertisement\nis displayed for the sale, hire, offer for purchase or offer for\nhire of a parking permit is guilty\nof an offence.\n(5) A person must not:\n(a) forge or counterfeit a parking permit;\n(b) use a forged or counterfeit parking permit; or\n(c) contravene or fail to comply with the conditions\nof use of a residential parking permit.","proposals":["P14"],"disposition":"Amend"},{"id":"136","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Filming","tags":["P","I"],"owner":"Local Laws & Compliance","text":"Filming\nA person must not, without a Permit, occupy or allow the\noccupation of any Road or Council Land for the purposes of\nfilming for commercial purposes or public exhibition or for the\nplacement of any equipment associated with such activity.","proposals":["P12"],"disposition":"Amend"},{"id":"137","part":10,"partTitle":"Roads, Public Places and Council Land","title":"Toy Vehicles","tags":["P","I","X"],"owner":"Local Laws & Compliance","text":"Toy Vehicles\n(1) For the purpose of this clause a “wheeled recreational\nvehicle” means any mini bike, trail bike, motor bike, motor\nscooter, go-cart, Segway or other vehicle propelled by a\nmotor that is normally used for recreational or transport\npurposes but does not include a motorised wheelchair\nor electric bicycle.\n(2) A person must not, without a Permit, use, or permit a person\nto use, a wheeled recreation vehicle on Council Land or a\nfootpath.\n\nPart 11 –\nStreet Selling,\nCollections and\nDistributions","proposals":["P01"],"disposition":"Amend"},{"id":"138","part":11,"partTitle":"Street Selling, Collections and Distributions","title":"Itinerant Trading","tags":["P","I"],"owner":"Economic Development","text":"Itinerant Trading\n(1) A person must not, without a Permit:\n(a) erect or place on any Council Land or in any Public\nPlace a Vehicle, caravan, trailer, table, stall or other\nsimilar structure for the purpose of selling any Goods;\n(b) sell or attempt to sell any Goods from a property, Road,\nCouncil Land or Public Place adjacent to a Road, to any\nperson who is on a property, Road, Council Land or\nPublic Place;\n(c) have any Good, object or thing on any Council Land or\nany Public Place for sale, hire, transport or use.\n(2) Sub-clause (1) does not apply to:\n(a) newspapers or magazines that are being home\ndelivered; or\n(b) the home delivery of Goods purchased at another\nlocation or online.","proposals":[],"disposition":"Not started"},{"id":"139","part":11,"partTitle":"Street Selling, Collections and Distributions","title":"Street Appeals","tags":["P","I"],"owner":"Economic Development","text":"Street Appeals\n(1) A person must not, without a Permit, in a Public Place,\nsolicit or collect money, gifts or subscriptions for any\npurpose or cause or authorise another person to do so.\n(2) Council may exempt any person, class of person or any\nparticular collection activity from requiring a Permit.","proposals":[],"disposition":"Not started"},{"id":"140","part":11,"partTitle":"Street Selling, Collections and Distributions","title":"Street Promotions","tags":["P","I"],"owner":"Economic Development","text":"Street Promotions\n(1) A person must not, without a Permit, on any Road, Council\nLand or Public Place:\n(a) hand out a document that advertises a political party,\ncommercial event or venture, or is of a fundraising\nnature;\n(b) deliver any public address with or without any sound\namplification equipment;\n(c) spruik, tout or solicit the sale of any Goods;\n(d) conduct any concert, public assembly or public\nevent; or\n(e) participate in any promotional activity.","proposals":[],"disposition":"Not started"},{"id":"141","part":11,"partTitle":"Street Selling, Collections and Distributions","title":"Processions, Street Festivals and Street Parties","tags":["P","I"],"owner":"Economic Development","text":"Processions, Street Festivals and Street Parties\n(1) A person must not, without a Permit, hold, allow to be held\nor participate in or on a Road:\n(a) a street party; or\n(b) a street festival or procession.\nPar t 12  –\nProtection of the\nAmenity of the\nMunicipal District\nDivision 1 – General","proposals":[],"disposition":"Not started"},{"id":"142","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Property Numbers","tags":["N","I"],"owner":"City Amenity","text":"Property Numbers\n(1) Council may from time to time allocate a number\nto an allotment and may from time to time allocate a\ndifferent number to an allotment or otherwise change\nthe numbering.\n(2) The owner or occupier of an allotment to which a number\nhas been allocated by Council must mark the allotment with\nthe number in a form that is legible, visible and clear of\nvegetation and other obstructions and of a minimum size of\n80 mm.\n(3) The owner of occupier of an allotment must ensure\nthat all numbers marking the allotment are:\n(a) made of durable materials;\n(b) kept in a good state of repair;\n(c) renewed as often as may be necessary; and\n(d) located or positioned in accordance with a\ndirection by Council.\n(4) A person must not display a number on an allotment unless\nthe number has been allocated to the allotment\nby the Council.","proposals":[],"disposition":"Retain"},{"id":"143","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Camping and Camping on Council Land or a Road","tags":["P","I"],"owner":"City Amenity","text":"Camping and Camping on Council Land or a Road\n(1) A person must not have more than one (1) caravan on\nresidential land.\n(2) A person must not occupy or allow another person to\noccupy a caravan, tent or other thing on residential land for\nmore than three (3) weeks in a calendar year.\n(3) A person must not, without a Permit, camp on Council\nLand, a Public Place or on any Road in a tent, caravan,\nMotor Vehicle or other temporary or makeshift structure\nunless their is within a caravan park licensed under the\nResidential Tenancies Act 1997.\n(4) A person must not leave any personal goods or effects\non Council Land, Public Place or any Road as part of\nany camp.","proposals":["P08"],"disposition":"Amend"},{"id":"144","part":12,"partTitle":"Protection of the Amenity of the Municipal District","title":"Noise","tags":["N","I"],"owner":"City Amenity","text":"Noise\n(1) The owner, occupier or person in charge of land must\nnot cause or allow noise to emanate from that land that\ndetrimentally affects the amenity of the area.\n(2) A person must not:\n(a) on or adjacent to any Road; or\n(b) in a Motor Vehicle or Vehicle on or adjacent to\nany Road,\nallow noise to emanate that detrimentally affects the amenity\nof the area.\n(3) An owner, occupier or person in charge of land or a\nMotor Vehicle must not:\n(a) install or place (or allow that to occur) on that land\nor in a Motor Vehicle an audible alarm that when\nactivated is audible outside the land or Motor\nVehicle for more than 10 consecutive minutes; or\n(b) allow an audible alarm installed on land or in a Motor\nVehicle to be audi
